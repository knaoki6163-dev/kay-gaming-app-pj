<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>駅の出口探索ゲーム</title>
<style>
  :root {
    --panel: #252525;
    --panel-border: #3d3d3d;
    --accent: #4a90e2;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    min-height: 100%;
    background: radial-gradient(circle at top, #303030 0%, #171717 62%);
    color: #eee;
    font-family: "Segoe UI", "Hiragino Kaku Gothic ProN", Meiryo, sans-serif;
    text-align: center;
    user-select: none;
    -webkit-user-select: none;
  }
  body {
    align-items: center;
    display: flex;
    flex-direction: column;
    gap: 8px;
    min-height: 100vh;
    padding: 12px;
  }
  #title {
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 12px;
    box-shadow: 0 6px 20px rgba(0,0,0,0.25);
    color: #fff;
    font-size: clamp(16px, 4vw, 22px);
    font-weight: bold;
    line-height: 1.35;
    margin: 0;
    max-width: min(100%, 640px);
    padding: 10px 14px;
    width: 100%;
  }
  #info {
    color: #c8c8c8;
    font-size: clamp(12px, 3vw, 14px);
    line-height: 1.45;
    margin: 0 0 4px;
    max-width: min(100%, 640px);
  }
  #wrap {
    position: relative;
    display: inline-block;
    max-width: 100%;
  }
  canvas {
    background: #2b2b2b;
    border: 2px solid #555;
    border-radius: 10px;
    box-shadow: 0 10px 28px rgba(0,0,0,0.35);
    display: block;
    max-height: calc(100vh - 130px);
    max-width: 100%;
    height: auto;
    touch-action: none;
  }
  #overlay {
    position: absolute;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    background: rgba(0,0,0,0.72);
    border-radius: 10px;
    font-size: clamp(32px, 9vw, 56px);
    font-weight: bold;
    padding: 20px;
  }
  #overlay.show { display: flex; }
  #overlay button {
    margin-top: 16px;
    font-size: 16px;
    padding: 8px 20px;
    cursor: pointer;
    border: none;
    border-radius: 6px;
    background: #4a90e2;
    color: #fff;
  }
  .clear { color: #5fd36a; }
  .over  { color: #e25555; }
</style>
</head>
<body>

<!-- ===== 難易度・設定（ここを変えれば簡単に調整できます） ===== -->
<script>
const CONFIG = {
  // 迷路の広さ（マス数）。大きいほど広くなる
  COLS: 15,
  ROWS: 11,
  TILE: 40,            // 1マスのピクセルサイズ

  PLAYER_SPEED: 2.6,   // プレイヤーの移動速度（px/フレーム）
  CHASER_SPEED: 1.9,   // 追跡者の速度。PLAYER_SPEEDより小さいと逃げやすい
  CATCH_DIST: 18,      // この距離まで近づくと捕まる（px）

  EXIT_COUNT: 4,       // 出口の数（正しい出口は1つ）
};
</script>
<!-- ============================================================ -->

<div id="title">読み込み中...</div>
<div id="info">矢印キー / WASD で移動。スマホはキャンバス内をドラッグ。Rキーでもリスタートできます。</div>

<div id="wrap">
  <canvas id="game"></canvas>
  <div id="overlay">
    <div id="overlayText"></div>
    <button id="restart">もう一度</button>
  </div>
</div>

<script>
(function () {
  "use strict";

  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");
  const titleEl = document.getElementById("title");
  const overlay = document.getElementById("overlay");
  const overlayText = document.getElementById("overlayText");
  const restartBtn = document.getElementById("restart");

  const C = CONFIG;
  canvas.width = C.COLS * C.TILE;
  canvas.height = C.ROWS * C.TILE;

  // ----- 迷路の生成（穴掘り法で必ず連結な迷路を作る） -----
  // grid[y][x] === 1 が壁、0 が通路
  let grid = [];

  function generateMaze() {
    // まず全部壁にする
    grid = [];
    for (let y = 0; y < C.ROWS; y++) {
      grid.push(new Array(C.COLS).fill(1));
    }
    // 穴掘り（depth-first）。奇数座標を部屋として扱う
    function carve(cx, cy) {
      grid[cy][cx] = 0;
      const dirs = shuffle([[0,-2],[0,2],[-2,0],[2,0]]);
      for (const [dx, dy] of dirs) {
        const nx = cx + dx, ny = cy + dy;
        if (ny > 0 && ny < C.ROWS - 1 && nx > 0 && nx < C.COLS - 1 && grid[ny][nx] === 1) {
          grid[cy + dy/2][cx + dx/2] = 0; // 間の壁を壊す
          carve(nx, ny);
        }
      }
    }
    carve(1, 1);
  }

  function shuffle(arr) {
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  }

  // タイル座標が通路かどうか
  function isFloor(tx, ty) {
    if (tx < 0 || ty < 0 || tx >= C.COLS || ty >= C.ROWS) return false;
    return grid[ty][tx] === 0;
  }

  // 円（中心x,y / 半径r）が壁にぶつからない位置か判定
  function canMove(x, y, r) {
    // 円の四隅をチェック
    const pts = [
      [x - r, y - r], [x + r, y - r],
      [x - r, y + r], [x + r, y + r],
    ];
    for (const [px, py] of pts) {
      const tx = Math.floor(px / C.TILE);
      const ty = Math.floor(py / C.TILE);
      if (!isFloor(tx, ty)) return false;
    }
    return true;
  }

  // タイル中心のピクセル座標
  function tileCenter(tx, ty) {
    return { x: tx * C.TILE + C.TILE / 2, y: ty * C.TILE + C.TILE / 2 };
  }

  // 通路マスを全部集める
  function allFloorTiles() {
    const list = [];
    for (let y = 0; y < C.ROWS; y++)
      for (let x = 0; x < C.COLS; x++)
        if (grid[y][x] === 0) list.push({ x, y });
    return list;
  }

  // ----- ゲーム状態 -----
  let player, chaser, exits, correctExitNo, state, titleResetTimer;
  const PLAYER_R = C.TILE * 0.3;
  const CHASER_R = C.TILE * 0.3;

  function dist(a, b) {
    return Math.hypot(a.x - b.x, a.y - b.y);
  }

  function setup() {
    generateMaze();

    const floors = allFloorTiles();

    // プレイヤーは左上スタート（1,1）
    const ps = tileCenter(1, 1);
    player = { x: ps.x, y: ps.y, r: PLAYER_R };

    // 出口を配置（プレイヤーから遠い通路マスから選ぶ）
    const sorted = floors.slice().sort((a, b) => {
      const ca = tileCenter(a.x, a.y), cb = tileCenter(b.x, b.y);
      return dist(cb, player) - dist(ca, player);
    });
    const exitCount = Math.min(C.EXIT_COUNT, Math.floor(sorted.length / 2));
    exits = [];
    const used = new Set();
    for (const t of sorted) {
      if (exits.length >= exitCount) break;
      // 出口同士が近すぎないように間引く
      const tooClose = exits.some(e => Math.abs(e.tx - t.x) + Math.abs(e.ty - t.y) < 3);
      if (tooClose) continue;
      const c = tileCenter(t.x, t.y);
      exits.push({ tx: t.x, ty: t.y, x: c.x, y: c.y, no: exits.length + 1 });
      used.add(t.x + "," + t.y);
    }

    // 正しい出口をランダムに決定
    if (exits.length === 0) {
      throw new Error("出口を配置できません。迷路サイズまたは出口数を確認してください。");
    }
    correctExitNo = exits[Math.floor(Math.random() * exits.length)].no;

    // 追跡者はプレイヤーから遠い通路に配置（出口とは別マス）
    let chaserTile = null;
    for (const t of sorted) {
      if (used.has(t.x + "," + t.y)) continue;
      chaserTile = t; break;
    }
    if (!chaserTile) chaserTile = sorted[0];
    const cc = tileCenter(chaserTile.x, chaserTile.y);
    chaser = { x: cc.x, y: cc.y, r: CHASER_R };

    state = "play";
    clearTimeout(titleResetTimer);
    overlay.classList.remove("show");
    titleEl.textContent = "目標：" + correctExitNo + "番出口へ脱出せよ！";
  }

  // ----- 入力 -----
  const keys = {};
  window.addEventListener("keydown", e => {
    const k = e.key.toLowerCase();
    if (["arrowup","arrowdown","arrowleft","arrowright"," "].includes(k)) e.preventDefault();
    if (k === "r" && state !== "play") setup();
    keys[k] = true;
  });
  window.addEventListener("keyup", e => { keys[e.key.toLowerCase()] = false; });

  // タッチ／ドラッグ移動：触っている方向へ進む
  let touchTarget = null;
  function setTouchFromEvent(e) {
    const rect = canvas.getBoundingClientRect();
    const t = e.touches ? e.touches[0] : e;
    const scaleX = canvas.width / rect.width;
    const scaleY = canvas.height / rect.height;
    touchTarget = {
      x: (t.clientX - rect.left) * scaleX,
      y: (t.clientY - rect.top) * scaleY,
    };
  }
  canvas.addEventListener("pointerdown", e => {
    e.preventDefault();
    canvas.setPointerCapture(e.pointerId);
    setTouchFromEvent(e);
  });
  canvas.addEventListener("pointermove", e => {
    if (e.buttons || e.pointerType === "touch") {
      e.preventDefault();
      setTouchFromEvent(e);
    }
  });
  canvas.addEventListener("pointerup", () => { touchTarget = null; });
  canvas.addEventListener("pointercancel", () => { touchTarget = null; });

  // ----- 移動処理（軸ごとに分けて壁すべりできるように） -----
  function moveEntity(ent, dx, dy) {
    if (dx !== 0 && canMove(ent.x + dx, ent.y, ent.r)) ent.x += dx;
    if (dy !== 0 && canMove(ent.x, ent.y + dy, ent.r)) ent.y += dy;
  }

  function updatePlayer() {
    let dx = 0, dy = 0;
    if (keys["arrowleft"] || keys["a"]) dx -= 1;
    if (keys["arrowright"] || keys["d"]) dx += 1;
    if (keys["arrowup"] || keys["w"]) dy -= 1;
    if (keys["arrowdown"] || keys["s"]) dy += 1;

    // タッチ操作：目標方向へ向かう
    if (touchTarget) {
      const tdx = touchTarget.x - player.x;
      const tdy = touchTarget.y - player.y;
      if (Math.hypot(tdx, tdy) > 4) { dx = tdx; dy = tdy; }
    }

    const len = Math.hypot(dx, dy);
    if (len > 0) {
      dx = dx / len * C.PLAYER_SPEED;
      dy = dy / len * C.PLAYER_SPEED;
      moveEntity(player, dx, dy);
    }
  }

  function tileAt(ent) {
    return { x: Math.floor(ent.x / C.TILE), y: Math.floor(ent.y / C.TILE) };
  }

  function nextStepToward(start, goal) {
    const queue = [start];
    const cameFrom = new Map([[start.x + "," + start.y, null]]);
    const dirs = [[1,0],[-1,0],[0,1],[0,-1]];

    while (queue.length) {
      const cur = queue.shift();
      if (cur.x === goal.x && cur.y === goal.y) break;
      for (const [dx, dy] of dirs) {
        const next = { x: cur.x + dx, y: cur.y + dy };
        const key = next.x + "," + next.y;
        if (!isFloor(next.x, next.y) || cameFrom.has(key)) continue;
        cameFrom.set(key, cur);
        queue.push(next);
      }
    }

    const goalKey = goal.x + "," + goal.y;
    if (!cameFrom.has(goalKey)) return tileCenter(goal.x, goal.y);

    let cur = goal;
    let prev = cameFrom.get(goalKey);
    while (prev && !(prev.x === start.x && prev.y === start.y)) {
      cur = prev;
      prev = cameFrom.get(cur.x + "," + cur.y);
    }
    return tileCenter(cur.x, cur.y);
  }

  function updateChaser() {
    // 迷路上の最短経路で追う。壁越しに直進して角で固まる不具合を防ぐ。
    const target = nextStepToward(tileAt(chaser), tileAt(player));
    let dx = target.x - chaser.x;
    let dy = target.y - chaser.y;
    const len = Math.hypot(dx, dy);
    if (len > 0.001) {
      dx = dx / len * C.CHASER_SPEED;
      dy = dy / len * C.CHASER_SPEED;
      moveEntity(chaser, dx, dy);
    }
  }

  function checkResult() {
    // 捕まり判定
    if (dist(player, chaser) < C.CATCH_DIST) {
      endGame(false);
      return;
    }
    // 出口判定
    for (const e of exits) {
      if (dist(player, e) < C.TILE * 0.4) {
        if (e.no === correctExitNo) endGame(true);
        else {
          titleEl.textContent = e.no + "番出口は違う！ 目標：" + correctExitNo + "番出口";
          clearTimeout(titleResetTimer);
          titleResetTimer = setTimeout(() => {
            if (state === "play") titleEl.textContent = "目標：" + correctExitNo + "番出口へ脱出せよ！";
          }, 1200);
        }
      }
    }
  }

  function endGame(cleared) {
    state = cleared ? "clear" : "over";
    overlayText.textContent = cleared ? "CLEAR!" : "GAME OVER";
    overlayText.className = cleared ? "clear" : "over";
    overlay.classList.add("show");
  }

  // ----- 描画 -----
  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // 壁
    ctx.strokeStyle = "#666";
    ctx.lineWidth = 2;
    for (let y = 0; y < C.ROWS; y++) {
      for (let x = 0; x < C.COLS; x++) {
        if (grid[y][x] === 1) {
          ctx.fillStyle = "#3a3a3a";
          ctx.fillRect(x * C.TILE, y * C.TILE, C.TILE, C.TILE);
          ctx.strokeRect(x * C.TILE, y * C.TILE, C.TILE, C.TILE);
        }
      }
    }

    // 出口（番号付き四角）
    for (const e of exits) {
      const isCorrect = e.no === correctExitNo;
      ctx.fillStyle = "#3ba85a";  // 見た目ではどれが正解か分からないよう全部同色
      ctx.fillRect(e.x - C.TILE * 0.35, e.y - C.TILE * 0.35, C.TILE * 0.7, C.TILE * 0.7);
      ctx.fillStyle = "#fff";
      ctx.font = "bold " + Math.floor(C.TILE * 0.45) + "px sans-serif";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText(e.no, e.x, e.y);
    }

    // 追跡者（赤丸）
    drawCircle(chaser.x, chaser.y, chaser.r, "#e25555");
    // 「!」マーク
    ctx.fillStyle = "#fff";
    ctx.font = "bold " + Math.floor(C.TILE * 0.4) + "px sans-serif";
    ctx.fillText("!", chaser.x, chaser.y);

    // プレイヤー（青丸）
    drawCircle(player.x, player.y, player.r, "#4a90e2");
  }

  function drawCircle(x, y, r, color) {
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fillStyle = color;
    ctx.fill();
  }

  // ----- メインループ -----
  function loop() {
    if (state === "play") {
      updatePlayer();
      updateChaser();
      checkResult();
    }
    draw();
    requestAnimationFrame(loop);
  }

  restartBtn.addEventListener("click", setup);

  setup();
  loop();
})();
</script>
</body>
</html>
