<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>駅の出口探索ゲーム 3D（3階建て）</title>
<style>
  html, body { margin:0; padding:0; height:100%; background:#000; overflow:hidden;
    font-family:"Segoe UI","Hiragino Kaku Gothic ProN",Meiryo,sans-serif; color:#eee;
    user-select:none; -webkit-user-select:none; }
  #app { position:fixed; inset:0; }
  canvas { display:block; }

  #hud { position:fixed; top:0; left:0; right:0; padding:10px 14px; pointer-events:none;
    text-align:center; text-shadow:0 1px 3px #000; }
  #goal { font-size:30px; font-weight:900; color:#ffe33a; letter-spacing:1px;
    text-shadow:0 0 6px rgba(0,0,0,.9), 0 2px 4px #000; }
  #sub  { font-size:12px; color:#cdd3da; margin-top:2px; }

  #floor { position:fixed; top:8px; left:10px; z-index:8; font-size:15px; font-weight:bold;
    color:#fff; background:rgba(20,30,45,.85); padding:4px 10px; border-radius:6px;
    box-shadow:0 2px 6px rgba(0,0,0,.4); }
  #timer { position:fixed; top:8px; right:12px; z-index:8; font-size:17px; font-weight:bold;
    color:#fff; background:rgba(20,30,45,.85); padding:4px 12px; border-radius:6px;
    box-shadow:0 2px 6px rgba(0,0,0,.4); }
  #verHud { position:fixed; top:40px; right:12px; z-index:8; font-size:12px; font-weight:bold;
    color:#ffe27a; background:rgba(20,30,45,.85); padding:2px 8px; border-radius:5px; }
  #muteBtn { position:fixed; top:66px; right:12px; z-index:9; font-size:16px; cursor:pointer;
    background:rgba(20,30,45,.85); padding:2px 8px; border-radius:5px; user-select:none; }
  #mapToggle { position:fixed; top:38px; left:10px; z-index:8; font-size:13px; font-weight:bold;
    color:#fff; background:rgba(20,30,45,.85); padding:3px 9px; border-radius:6px; cursor:pointer;
    box-shadow:0 2px 6px rgba(0,0,0,.4); user-select:none; }
  #map { position:fixed; top:62px; left:10px; z-index:6; border:2px solid rgba(0,0,0,.4);
    background:#fff; border-radius:4px; box-shadow:0 2px 8px rgba(0,0,0,.4); }
  #mapLabel { position:fixed; left:12px; z-index:7; font-size:11px; color:#222;
    background:rgba(255,255,255,.85); padding:1px 5px; border-radius:3px; }

  #cross { position:fixed; left:50%; top:50%; width:6px; height:6px; margin:-3px 0 0 -3px;
    background:#fff; border-radius:50%; opacity:.6; pointer-events:none; }

  /* 敵に追われているときの赤い警告（画面周囲） */
  #alert { position:fixed; inset:0; z-index:9; pointer-events:none; opacity:0;
    box-shadow: inset 0 0 150px 55px rgba(225,0,0,0.85); }

  .overlay { position:fixed; inset:0; display:flex; flex-direction:column;
    align-items:center; justify-content:center; text-align:center;
    background:rgba(0,0,0,.7); z-index:10; }
  .hidden { display:none !important; }
  .overlay h1 { font-size:40px; margin:0 0 8px; }
  .overlay p { font-size:14px; color:#ccc; margin:4px 0; max-width:540px; line-height:1.6; }
  .overlay button { margin-top:18px; font-size:16px; padding:10px 26px; cursor:pointer;
    border:none; border-radius:8px; background:#4a90e2; color:#fff; }
  .clear { color:#5fd36a; } .over { color:#e25555; }
  #version { margin-top:16px; font-size:18px; font-weight:bold; color:#9aa3ad; letter-spacing:.5px; }

  #touch { position:fixed; inset:0; z-index:5; display:none; }
  #pad { position:absolute; left:18px; bottom:18px; display:grid;
    grid-template-columns:repeat(3,56px); grid-template-rows:repeat(3,56px); gap:6px; }
  #pad div { background:rgba(0,0,0,.25); border:1px solid rgba(255,255,255,.4);
    border-radius:10px; display:flex; align-items:center; justify-content:center;
    font-size:22px; color:#fff; }
  #pad .up{grid-area:1/2} #pad .left{grid-area:2/1} #pad .down{grid-area:2/2} #pad .right{grid-area:2/3}

  /* スマホ：マップを左端に寄せ、タイトル文と重ならないよう本文を右寄せ */
  body.is-touch #floor { left:2px; font-size:12px; padding:3px 7px; }
  body.is-touch #map { left:2px; }
  body.is-touch #mapLabel { left:4px; }
  body.is-touch #hud { text-align:right; padding-left:130px; padding-right:10px; }
  body.is-touch #goal { font-size:15px; }
</style>
</head>
<body>

<!-- ====== 難易度・設定（ここを変えれば簡単に調整できます） ====== -->
<script>
const CONFIG = {
  SEED: 1,              // 迷路の固定シード（縦長ホーム5面+各階段／全フロア連結・到達性を検証済み）
  NUM_FLOORS: 3,        // フロア数（3階建て）
  COLS: 27, ROWS: 49,   // 迷路の広さ（ホーム長＝電車長の3倍に合わせて縦長）
  TILE: 5,              // 1マスのワールドサイズ
  WALL_H: 4.5,          // 1フロアの高さ（各階の段差）

  CHASER_FLOORS: [1, 2, 3, 3, 3, 3], // 敵の配置階（level）。1=地下2階, 2=地下1階, 3=地上(4人)
  MOVE_SPEED: 6.0,      // プレイヤーの移動速度（=走り。酔っ払いを離している時）
  WALK_SPEED: 3.6,      // 酔っ払いを連れている時のプレイヤー速度（走れない）
  DRUNK_SPEED: 4.0,     // 酔っ払いがついてくる速度
  DRUNK_TOUCH: 1.9,     // この距離まで近づくと「連れる」
  DRUNK_SEPARATE: 8.5,  // 連れている時、これ以上離れると「はぐれ」
  KONBINI_DIST: 6.0,    // コンビニにこの距離まで近づくと酔っ払いが立ち止まる
  KONBINI_STOP: 4.0,    // 立ち止まる秒数（酒を求める）
  TOILET_INTERVAL_MIN: 22, // 連れている間、次の尿意までの最短秒数
  TOILET_INTERVAL_MAX: 45, // 〃 最長秒数
  TOILET_WARN: 4.0,     // 予兆（猶予が始まる前の警告）秒数
  TOILET_LIMIT: 13.0,   // 予兆後、トイレに着くまでの猶予秒数（超過でGAME OVER）
  TOILET_DIST: 5.0,     // トイレにこの距離まで近づくと用を足せる（解消）
  TRAIN_INTERVAL: 28,   // 電車到着（人混み発生）の間隔(秒)
  CROWD_DURATION: 12,   // 到着後、ホームが混雑している秒数
  CROWD_SURGE: 220,     // 到着時にホームへ集まる通行人の数
  CHASER_SPEED: 4.0,    // 敵が追跡してくる速度（プレイヤーの歩行3.6より少し速い／走り6.0より遅い）
  CHASER_WANDER: 1.8,   // 敵が徘徊しているときの速度
  CHASER_SIGHT: 28,     // 敵の視認距離（これ以内＋視線が通ると追跡開始）
  ALERT_SIGHT_MULT: 1.5,// 一度見つけた敵の探知範囲の倍率（探知能力UP）
  CROUCH_SPEED: 2.6,    // しゃがみ移動速度
  CROUCH_EYE: 0.85,     // しゃがみ時の視点の高さ
  CROUCH_SIGHT_MULT: 0.35, // しゃがむと敵の視認距離をこの倍率に（見つかりにくい）
  CROUCH_HIDE_PED: 2.8, // しゃがみ中、この距離内に通行人がいると完全に紛れて見つからない
  CHASER_MEMORY: 4,     // 見失ってから追跡を続ける秒数
  B2_CHASER_MEMORY: 12, // 地下2階の敵が見失ってから追跡を続ける秒数（長め・速度は同じ）
  CATCH_DIST: 1.4,      // この距離まで近づかれると捕まる
  CHASER_FLOOR_TIME: 22,// 敵が1フロアを巡回し続ける時間(秒)。これを過ぎると別フロアへ入れ替わる

  PEDESTRIAN_COUNT: 225, // 歩行者の基準人数（各階に均等配分。地下2階/地下1階=各75人）
  GROUND_PED_MULT: 30,  // 地上フロアの歩行者は基準の何倍にするか（地上=2250人）
  GROUND_CEIL_EXTRA: 3, // 地上フロアだけ天井をこの分だけ高くする
  B1_PED_MULT: 9,       // 地下1階の歩行者は基準の何倍にするか（=675人）
  B2_PED_MULT: 10,      // 地下2階の歩行者は基準の何倍にするか（=750人）
  PED_SPEED: 1.6,       // 歩行者の歩く速さ
  PED_RUSH_SPEED: 5.4,  // 一時的に速くなる通行人の速度（プレイヤー級）
  PED_RUSH_CHANCE: 0.12,// 方向転換時に急ぎ足になる確率
  PED_AVOID_R: 1.8,     // この距離まで近づくとプレイヤーを避け始める
  PED_DODGE_SPEED: 6.5, // ぶつかった瞬間に素早く退く速さ

  STAIR_COUNT: 6,       // 地下1階→地上の階段の数（多めにして渋滞を分散。一方通行で上り3/下り3）
  STAIR_LEN: 3,         // 階段の長さ（マス数）
  START_CLEAR: 8,       // スタート地点からこのマス数以内には階段を置かない

  MOUSE_SENS: 0.0022,   // マウス感度
  INVERT_LOOK_X: true,  // 視点の左右反転
  INVERT_LOOK_Y: true,  // 視点の上下反転
  EYE_HEIGHT: 1.6,      // 視点の高さ

  LOOP_PROB: 0.16,      // 回り道を作る確率（大きいほど開放的）
  PLAZA_COUNTS: {1:0, 2:16, 3:14}, // 各フロアの広場の数（地下2階はプラットホームなので未使用）

  EXIT_COUNT: 17,       // 出口の数（すべて最上階。1つが正解）
  CORRECT_EXIT: null,   // 正解番号。null ならランダム

  SHOW_MAP: true,       // 左上のテスト用マップ
  FOG: true,
};
</script>
<!-- ========================================================= -->

<div id="app"></div>
<div id="floor" class="hidden"></div>
<div id="verHud"></div>
<div id="muteBtn" title="音のオン/オフ">🔊</div>
<div id="mapToggle" class="hidden">🗺 たたむ（M）</div>
<div id="timer" class="hidden"></div>
<canvas id="map" class="hidden"></canvas>
<div id="mapLabel" class="hidden">MAP</div>
<div id="alert"></div>
<div id="cross" class="hidden"></div>
<div id="hud" class="hidden">
  <div id="goal"></div>
  <div id="sub"></div>
</div>

<div id="touch">
  <div id="pad">
    <div class="up">▲</div><div class="left">◀</div><div class="down">▼</div><div class="right">▶</div>
  </div>
</div>

<div id="start" class="overlay">
  <h1>駅の出口探索 3D（地下2階〜地上）</h1>
  <p><b>地下2階</b>からスタート。<b>階段で地上まで上がり</b>、外周にある指定番号の<b>正しい出口</b>から脱出せよ。<br>
     構内には<b>赤い追跡者</b>がいる。普段は徘徊しているが、<b>こちらを見つけると追ってくる</b>。捕まったらゲームオーバー。</p>
  <p style="color:#888">PC: クリックで開始（マウス視点＋WASD）／ <b>Cでしゃがむ</b>（敵に見つかりにくい・人混みに紛れる／酔っ払いを連れている間は不可）／ スマホ: 画面ドラッグで視点・左下ボタンで移動</p>
  <div style="display:flex;gap:14px;flex-wrap:wrap;justify-content:center">
    <button id="devBtn">開発者としてプレイ<br><span style="font-size:12px;opacity:.85">（マップ表示）</span></button>
    <button id="userBtn">ユーザーとしてプレイ<br><span style="font-size:12px;opacity:.85">（マップなし）</span></button>
  </div>
  <div id="version"></div>
</div>

<div id="result" class="overlay hidden">
  <h1 id="resultText"></h1>
  <button id="restartBtn">もう一度</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function () {
  "use strict";
  if (typeof THREE === "undefined") {
    document.getElementById("start").innerHTML =
      "<h1>読み込み失敗</h1><p>Three.js を読み込めませんでした。ネット接続を確認して再読み込みしてください。</p>";
    return;
  }

  const C = CONFIG;
  const T = C.TILE;
  const FH = C.WALL_H;             // フロア高さ
  const NF = C.NUM_FLOORS;         // フロア数
  const lookX = C.INVERT_LOOK_X ? 1 : -1;
  const lookY = C.INVERT_LOOK_Y ? 1 : -1;

  // 固定マップ用のシード付き乱数（生成処理だけがこれを使う）
  function mulberry32(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a);
    t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
  let RNG = mulberry32(C.SEED);

  // ---------- DOM ----------
  const app = document.getElementById("app");
  const hud = document.getElementById("hud");
  const subEl = document.getElementById("sub");
  const cross = document.getElementById("cross");
  const goalEl = document.getElementById("goal");
  const startScreen = document.getElementById("start");
  const devBtn = document.getElementById("devBtn");
  const userBtn = document.getElementById("userBtn");
  const muteBtn = document.getElementById("muteBtn");
  const resultScreen = document.getElementById("result");
  const resultText = document.getElementById("resultText");
  const restartBtn = document.getElementById("restartBtn");
  const touch = document.getElementById("touch");
  const mapCv = document.getElementById("map");
  const mapCtx = mapCv.getContext("2d");
  const mapLabel = document.getElementById("mapLabel");
  const mapToggle = document.getElementById("mapToggle");
  let mapCollapsed = false;
  function setMapCollapsed(c){
    mapCollapsed=c;
    mapCv.style.display = c?"none":"";
    mapLabel.style.display = c?"none":"";
    mapToggle.textContent = c?"🗺 マップを開く（M）":"🗺 たたむ（M）";
  }
  mapToggle.addEventListener("click", e=>{ e.stopPropagation(); setMapCollapsed(!mapCollapsed); });
  const floorEl = document.getElementById("floor");
  const timerEl = document.getElementById("timer");
  const alertEl = document.getElementById("alert");
  let gameTime = 0;
  const fmtTime=t=>Math.floor(t/60)+":"+String(Math.floor(t%60)).padStart(2,"0");
  const versionEl = document.getElementById("version");
  const APP_VERSION = "Ver.72";
  versionEl.textContent = APP_VERSION;
  document.getElementById("verHud").textContent = APP_VERSION;   // 常時表示（キャッシュ確認用）
  const _touch = ("ontouchstart" in window) || navigator.maxTouchPoints>0;
  if(_touch) document.body.classList.add("is-touch");
  const MAP_CELL = _touch ? 7 : 10;

  // フロア名：最下層から 地下2階→地下1階→地上（最上階）
  function floorName(lv){ return lv>=NF ? "地上" : "地下"+(NF-lv)+"階"; }

  // ---------- Three.js ----------
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x222831);
  if (C.FOG) scene.fog = new THREE.Fog(0x222831, T*3, T*11);

  const camera = new THREE.PerspectiveCamera(75, innerWidth/innerHeight, 0.05, 400);
  camera.rotation.order = "YXZ";

  const renderer = new THREE.WebGLRenderer({ antialias:true });
  renderer.setPixelRatio(Math.min(devicePixelRatio,2));
  renderer.setSize(innerWidth, innerHeight);
  app.appendChild(renderer.domElement);
  addEventListener("resize", ()=>{
    camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
  });

  // ---------- 音（Web Audioで合成。外部ファイル不要） ----------
  let AC=null, masterGain=null, noiseBuf=null, audioOn=true, ambTimers=[];
  function ensureAudio(){
    if(AC){ if(AC.state==="suspended") AC.resume(); return; }
    const Ctor=window.AudioContext||window.webkitAudioContext; if(!Ctor) return;
    AC=new Ctor();
    masterGain=AC.createGain(); masterGain.gain.value=audioOn?0.5:0; masterGain.connect(AC.destination);
    noiseBuf=AC.createBuffer(1, (AC.sampleRate*1.2)|0, AC.sampleRate);
    const d=noiseBuf.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1;
    startAmbient();
  }
  function tone(freq,dur,o){ o=o||{}; if(!AC) return;
    const t=AC.currentTime+(o.when||0), osc=AC.createOscillator(); osc.type=o.type||"sine";
    osc.frequency.setValueAtTime(freq,t); if(o.glideTo) osc.frequency.exponentialRampToValueAtTime(o.glideTo,t+dur);
    const g=AC.createGain(), v=o.vol==null?0.2:o.vol, a=o.attack==null?0.01:o.attack;
    g.gain.setValueAtTime(0.0001,t); g.gain.linearRampToValueAtTime(v,t+a); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    osc.connect(g).connect(masterGain); osc.start(t); osc.stop(t+dur+0.03);
  }
  function noise(dur,o){ o=o||{}; if(!AC||!noiseBuf) return;
    const t=AC.currentTime+(o.when||0), src=AC.createBufferSource(); src.buffer=noiseBuf;
    let node=src; const lpf=AC.createBiquadFilter(); lpf.type="lowpass"; lpf.frequency.value=o.lp||1200; node.connect(lpf); node=lpf;
    if(o.hp){ const hpf=AC.createBiquadFilter(); hpf.type="highpass"; hpf.frequency.value=o.hp; node.connect(hpf); node=hpf; }
    const g=AC.createGain(), v=o.vol==null?0.2:o.vol; g.gain.setValueAtTime(v,t); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    node.connect(g).connect(masterGain); src.start(t); src.stop(t+dur+0.03);
  }
  function startAmbient(){
    // 低い駅のハム（連続・うなり）
    const o1=AC.createOscillator(); o1.type="sine"; o1.frequency.value=55;
    const o2=AC.createOscillator(); o2.type="sine"; o2.frequency.value=58.5;
    const hg=AC.createGain(); hg.gain.value=0.045; o1.connect(hg); o2.connect(hg); hg.connect(masterGain); o1.start(); o2.start();
    // 空調のホワイトノイズ（連続）
    const src=AC.createBufferSource(); src.buffer=noiseBuf; src.loop=true;
    const lpf=AC.createBiquadFilter(); lpf.type="lowpass"; lpf.frequency.value=340;
    const ng=AC.createGain(); ng.gain.value=0.035; src.connect(lpf).connect(ng).connect(masterGain); src.start();
    scheduleChime(); scheduleTrain(); scheduleCrowd();
  }
  function scheduleChime(){ ambTimers.push(setTimeout(()=>{ stationChime(); scheduleChime(); }, 12000+Math.random()*26000)); }
  function stationChime(){ // 駅の案内チャイム風「ピンポン」
    tone(880,0.55,{type:"sine",vol:0.16,attack:0.005});
    tone(659,0.7,{type:"sine",vol:0.16,attack:0.005,when:0.42});
  }
  function scheduleTrain(){ ambTimers.push(setTimeout(()=>{ trainPass(); scheduleTrain(); }, 16000+Math.random()*30000)); }
  function trainPass(){ if(!AC) return; const t=AC.currentTime; // 電車通過のゴーという増減
    const src=AC.createBufferSource(); src.buffer=noiseBuf; src.loop=true;
    const bp=AC.createBiquadFilter(); bp.type="bandpass"; bp.frequency.value=280; bp.Q.value=0.7;
    const g=AC.createGain(); g.gain.setValueAtTime(0.0001,t); g.gain.linearRampToValueAtTime(0.11,t+1.6);
    g.gain.setValueAtTime(0.11,t+2.6); g.gain.exponentialRampToValueAtTime(0.0001,t+5);
    src.connect(bp).connect(g).connect(masterGain); src.start(t); src.stop(t+5.3);
    tone(1100,1.0,{type:"sawtooth",vol:0.025,attack:0.3,when:2.4,glideTo:520}); // ブレーキのきしみ
  }
  function scheduleCrowd(){ ambTimers.push(setTimeout(()=>{ crowdMurmur(); scheduleCrowd(); }, 6000+Math.random()*9000)); }
  function crowdMurmur(){ if(!AC) return; const t=AC.currentTime; // 人混みのざわめき（短く）
    const src=AC.createBufferSource(); src.buffer=noiseBuf; src.loop=true;
    const bp=AC.createBiquadFilter(); bp.type="bandpass"; bp.frequency.value=600; bp.Q.value=0.8;
    const g=AC.createGain(); g.gain.setValueAtTime(0.0001,t); g.gain.linearRampToValueAtTime(0.03,t+0.8); g.gain.exponentialRampToValueAtTime(0.0001,t+2.4);
    src.connect(bp).connect(g).connect(masterGain); src.start(t); src.stop(t+2.6);
  }
  function sfxStep(){ noise(0.10,{vol:0.10,lp:850,hp:120}); }                                   // 足音
  function sfxAlert(){ tone(440,0.16,{type:"square",vol:0.16}); tone(587,0.22,{type:"square",vol:0.16,when:0.15}); } // 発見
  function sfxClear(){ [523,659,784,1047].forEach((f,i)=>tone(f,0.5,{type:"triangle",vol:0.2,when:i*0.13})); }      // クリア
  function sfxOver(){ [392,294,220,165].forEach((f,i)=>tone(f,0.6,{type:"sawtooth",vol:0.18,when:i*0.18})); }        // ゲームオーバー
  function sfxFloor(){ tone(330,0.16,{type:"sine",vol:0.12}); tone(440,0.18,{type:"sine",vol:0.12,when:0.09}); }     // 階移動
  function setMute(on){ audioOn=on; if(masterGain) masterGain.gain.value=on?0.5:0; muteBtn.textContent=on?"🔊":"🔇"; }
  muteBtn.addEventListener("click", e=>{ e.stopPropagation(); setMute(!audioOn); });

  // 全体光は床が白飛び(発光)しないよう十分に余裕を持たせる（明るさは無影の天井・出口の空で確保）
  scene.add(new THREE.AmbientLight(0x6a727b, 0.55));
  scene.add(new THREE.HemisphereLight(0x8893a0, 0x20242a, 0.35));
  const lamp = new THREE.PointLight(0xffffff, 0.32, T*7, 2);  // プレイヤー追従の弱い光
  lamp.position.set(0, 2.4, 0);   // カメラより上に置いて足元(手前の床)の白飛びを防ぐ
  camera.add(lamp);
  scene.add(camera);

  // ---------- テクスチャ（グレーのタイル） ----------
  function makeTileTexture(o){
    const s=256, cv=document.createElement("canvas"); cv.width=cv.height=s;
    const g=cv.getContext("2d");
    g.fillStyle=o.base; g.fillRect(0,0,s,s);
    const step=s/o.div; g.strokeStyle=o.grout; g.lineWidth=o.line;
    for(let i=0;i<=o.div;i++){ g.beginPath();g.moveTo(i*step,0);g.lineTo(i*step,s);g.stroke();
      g.beginPath();g.moveTo(0,i*step);g.lineTo(s,i*step);g.stroke(); }
    if(o.sheen){ g.fillStyle="rgba(255,255,255,0.16)";
      for(let y=0;y<o.div;y++)for(let x=0;x<o.div;x++) g.fillRect(x*step+o.line,y*step+o.line,step*0.28,step*0.18); }
    const t=new THREE.CanvasTexture(cv); t.wrapS=t.wrapT=THREE.RepeatWrapping; t.anisotropy=4; return t;
  }
  const wallTex  = makeTileTexture({base:"#c2c7cc",grout:"#7c828a",line:6,div:4,sheen:true});
  const floorTex = makeTileTexture({base:"#dcc6a0",grout:"#b4986a",line:7,div:2,sheen:false}); // 床=肌色(ベージュ)
  const ceilTex  = makeTileTexture({base:"#d6dade",grout:"#b3b8bd",line:5,div:3,sheen:false}); // 天井=壁より少し明るいグレー
  wallTex.repeat.set(2,2);

  // 縦長の出口看板テクスチャ（出/口を縦並び＋大きな番号）
  function exitSignTextureV(n){
    const w=170,h=400,cv=document.createElement("canvas");cv.width=w;cv.height=h;const g=cv.getContext("2d");
    g.fillStyle="#1a6b32";g.fillRect(0,0,w,h);

    g.font="bold 30px sans-serif";g.fillText("EXIT",w/2,h*0.86);
    const t=new THREE.CanvasTexture(cv);t.anisotropy=4;return t;
  }
  function exitSignTexture(n){
    const w=256,h=256,cv=document.createElement("canvas"); cv.width=w; cv.height=h;
    const g=cv.getContext("2d");
    g.fillStyle="#1a6b32"; g.fillRect(0,0,w,h);
    g.strokeStyle="#fff"; g.lineWidth=10; g.strokeRect(8,8,w-16,h-16);
    g.fillStyle="#fff"; g.textAlign="center"; g.textBaseline="middle";
    g.font="bold 70px sans-serif"; g.fillText("出口", w/2, h*0.30);
    g.font="bold 130px sans-serif"; g.fillText(String(n), w/2, h*0.66);
    const t=new THREE.CanvasTexture(cv); t.anisotropy=4; return t;
  }

  // ---------- 迷路生成（フロアごとに独立した迷路） ----------
  let grids = {};   // grids[f] = 2D配列（f=1..NF）
  function shuffle(a){ for(let i=a.length-1;i>0;i--){const j=(RNG()*(i+1))|0;[a[i],a[j]]=[a[j],a[i]];} return a; }
  const inInner=(x,y)=> x>=1&&y>=1&&x<C.COLS-1&&y<C.ROWS-1;
  function gFloor(f,x,y){ const g=grids[f]; return x>=0&&y>=0&&x<C.COLS&&y<C.ROWS&&g[y][x]===0; }
  function gWall(f,x,y){ return !(x>=0&&y>=0&&x<C.COLS&&y<C.ROWS) || grids[f][y][x]===1; }

  function generateMazeGrid(floor){
    const g=[]; for(let y=0;y<C.ROWS;y++) g.push(new Array(C.COLS).fill(1));
    const F=(x,y)=> x>=0&&y>=0&&x<C.COLS&&y<C.ROWS&&g[y][x]===0;
    (function carve(cx,cy){
      g[cy][cx]=0;
      for(const [dx,dy] of shuffle([[0,-2],[0,2],[-2,0],[2,0]])){
        const nx=cx+dx, ny=cy+dy;
        if(ny>0&&ny<C.ROWS-1&&nx>0&&nx<C.COLS-1&&g[ny][nx]===1){ g[cy+dy/2][cx+dx/2]=0; carve(nx,ny); }
      }
    })(1,1);
    for(let y=1;y<C.ROWS-1;y++)for(let x=1;x<C.COLS-1;x++){
      if(g[y][x]===1){
        const h=F(x-1,y)&&F(x+1,y), v=F(x,y-1)&&F(x,y+1);
        if((h||v)&&RNG()<C.LOOP_PROB) g[y][x]=0;
      }
    }
    const pc=C.PLAZA_COUNTS[floor]||3;
    for(let i=0;i<pc;i++){
      // 広場は大きさランダム(3〜6マス)で駅構内らしい開放感を出す
      const rw=3+((RNG()*4)|0), rh=3+((RNG()*4)|0);
      const rx=1+((RNG()*(C.COLS-1-rw))|0), ry=1+((RNG()*(C.ROWS-1-rh))|0);
      for(let y=ry;y<ry+rh;y++)for(let x=rx;x<rx+rw;x++) g[y][x]=0;
    }
    braidFill(g);   // 行き止まりを除去（つなぐ／埋める）
    return g;
  }
  // 地下2階＝駅のプラットホーム（縦長・2マス幅の島式ホーム5面を独立配置、両側に電車。各ホーム同位置に階段）
  const LANES=[[2,4],[7,9],[12,14],[17,19],[22,24]];          // 5つのホーム(3マス幅)
  const TRACKS=[[0,1],[5,6],[10,11],[15,16],[20,21],[25,26]]; // 線路(電車)
  const PLAT_TOP=6, PLAT_BOT=42, TOP_Y0=3, BOT_Y0=43;        // ホームは y=6..42、階段は両端(上y3〜/下y43〜)
  const CENTER_COLS=LANES.map(l=>l[0]+1);                     // 各ホームの中央列
  const OBJ_ROWS=[]; for(let _y=PLAT_TOP+2;_y<=PLAT_BOT-2;_y+=2) OBJ_ROWS.push(_y); // 中央に等間隔・多めに
  function objType(y){ const i=((y-PLAT_TOP)/2)|0; return i%8===3?"kiosk":(i%8===5?"sign":(i%8===7?"trash":"pillar")); }
  function inLane(x){ return LANES.some(l=>x>=l[0]&&x<=l[1]); }
  function isTrainZone(x,y){ return TRACKS.some(l=>x>=l[0]&&x<=l[1]) && y>=PLAT_TOP && y<=PLAT_BOT; }
  function generatePlatformFloor(){
    const g=[]; for(let y=0;y<C.ROWS;y++) g.push(new Array(C.COLS).fill(1));
    // ホームは全面床。中央の柱などは壁にせず小さい円の当たり判定で扱う
    for(const [x0,x1] of LANES) for(let y=PLAT_TOP;y<=PLAT_BOT;y++) for(let x=x0;x<=x1;x++) g[y][x]=0;
    return g;
  }
  function generateAllFloors(){
    grids={}; grids[1]=generatePlatformFloor();
    for(let f=2;f<=NF;f++) grids[f]=generateMazeGrid(f);
  }

  // ---------- 行き止まり除去 ----------
  const DIRS4=[[1,0],[-1,0],[0,1],[0,-1]];
  function gFloorG(g,x,y){ return x>=0&&y>=0&&x<C.COLS&&y<C.ROWS && g[y][x]===0; }
  function braidFill(g){
    // 1) 行き止まりを並行通路へつないでループ化
    for(let p=0;p<4;p++){ let ch=false;
      for(let y=1;y<C.ROWS-1;y++)for(let x=1;x<C.COLS-1;x++){
        if(g[y][x]!==0) continue;
        let c=0; for(const[dx,dy]of DIRS4) if(gFloorG(g,x+dx,y+dy)) c++;
        if(c!==1) continue;
        for(const[dx,dy]of DIRS4){ const nx=x+dx,ny=y+dy,fx=x+2*dx,fy=y+2*dy;
          if(inInner(nx,ny)&&g[ny][nx]===1&&gFloorG(g,fx,fy)){ g[ny][nx]=0; ch=true; break; } }
      } if(!ch) break;
    }
    // 2) 残りの行き止まりは埋める（開始マスは除く）
    for(let p=0;p<C.COLS+C.ROWS;p++){ let ch=false;
      for(let y=1;y<C.ROWS-1;y++)for(let x=1;x<C.COLS-1;x++){
        if(g[y][x]!==0||(x===1&&y===1)) continue;
        let c=0; for(const[dx,dy]of DIRS4) if(gFloorG(g,x+dx,y+dy)) c++;
        if(c<=1){ g[y][x]=1; ch=true; }
      } if(!ch) break;
    }
  }
  function braidConnect(g,pw){
    for(let p=0;p<5;p++){ let ch=false;
      for(let y=1;y<C.ROWS-1;y++)for(let x=1;x<C.COLS-1;x++){
        if(g[y][x]!==0||(x===1&&y===1)) continue;
        let c=0; for(const[dx,dy]of DIRS4) if(gFloorG(g,x+dx,y+dy)) c++;
        if(c!==1) continue;
        for(const[dx,dy]of DIRS4){ const nx=x+dx,ny=y+dy,fx=x+2*dx,fy=y+2*dy;
          if(inInner(nx,ny)&&g[ny][nx]===1&&!pw.has(nx+","+ny)&&gFloorG(g,fx,fy)){ g[ny][nx]=0; ch=true; break; } }
      } if(!ch) break;
    }
  }
  function fillDead(g,pf){
    for(let p=0;p<C.COLS+C.ROWS;p++){ let ch=false;
      for(let y=1;y<C.ROWS-1;y++)for(let x=1;x<C.COLS-1;x++){
        if(g[y][x]!==0||(x===1&&y===1)||pf.has(x+","+y)) continue;
        let c=0; for(const[dx,dy]of DIRS4) if(gFloorG(g,x+dx,y+dy)) c++;
        if(c<=1){ g[y][x]=1; ch=true; }
      } if(!ch) break;
    }
  }
  // 階段配置後の行き止まり除去（階段は壊さないよう保護）
  // 連結成分（floorのみ）
  function components(g){
    const seen=new Set(), cs=[];
    for(let y=0;y<C.ROWS;y++)for(let x=0;x<C.COLS;x++){
      if(g[y][x]!==0||seen.has(x+","+y)) continue;
      const comp=[], q=[[x,y]]; seen.add(x+","+y); let i=0;
      while(i<q.length){ const [cx,cy]=q[i++]; comp.push([cx,cy]);
        for(const [dx,dy] of DIRS4){ const nx=cx+dx,ny=cy+dy;
          if(nx>=0&&ny>=0&&nx<C.COLS&&ny<C.ROWS&&g[ny][nx]===0&&!seen.has(nx+","+ny)){ seen.add(nx+","+ny); q.push([nx,ny]); } } }
      cs.push(comp);
    }
    return cs;
  }
  // 分断された連結成分を、保護壁(pw)を避けつつ最短で掘ってつなぐ
  function connectComps(g,pw){
    let cs=components(g); if(cs.length<=1) return;
    cs.sort((a,b)=>b.length-a.length);
    let mainSet=new Set(cs[0].map(c=>c[0]+","+c[1]));
    for(let i=1;i<cs.length;i++){
      if(mainSet.has(cs[i][0][0]+","+cs[i][0][1])) continue;
      const dist={}, prev={}, dq=[];
      for(const [x,y] of cs[i]){ const k=x+","+y; dist[k]=0; dq.push([x,y]); }
      let hit=null;
      while(dq.length){
        const [x,y]=dq.shift(), k=x+","+y, d=dist[k]; if(d===undefined) continue;
        if(mainSet.has(k)){ hit=k; break; }
        for(const [dx,dy] of DIRS4){ const nx=x+dx,ny=y+dy; if(!(nx>=0&&ny>=0&&nx<C.COLS&&ny<C.ROWS)) continue;
          const nk=nx+","+ny, isF=g[ny][nx]===0; let cost;
          if(isF) cost=0; else if(pw.has(nk)||!inInner(nx,ny)) continue; else cost=1;
          const nd=d+cost;
          if(dist[nk]===undefined||nd<dist[nk]){ dist[nk]=nd; prev[nk]=k; if(cost===0) dq.unshift([nx,ny]); else dq.push([nx,ny]); }
        }
      }
      if(hit){ let k=hit; while(prev[k]!==undefined){ const p=k.split(","); const x=+p[0],y=+p[1]; if(g[y][x]===1) g[y][x]=0; k=prev[k]; } }
      mainSet=new Set(components(g).sort((a,b)=>b.length-a.length)[0].map(c=>c[0]+","+c[1]));
    }
  }
  function cleanupDeadEnds(){
    const pf={}, pw={}, pcn={};   // pcn=連結修復用の保護（手すりは除外＝つなぐために通す）
    for(let f=1;f<=NF;f++){ pf[f]=new Set(); pw[f]=new Set(); pcn[f]=new Set(); }
    const asArr=t=>Array.isArray(t[0])?t:[t];
    for(const s of stairs){
      const lv=s.lvl;
      s.run.forEach(([x,y])=>{ pf[lv].add(x+","+y); pf[lv+1].add(x+","+y); });
      asArr(s.entry).forEach(([x,y])=>{ pf[lv].add(x+","+y); pw[lv+1].add(x+","+y); pcn[lv+1].add(x+","+y); });
      asArr(s.exit).forEach(([x,y])=>{ pf[lv+1].add(x+","+y); pw[lv].add(x+","+y); pcn[lv].add(x+","+y); });
      asArr(s.beyond).forEach(([x,y])=>pf[lv+1].add(x+","+y));
      s.rails.forEach(([x,y])=>{ pw[lv].add(x+","+y); pw[lv+1].add(x+","+y); });
    }
    for(let f=2;f<=NF;f++){
      braidConnect(grids[f], pw[f]); fillDead(grids[f], pf[f]);
      connectComps(grids[f], pcn[f]); fillDead(grids[f], pf[f]);
    }
  }

  // ---------- 階段（フロア間を貫く。非対称に掘る：上り口側=下階の通路／降り口側=上階の通路、坂の反対は壁） ----------
  let stairs = [];
  const stairTileSet = new Set();
  let slabOmit = {};               // level -> Set("x,y") その階の床を抜く位置（吹き抜け）
  let stairTileLevel = {};         // "x,y" -> lvl
  function carveConn(g,sx,sy,dx,dy){
    let x=sx,y=sy;
    for(let k=0;k<C.COLS+C.ROWS;k++){ const nx=x+dx,ny=y+dy; if(!inInner(nx,ny)) break; if(g[ny][nx]===0) break; g[ny][nx]=0; x=nx; y=ny; }
  }
  function setWall(g,x,y){ if(y>=0&&y<C.ROWS&&x>=0&&x<C.COLS) g[y][x]=1; }
  function makeStair(axis,x0,y0,lvl){
    const L=C.STAIR_LEN; const run=[],rails=[]; let entry,exit,bd,fd,adir,ta0,ta1,tc0,tc1;
    if(axis==="x"){ for(let i=0;i<L;i++){run.push([x0+i,y0]);rails.push([x0+i,y0-1]);rails.push([x0+i,y0+1]);} entry=[x0-1,y0]; exit=[x0+L,y0]; bd=[-1,0]; fd=[1,0]; adir=[1,0]; ta0=x0; ta1=x0+L; tc0=y0; tc1=y0+1; }
    else          { for(let i=0;i<L;i++){run.push([x0,y0+i]);rails.push([x0-1,y0+i]);rails.push([x0+1,y0+i]);} entry=[x0,y0-1]; exit=[x0,y0+L]; bd=[0,-1]; fd=[0,1]; adir=[0,1]; ta0=y0; ta1=y0+L; tc0=x0; tc1=x0+1; }
    return { axis,lvl,run,rails,entry,exit,bd,fd,adir, beyond:[exit[0]+adir[0],exit[1]+adir[1]],
      a0:ta0*T,a1:ta1*T,c0:tc0*T,c1:tc1*T,
      cx:axis==="x"?(ta0+ta1)/2*T:(tc0+tc1)/2*T, cz:axis==="x"?(tc0+tc1)/2*T:(ta0+ta1)/2*T,
      cxTile:axis==="x"?x0+L/2:x0+0.5, cyTile:axis==="x"?y0+0.5:y0+L/2 };
  }
  function carveStairInto(s){
    const lo=grids[s.lvl], up=grids[s.lvl+1];
    // 下階：上り口(entry)側を通路に、坂の反対側(exit)は壁
    s.run.forEach(([x,y])=>lo[y][x]=0); lo[s.entry[1]][s.entry[0]]=0; setWall(lo,s.exit[0],s.exit[1]);
    s.rails.forEach(([x,y])=>setWall(lo,x,y)); carveConn(lo, s.entry[0],s.entry[1], s.bd[0],s.bd[1]);
    // 上階：降り口(exit)側を通路に、坂の反対側(entry)は壁
    s.run.forEach(([x,y])=>up[y][x]=0); up[s.exit[1]][s.exit[0]]=0; setWall(up,s.entry[0],s.entry[1]);
    s.rails.forEach(([x,y])=>setWall(up,x,y)); carveConn(up, s.exit[0],s.exit[1], s.fd[0],s.fd[1]);
    // 上がった先(beyond)は必ず通路
    if(inInner(s.beyond[0],s.beyond[1])) up[s.beyond[1]][s.beyond[0]]=0;
  }
  // 地下2階ホーム用：1マス幅・3段の階段（中央列）。ホーム両端に配置。up=+1(下端)/-1(上端)
  function makePlatStair(x0,y0,up){
    const xc=x0+1;
    const run=[[xc,y0],[xc,y0+1],[xc,y0+2]];
    const rails=[[x0,y0],[x0,y0+1],[x0,y0+2],[x0+2,y0],[x0+2,y0+1],[x0+2,y0+2]];
    let entry,exit,beyond;
    if(up===1){ entry=[xc,y0-1]; exit=[xc,y0+3]; beyond=[xc,y0+4]; }
    else      { entry=[xc,y0+3]; exit=[xc,y0-1]; beyond=[xc,y0-2]; }
    return { axis:"z", lvl:1, run, rails, entry, exit, beyond, up,
      a0:y0*T, a1:(y0+3)*T, c0:xc*T, c1:(xc+1)*T,
      cx:(xc+0.5)*T, cz:(y0+1.5)*T, adir:[0,up], cxTile:xc+0.5, cyTile:y0+1.5 };
  }
  function carvePlatStair(s){
    const lo=grids[1], up=grids[2], e=s.entry, ex=s.exit, by=s.beyond;
    s.run.forEach(([x,y])=>{ lo[y][x]=0; up[y][x]=0; });
    lo[e[1]][e[0]]=0; setWall(up,e[0],e[1]);   // 下=通路, 上=壁
    setWall(lo,ex[0],ex[1]); up[ex[1]][ex[0]]=0; // 下=壁, 上=通路
    if(inInner(by[0],by[1])) up[by[1]][by[0]]=0;
    s.rails.forEach(([x,y])=>{ setWall(lo,x,y); setWall(up,x,y); });
    carveConn(up, ex[0], ex[1], 0, s.up);        // 地下1階の迷路側へ接続
  }
  function findStairs(){
    stairs=[]; stairTileSet.clear(); slabOmit={}; stairTileLevel={};
    for(let f=2;f<=NF;f++) slabOmit[f]=new Set();
    const L=C.STAIR_LEN; const usedW=new Set(); const usedR=new Set(); const placed=[];
    // 地下2階→地下1階：各ホームの両端に1マス幅の階段（5×2=10本、同位置）
    for(const [x0,x1] of LANES){
      for(const [y0,up] of [[TOP_Y0,-1],[BOT_Y0,1]]){
        const s=makePlatStair(x0,y0,up);
        carvePlatStair(s);
        s.run.forEach(([x,y])=>{ const k=x+","+y; stairTileSet.add(k); stairTileLevel[k]=1; slabOmit[2].add(k); });
        [...s.run,s.entry,s.exit,s.beyond].forEach(t=>usedW.add(t[0]+","+t[1]));
        s.rails.forEach(t=>usedR.add(t[0]+","+t[1]));
        placed.push({cxTile:s.cxTile,cyTile:s.cyTile});
        stairs.push(s);
      }
    }
    // 地下1階→地上：ランダム
    for(let lvl=2; lvl<NF; lvl++){
      let n=0, att=0;
      while(n<C.STAIR_COUNT && att<1200){
        att++;
        const axis = RNG()<0.5?"x":"z";
        let x0,y0;
        if(axis==="x"){ x0=2+((RNG()*(C.COLS-2-L-1))|0); y0=1+((RNG()*(C.ROWS-2))|0); }
        else          { x0=1+((RNG()*(C.COLS-2))|0);     y0=2+((RNG()*(C.ROWS-2-L-1))|0); }
        const s=makeStair(axis,x0,y0,lvl);
        const wkeys=[...s.run,s.entry,s.exit,s.beyond].map(t=>t[0]+","+t[1]);
        const rkeys=s.rails.map(t=>t[0]+","+t[1]);
        if(wkeys.some(k=>usedW.has(k)||usedR.has(k))) continue;
        if(rkeys.some(k=>usedW.has(k))) continue;
        if(placed.some(p=>Math.abs(p.cxTile-s.cxTile)+Math.abs(p.cyTile-s.cyTile)<4)) continue;
        carveStairInto(s);
        s.oneWay = (n%2===0)?1:-1;   // 通行人専用の一方通行(上り/下りを別階段に分けて渋滞を防ぐ。プレイヤー/敵は両用)

    }

  // 地下2階の描画：中央の柱/売店/看板/ゴミ箱（小さい当たり判定）、線路の電車、境界壁
  function buildPlatform(){
    platObstacles=[];
    // 中央列のオブジェクト（壁ではなく小さい円の当たり判定）
    for(const [x0,x1] of LANES){ const xc=x0+1;
      for(const y of OBJ_ROWS){
        const w=tileToWorld(xc,y); const t=objType(y); let m,r;
        if(t==="pillar"){ m=new THREE.Mesh(new THREE.BoxGeometry(0.6,FH,0.6),pillarMat); m.position.set(w.x,FH/2,w.z); r=0.32; }
        else if(t==="kiosk"){ m=new THREE.Mesh(new THREE.BoxGeometry(T*0.9,FH*0.7,T*0.9),kioskMat); m.position.set(w.x,FH*0.35,w.z); r=2.0; } // 人より大きい遮蔽物
        else if(t==="trash"){ m=new THREE.Mesh(new THREE.BoxGeometry(0.7,1.0,0.7),trashMat); m.position.set(w.x,0.5,w.z); r=0.36; }
        else { m=new THREE.Mesh(new THREE.BoxGeometry(T*0.7,1.7,0.16),signMat); m.position.set(w.x,1.6,w.z); r=0.4; }
        worldRoot.add(m);
        platObstacles.push({x:w.x, z:w.z, r});
      }
    }
    // 壁（境界など。中央オブジェクトはもう壁ではない）
    for(let y=0;y<C.ROWS;y++)for(let x=0;x<C.COLS;x++){
      if(grids[1][y][x]!==1) continue;
      if(stairTileSet.has(x+","+y)) continue;        // 階段は別描画
      if(isTrainZone(x,y)) continue;                 // 線路は電車でまとめて描画
      const w=tileToWorld(x,y);
      const seg=new THREE.Mesh(wallSegGeo,wallMat); seg.position.set(w.x,FH/2,w.z); worldRoot.add(seg);
    }
    // 電車（窓・ドア付き／一部ドアは開いて乗降客）
    boarders=[]; trainDoors=[];
    const stripes=[0x2b6fb0,0x3f9d4f,0xd5912a,0xb84040,0x6a55a0,0x888f96];
    const z0=PLAT_TOP*T, z1=(PLAT_BOT+1)*T, zc=(z0+z1)/2, zlen=(z1-z0)*0.98;
    TRACKS.forEach((l,i)=>{
      const xc=(l[0]+l[1]+1)/2*T, carW=(l[1]-l[0]+1)*T*0.66, carH=FH*0.8;
      const tex=makeTrainSideTex("#"+stripes[i%stripes.length].toString(16).padStart(6,"0"));
      tex.repeat.set(Math.max(3,Math.round(zlen/4)),1);
      const side=new THREE.MeshLambertMaterial({map:tex});
      const plain=new THREE.MeshLambertMaterial({color:0xeef1f3});
      const mats=[side,side,plain,plain,plain,plain]; // +x,-x,+y,-y,+z,-z
      const car=new THREE.Mesh(new THREE.BoxGeometry(carW,carH,zlen),mats);
      car.position.set(xc, carH/2+0.05, zc); worldRoot.add(car);
      const roof=new THREE.Mesh(new THREE.BoxGeometry(carW*0.96,0.25,zlen),new THREE.MeshLambertMaterial({color:0xb9bfc4}));
      roof.position.set(xc, carH+0.1, zc); worldRoot.add(roof);
      // 開いたドア＋乗降客（隣にホームがある側）
      const doorZ=zc;
      [[-1,l[0]-1],[1,l[1]+1]].forEach(([sgn,adjX])=>{
        if(!inLane(adjX)) return;                      // 隣にホームがある側だけ
        const doorX=xc+sgn*carW/2;
        const dark=new THREE.Mesh(new THREE.BoxGeometry(0.1,carH*0.7,T*0.7),new THREE.MeshBasicMaterial({color:0x0a0e12}));
        dark.position.set(doorX, carH*0.4, doorZ); worldRoot.add(dark);                   // 開口
        const platX=(adjX+0.5)*T;
        trainDoors.push({x:platX, z:doorZ});   // 電車からの人の出入り口（ホーム側）
        for(let k=0;k<2;k++){
          const g=makeHuman(clothColors[(i*3+k)%clothColors.length]);
          worldRoot.add(g);
          boarders.push({ group:g, doorX, platX, z:doorZ+(k-0.5)*1.2, phase:Math.random()*6.28 });
        }
      });
    });
  }
  // 乗降客：ドアとホームの間を行き来
  function updateBoarders(t){
    for(const b of boarders){
      const s=(Math.sin(t*1.2+b.phase)*0.5+0.5);   // 0..1
      const x=b.doorX+(b.platX-b.doorX)*s;
      b.group.position.set(x, FOOT_LIFT, b.z);
      b.group.rotation.y = (b.platX>b.doorX)? Math.PI/2 : -Math.PI/2;
    }
  }

  function buildWorld(){
    while(worldRoot.children.length) worldRoot.remove(worldRoot.children[0]);
    exits=[]; pedestrians=[];
    const W=C.COLS*T, D=C.ROWS*T;

    // 1階(地下2階)の床（全面）
    floorTex.repeat.set(W/2.2, D/2.2);
    const floor1=new THREE.Mesh(new THREE.PlaneGeometry(W,D),floorMat);
    floor1.rotation.x=-Math.PI/2; floor1.position.set(W/2,0,D/2); worldRoot.add(floor1);

    // 各階の床スラブは「出口の開口(grids書き換え)」の後に作る（穴が空かないように）→ placeExits の後で実行

    // 最上階(地上)の天井は少し高く
    const GHX=C.GROUND_CEIL_EXTRA, TOPCEIL=FH*NF+GHX;
    ceilTex.repeat.set(C.COLS,C.ROWS);
    const ceil=new THREE.Mesh(new THREE.PlaneGeometry(W,D),ceilMat);
    ceil.rotation.x=Math.PI/2; ceil.position.set(W/2,TOPCEIL+0.04,D/2); worldRoot.add(ceil);
    // 下の各階（最上階以外）にも白めグレーの天井を貼る
    for(let f=1;f<NF;f++) buildFloorCeilings(f);

    // 各階の天井照明。到達距離は「真下のフロアに届かない」値に制限＝下の階の床が光らない（発光防止）
    for(let f=2;f<=NF;f++){
      const isTop=(f===NF), liMax=isTop?14:8;
      const lightY=(isTop?TOPCEIL:f*FH)-0.5;
      const dist=Math.min((isTop?10:7), lightY-(f-2)*FH-1.0); // 下の階の床(=(f-2)*FH)に届く手前で減衰
      let li=0;
      for(let y=2;y<C.ROWS-1;y+=3){ for(let x=2;x<C.COLS-1;x+=3){
        if(li>=liMax) break;
        if(grids[f][y][x]===0 && !stairTileSet.has(x+","+y)){
          const w=tileToWorld(x,y);
          const pl=new THREE.PointLight(isTop?0xfff6ec:0xfff2d8, isTop?0.5:0.45, dist, 2);
          pl.position.set(w.x, lightY, w.z); worldRoot.add(pl); li++;
        }
      }}
    }

    // 出口を先に決める（最上階・外周）→ 開口する最上段の壁を記録＋幅広出口はgridsを掘る
    const topSkip=new Set();
    placeExits(topSkip);

    // 各階の床スラブ（出口の開口後に作る。階段マスは抜く＝吹き抜け）
    for(let f=2;f<=NF;f++){
      for(let y=0;y<C.ROWS;y++)for(let x=0;x<C.COLS;x++){
        if(grids[f][y][x]===0 && !slabOmit[f].has(x+","+y)){
          const w=tileToWorld(x,y);
          const q=new THREE.Mesh(new THREE.PlaneGeometry(T,T),slabMat);
          q.rotation.x=-Math.PI/2; q.position.set(w.x,(f-1)*FH+0.04,w.z); worldRoot.add(q);
        }
      }
    }

    // 壁（地下1階・地上は迷路の壁。出口は最上階だけ開口）
    for(let f=2;f<=NF;f++){
      for(let y=0;y<C.ROWS;y++)for(let x=0;x<C.COLS;x++){
        if(grids[f][y][x]===1){
          if(f===NF && topSkip.has(x+","+y)) continue;
          const w=tileToWorld(x,y), wh=FH+(f===NF?GHX:0);   // 地上は壁も高く
          const seg=new THREE.Mesh(f===NF?wallSegGeoTall:wallSegGeo,wallMat); seg.position.set(w.x,(f-1)*FH+wh/2,w.z); worldRoot.add(seg);
        }
      }
    }
    buildPlatform();   // 地下2階＝プラットホーム

    // 階段（段々のステップ＋横の手すり。ライトは付けない）
    const stepMat=new THREE.MeshLambertMaterial({color:0x9aa0a6});
    const railMat=new THREE.MeshLambertMaterial({color:0x6b7178});
    for(const s of stairs){
      const base=(s.lvl-1)*FH;
      const run=s.a1-s.a0, rise=FH, across=s.c1-s.c0, ascX=(s.axis==="x");
      const N=10, tread=run/N, stepH=rise/N, dn=(s.up===-1);  // dn=上端の階段（向き逆）
      // 段々（下から積み上がる箱。up=-1 は逆向きに高くなる）
      for(let i=0;i<N;i++){
        const hgt=(dn?(N-i):(i+1))*stepH, along=s.a0+(i+0.5)*tread;
        const box = ascX ? new THREE.Mesh(new THREE.BoxGeometry(tread,hgt,across), stepMat)
                         : new THREE.Mesh(new THREE.BoxGeometry(across,hgt,tread), stepMat);
        if(ascX) box.position.set(along, base+hgt/2, s.cz);
        else     box.position.set(s.cx, base+hgt/2, along);
        worldRoot.add(box);
      }
      // 横の手すり（両サイドに斜めのバー）
      const len=Math.hypot(run,rise), ang=Math.atan2(rise,run)*(dn?-1:1), midY=base+rise/2+0.95;
      for(const so of [0.18, across-0.18]){
        const rail = ascX ? new THREE.Mesh(new THREE.BoxGeometry(len,0.09,0.09), railMat)
                          : new THREE.Mesh(new THREE.BoxGeometry(0.09,0.09,len), railMat);
        if(ascX){ rail.rotation.z=ang; rail.position.set(s.cx, midY, s.c0+so); }
        else    { rail.rotation.x=-ang; rail.position.set(s.c0+so, midY, s.cz); }
        worldRoot.add(rail);
      }
    }

    // 各階の天井の蛍光灯＋黄色い誘導線＋壁の看板/ポスター
    const stripMat=new THREE.MeshBasicMaterial({color:0xffffff});
    for(let f=1;f<=NF;f++){
      const cy=(f===NF?TOPCEIL:f*FH)-0.06;
      allFloorTiles(f).forEach((t,i)=>{ if(i%2) return;
        if(stairTileSet.has(t.x+","+t.y)) return;   // 階段の上にはライトを付けない
        const w=tileToWorld(t.x,t.y);
        const a=new THREE.Mesh(new THREE.BoxGeometry(T*0.6,0.08,T*0.16),stripMat); a.position.set(w.x,cy,w.z); worldRoot.add(a);
      });
      buildYellowLines(f);
      buildPosters(f);
      if(f===2) buildDeptEntrances(f);   // 地下1階の壁にデパート出入口（装飾・通行不可）
    }

    // 追跡者（赤い人型）を指定階に配置。フロアごとの人数を保つ目標値も作る
    chasers=[];
    chaserTargets={}; for(let f=1;f<=NF;f++) chaserTargets[f]=0;
    C.CHASER_FLOORS.forEach(l=>{ chaserTargets[l]=(chaserTargets[l]||0)+1; });
    const usedSpawns=[];
    C.CHASER_FLOORS.forEach(lvl=>{
      const cw=(lvl===1)?spawnOnLane(playerStartLane):spawnOnFloor(lvl, usedSpawns); // 地下2階の敵はプレイヤーと同じホーム
      const g=makeHuman(0xe11616,0x7a0000,0xff3a3a);   // しっかりした赤の全身
      g.traverse(o=>{ if(o.isMesh) o.material.emissive=new THREE.Color(0x4a0000); }); // 暗所でも赤く目立つ
      g.position.set(cw.x,(lvl-1)*FH+FOOT_LIFT,cw.z); worldRoot.add(g);
      chasers.push({ group:g, x:cw.x, z:cw.z, y:(lvl-1)*FH, level:lvl, state:"巡回", dir:Math.random()*6.28,
        mem:0, lx:cw.x, lz:cw.z, showAlert:false, alerted:false,
        mode:"patrol", floorTimer:C.CHASER_FLOOR_TIME*(0.5+Math.random()), transit:null,
        patField:null, patReached:true, _px:cw.x, _pz:cw.z, _stuck:0 });
    });

    // 地上の売店（広場の中央に最大7か所。地下2階と同じ大きさ。来客の「出入り」先）
    findGroundKiosks();
    for(const k of groundKiosks){
      const m=new THREE.Mesh(new THREE.BoxGeometry(T*0.9,FH*0.7,T*0.9), kioskMat);
      m.position.set(k.x, (NF-1)*FH + FH*0.35, k.z); worldRoot.add(m);
    }
    computeObsBlock();   // 売店などのタイルを記録（敵の巡回経路が避ける）
    // 地上の全出口へ向かう経路場（外周の出入りを激しくする。売店は避ける）
    exitField = exits.length ? bfsField(NF, exits.map(e=>[e.tx,e.ty]), obsBlock[NF]) : null;
    buildUpFields(); placeGuideSigns();   // 案内看板（一部は偽物）を設置

    // 歩行者（各階に分散。地上フロアは GROUND_PED_MULT 倍に）
    pedPool={};
    for(let f=1;f<=NF;f++) pedPool[f]=allFloorTiles(f).filter(t=>!stairTileSet.has(t.x+","+t.y)
        && !(f===1&&CENTER_COLS.includes(t.x)&&OBJ_ROWS.includes(t.y))
        && !(f===NF&&groundKiosks.some(k=>k.tx===t.x&&k.ty===t.y)));   // 売店の真上には湧かせない
    const basePer=Math.round(C.PEDESTRIAN_COUNT/NF);
    pedTargets={};
    for(let f=1;f<=NF;f++) pedTargets[f]=(f===NF)?basePer*C.GROUND_PED_MULT:(f===1?basePer*C.B2_PED_MULT:basePer*C.B1_PED_MULT);
    baseB2Target=pedTargets[1]; crowdActive=false; crowdEndT=0; crowdTimer=C.TRAIN_INTERVAL*0.6;   // 電車到着の人混み用
    // 各フロアの「人の出入り口」(人数調節に使う): 地上=出口, 地下1階=デパート, 地下2階=電車ドア
    sourcePts={ [NF]: exits.map(e=>({x:e.sx,z:e.sz})), 2: deptDoors.slice(), 1: trainDoors.slice() };
    buildFlowFields();   // フロア間移動の経路場（行き止まりに詰まらない誘導）
    let pi=0;
    for(let f=1;f<=NF;f++){
      const pool=pedPool[f]; if(!pool.length) continue;
      for(let k=0;k<pedTargets[f];k++){
        const t=pool[(Math.random()*pool.length)|0];
        const w=tileToWorld(t.x,t.y);
        const px=w.x+(Math.random()-0.5)*T*0.4, pz=w.z+(Math.random()-0.5)*T*0.4;
        const p={x:px,z:pz,level:f,y:(f-1)*FH,dir:Math.random()*6.28,timer:Math.random()*3,rush:0,ci:(pi++)%clothColors.length,ry:0,kind:"W",goal:0,ride:null,trip:-1,lastStair:-1,ktarget:-1,visit:0,roleT:Math.random()*8};
        setPedRole(p);   // 5割は徘徊、5割はフロア間移動（地上は半分が売店へ）
        pedestrians.push(p);
      }
    }
    balAccum=0;
    buildPedInstances();   // 大量の歩行者をインスタンス描画で軽量に
  }
  // 歩行者の役割: 'W'=徘徊 / 'M'=フロア間移動 / 'K'=売店へ出入り / 'E'=出口へ出入り（K,Eは地上のみ）
  function setPedRole(p){
    p.ride=null; p.visit=0;
    if(p.level===NF){
      const r=Math.random();
      if(r<0.4 && groundKiosks.length){ const ki=pickKiosk(p); if(ki>=0){ p.kind="K"; p.ktarget=ki; p.trip=-1; return; } }
      if(r<0.8 && exitField){ p.kind="E"; p.trip=-1; return; }   // 地上の約4割は出口へ出入り
    }
    if(Math.random()<0.5){ p.kind="M"; p.trip=pickStair(p); p.goal=(p.trip>=0)?p.level+((p.level===NF)?-1:1):0; if(p.trip<0) p.kind="W"; }
    else { p.kind="W"; p.goal=0; p.trip=-1; }
  }
  // 出口へ向かい、着いたら別の出口から入り直す＝外周の出入りを激しく見せる
  function exitStep(p, dt){
    if(!exitField || !exits.length){ p.kind="W"; wanderStep(p,dt); return; }
    const tx=Math.floor(p.x/T), ty=Math.floor(p.z/T);
    if(tx<0||ty<0||tx>=C.COLS||ty>=C.ROWS){ wanderStep(p,dt); return; }
    const d=exitField.dist[ty][tx];
    if(d>=0 && d<=1){   // 出口に到着→外へ出て、別の出口から入り直す
      const e=exits[(Math.random()*exits.length)|0];
      p.x=e.sx+(Math.random()-0.5)*T*0.4; p.z=e.sz+(Math.random()-0.5)*T*0.4;
      p.kind="W"; p.trip=-1; p.roleT=3+Math.random()*5; return;
    }
    if(exitField.step[ty][tx]>=0){ const dd=DIRS4[exitField.step[ty][tx]], tw=tileToWorld(tx+dd[0],ty+dd[1]); pedMoveDir(p, tw.x-p.x, tw.z-p.z, dt, false); }
    else wanderStep(p, dt);
  }
  // フロー場(BFS)。block=避けたいタイル集合(柱/売店など)を渡すとそこを通らない経路になる
  function bfsField(f,targets,block){
    const dist=Array.from({length:C.ROWS},()=>new Array(C.COLS).fill(-1));
    const step=Array.from({length:C.ROWS},()=>new Array(C.COLS).fill(-1));
    const q=[];
    for(const t of targets){ const x=t[0],y=t[1];
      if(x>=0&&y>=0&&x<C.COLS&&y<C.ROWS&&grids[f][y][x]===0){ dist[y][x]=0; q.push([x,y]); } }
    let i=0;
    while(i<q.length){ const [x,y]=q[i++];
      for(let d=0;d<4;d++){ const nx=x+DIRS4[d][0], ny=y+DIRS4[d][1];
        if(nx<0||ny<0||nx>=C.COLS||ny>=C.ROWS) continue;
        if(grids[f][ny][nx]!==0 || stairTileSet.has(nx+","+ny)) continue;  // 壁・階段の上は通さない
        if(block && block.has(nx+","+ny)) continue;                       // 柱/売店などの上も通さない
        if(dist[ny][nx]>=0) continue;
        dist[ny][nx]=dist[y][x]+1; step[ny][nx]=(d^1);  // (nx,ny)から見て(x,y)へ向かう向き
        q.push([nx,ny]);
      }
    }
    return {dist,step};
  }
  // フロアごとの「大きい障害物（売店/売店大）が乗っているタイル」集合（敵の巡回経路が避ける）
  let obsBlock={};
  function computeObsBlock(){
    obsBlock={};
    const add=(f,wx,wz)=>{ const tx=Math.floor(wx/T), ty=Math.floor(wz/T); (obsBlock[f]=obsBlock[f]||new Set()).add(tx+","+ty); };
    for(const o of platObstacles){ if(o.r>=1.5) add(1,o.x,o.z); }       // 地下2階の売店など大きいもの
    for(const k of groundKiosks){ add(NF,k.x,k.z); }                    // 地上の売店
  }
  // ---------- 迷わせ要素：案内看板（一部は偽物＝矢印が誤った方向を指す） ----------
  function buildUpFields(){   // 各地下フロアから「上の階段」へ向かう経路場（看板の正しい向き判定用）
    upField={};
    for(let f=1;f<NF;f++){ const ent=[]; for(const s of stairs){ if(s.lvl===f) ent.push(s.entry); }
      if(ent.length) upField[f]=bfsField(f, ent, obsBlock[f]); }
  }
  function guideSignTex(){
    const cv=document.createElement("canvas"); cv.width=192; cv.height=96; const g=cv.getContext("2d");
    g.fillStyle="#0f7a39"; g.fillRect(0,0,192,96); g.strokeStyle="#fff"; g.lineWidth=5; g.strokeRect(5,5,182,86);
    g.fillStyle="#fff"; g.textAlign="center"; g.textBaseline="middle"; g.font="bold 52px sans-serif"; g.fillText("出口",96,52);
    const t=new THREE.CanvasTexture(cv); t.anisotropy=4; return t;
  }
  let guideSignTexCache=null;
  function makeGuideArrow(){   // +X方向を指す緑の矢印＋「出口」看板（本物/偽物とも同じ見た目）
    const grp=new THREE.Group();
    const mat=new THREE.MeshBasicMaterial({color:0x16a34a}); mat.toneMapped=false;
    grp.add(new THREE.Mesh(new THREE.BoxGeometry(1.7,0.06,0.5), mat));
    const head=new THREE.Mesh(new THREE.ConeGeometry(0.6,1.0,4), mat); head.rotation.z=-Math.PI/2; head.position.x=1.15; grp.add(head);
    if(!guideSignTexCache) guideSignTexCache=guideSignTex();
    const sign=new THREE.Mesh(new THREE.PlaneGeometry(1.4,0.7), new THREE.MeshBasicMaterial({map:guideSignTexCache,side:THREE.DoubleSide,transparent:true}));
    sign.material.toneMapped=false; sign.position.set(-0.2,1.8,0); grp.add(sign);
    return grp;
  }
  function placeGuideSigns(){
    for(let f=1;f<=NF;f++){
      const field = f===NF ? exitField : upField[f];
      if(!field) continue;
      let tiles=allFloorTiles(f).filter(t=> !stairTileSet.has(t.x+","+t.y)
        && !(obsBlock[f]&&obsBlock[f].has(t.x+","+t.y)) && field.step[t.y] && field.step[t.y][t.x]>=0);
      for(let i=tiles.length-1;i>0;i--){ const j=(Math.random()*(i+1))|0; [tiles[i],tiles[j]]=[tiles[j],tiles[i]]; }
      const placed=[];
      for(const t of tiles){
        if(placed.length>=10) break;
        if(placed.some(p=>Math.abs(p.x-t.x)+Math.abs(p.y-t.y)<6)) continue;
        placed.push(t);
        const genIdx=field.step[t.y][t.x];                     // 本物が指すべき方向
        let idx=genIdx;
        if(Math.random()<0.33){ const opts=[0,1,2,3].filter(k=>k!==genIdx); idx=opts[(Math.random()*opts.length)|0]; } // 約1/3は偽物
        const d=DIRS4[idx], w=tileToWorld(t.x,t.y), grp=makeGuideArrow();
        grp.position.set(w.x,(f-1)*FH+0.07,w.z); grp.rotation.y=Math.atan2(-d[1], d[0]);
        worldRoot.add(grp);
      }
    }
  }
  // flowFields["<floor>_<stairId>"]: そのフロアからその階段へ向かう経路場
  function buildFlowFields(){
    flowFields={};
    stairs.forEach((s,i)=>{
      if(s.lvl===2){ flowFields[(NF)+"_"+i]=bfsField(NF,[s.exit],obsBlock[NF]);  // 地上→その階段(降り口)
                     flowFields["2_"+i]=bfsField(2,[s.entry]); }    // 地下1階→その階段(上り口)
      else if(s.lvl===1){ flowFields["1_"+i]=bfsField(1,[s.entry],obsBlock[1]);  // 地下2階→その階段(上り口)
                          flowFields["2_"+i]=bfsField(2,[s.exit]); } // 地下1階→その階段(降り口)＝敵の下り移動用
    });
  }
  function fieldAt(floor,sid,x,z){
    const ff=flowFields[floor+"_"+sid]; if(!ff) return null;
    const tx=Math.floor(x/T), ty=Math.floor(z/T);
    if(tx<0||ty<0||tx>=C.COLS||ty>=C.ROWS) return null;
    return {dist:ff.dist[ty][tx], step:ff.step[ty][tx]};
  }
  // 現在地から行ける階段のうち、直前に使った階段を除き「距離＋混雑度」が最小のものを選ぶ（渋滞を分散）
  let stairLoad=[];   // 各階段に向かっている+乗っている総数（pickStairの分散用）
  let stairRiders=[]; // 各階段に今“乗っている”人数（混雑キャップ用。乗ると減っていくのでデッドロックしない）
  function pickStair(p){
    const f=p.level, dir=(f===NF)?-1:1;
    let best=-1,bd=1e9, any=-1,ad=1e9;
    for(let i=0;i<stairs.length;i++){ const s=stairs[i];
      if(dir>0 ? s.lvl!==f : s.lvl+1!==f) continue;
      if(s.oneWay!==undefined && s.oneWay!==dir) continue;            // 一方通行：方向の合う階段だけ
      const fl=fieldAt(f,i,p.x,p.z); if(!fl || fl.dist<0) continue;   // ここから到達不能な階段は除外
      const score=fl.dist + (stairLoad[i]||0)*1.5;                    // 混んでいる階段は避ける
      if(score<ad){ ad=score; any=i; }
      if(i!==p.lastStair && score<bd){ bd=score; best=i; }
    }
    return best>=0?best:any;   // 直前と別の・空いている階段を優先。無ければ到達可能な最寄り
  }
  // 地上の売店：中央の広場に7か所（階段の近く・出口(外周)の近くには置かない）
  function findGroundKiosks(){
    groundKiosks=[]; kioskFields={};
    const f=NF, g=grids[f];
    const isFloor=(x,y)=> x>=0&&y>=0&&x<C.COLS&&y<C.ROWS && g[y][x]===0 && !stairTileSet.has(x+","+y);
    const open=Array.from({length:C.ROWS},()=>new Array(C.COLS).fill(false));
    for(let y=0;y<C.ROWS-1;y++)for(let x=0;x<C.COLS-1;x++){
      if(isFloor(x,y)&&isFloor(x+1,y)&&isFloor(x,y+1)&&isFloor(x+1,y+1)){
        open[y][x]=open[y][x+1]=open[y+1][x]=open[y+1][x+1]=true; } }
    const cxC=(C.COLS-1)/2, cyC=(C.ROWS-1)/2;          // マップ中央
    const margin=5;                                    // 外周(出口)からこれだけ離す
    const stairClear=5;                                // 階段からこれだけ離す（タイル）
    const stC=stairs.map(s=>[s.cx/T, s.cz/T]);
    // 中央付近で、階段・外周(出口)から離れた広場タイルを集めて中央に近い順に並べる
    const cand=[];
    for(let y=margin;y<C.ROWS-margin;y++)for(let x=margin;x<C.COLS-margin;x++){
      if(!open[y][x] || stairTileSet.has(x+","+y)) continue;
      let okS=true; for(const [sx,sy] of stC){ if(Math.hypot(x+0.5-sx,y+0.5-sy)<stairClear){ okS=false; break; } }
      if(!okS) continue;
      cand.push({x,y,dc:Math.hypot(x-cxC,y-cyC)});
    }
    cand.sort((a,b)=>a.dc-b.dc);                        // 中央に近い順
    for(let gap=5; gap>=2 && groundKiosks.length<7; gap--){
      for(const c of cand){
        if(groundKiosks.length>=7) break;
        if(groundKiosks.some(k=>Math.abs(k.tx-c.x)+Math.abs(k.ty-c.y)<gap)) continue;
        const w=tileToWorld(c.x,c.y);
        groundKiosks.push({x:w.x, z:w.z, r:2.0, tx:c.x, ty:c.y});
      }
    }
    groundKiosks.forEach((k,i)=>{ kioskFields[i]=bfsField(NF,[[k.tx,k.ty]]); });
  }
  // 現在地から到達できる売店のうち最寄りを選ぶ
  function pickKiosk(p){
    let best=-1,bd=1e9; const tx=Math.floor(p.x/T),ty=Math.floor(p.z/T);
    if(tx<0||ty<0||tx>=C.COLS||ty>=C.ROWS) return -1;
    for(let i=0;i<groundKiosks.length;i++){ const ff=kioskFields[i]; if(!ff)continue;
      const d=ff.dist[ty][tx]; if(d<0)continue; if(d<bd){bd=d;best=i;} }
    return best;
  }
  // 売店へ向かい、着いたら一定時間「出入り(滞在)」してから徘徊に戻る
  function kioskStep(p, dt){
    const k=groundKiosks[p.ktarget];
    if(!k){ p.kind="W"; wanderStep(p,dt); return; }
    if(p.visit>0){ p.visit-=dt; p.ry=Math.atan2(k.x-p.x,k.z-p.z);
      if(p.visit<=0){ p.kind="W"; p.goal=0; p.trip=-1; p.roleT=4+Math.random()*6; } return; }
    if(Math.hypot(p.x-k.x,p.z-k.z) < k.r+1.4){ p.visit=2.5+Math.random()*2.5; return; }  // 到着→出入り
    const ff=kioskFields[p.ktarget], tx=Math.floor(p.x/T), ty=Math.floor(p.z/T);
    if(ff && tx>=0&&ty>=0&&tx<C.COLS&&ty<C.ROWS && ff.step[ty][tx]>=0){
      const dd=DIRS4[ff.step[ty][tx]], tw=tileToWorld(tx+dd[0],ty+dd[1]); pedMoveDir(p, tw.x-p.x, tw.z-p.z, dt, false);
    } else { pedMoveDir(p, k.x-p.x, k.z-p.z, dt, false); }
  }
  // 歩行者をインスタンス描画（脚/頭は共有、胴は服色ごとに分ける）
  let pedLegsInst=null, pedHeadInst=null, pedTorsoInsts={};
  const _pedDummy=new THREE.Object3D();
  function buildPedInstances(){
    const n=pedestrians.length;
    pedTorsoInsts={};
    if(!n){ pedLegsInst=pedHeadInst=null; return; }
    pedLegsInst=new THREE.InstancedMesh(legGeo, legMat, n);
    pedHeadInst=new THREE.InstancedMesh(headGeo, skinMat, n);
    pedLegsInst.frustumCulled=false; pedHeadInst.frustumCulled=false;
    worldRoot.add(pedLegsInst, pedHeadInst);
    const counts={};
    pedestrians.forEach((p,i)=>{ p.gi=i; counts[p.ci]=(counts[p.ci]||0)+1; });
    for(const ci in counts){ const im=new THREE.InstancedMesh(torsoGeo, new THREE.MeshLambertMaterial({color:clothColors[ci]}), counts[ci]); im.frustumCulled=false; pedTorsoInsts[ci]=im; }
    for(const ci in pedTorsoInsts) worldRoot.add(pedTorsoInsts[ci]);
    const li={}; pedestrians.forEach(p=>{ p.ti=(li[p.ci]=(li[p.ci]||0)); li[p.ci]++; });
  }

  // 指定フロアの、既存湧きから離れた湧き位置（ワールド座標）
  function spawnOnFloor(f, used){
    let tiles=allFloorTiles(f).filter(t=>!stairTileSet.has(t.x+","+t.y));
    for(let i=tiles.length-1;i>0;i--){const j=(Math.random()*(i+1))|0;[tiles[i],tiles[j]]=[tiles[j],tiles[i]];}
    let pick=tiles[0]||{x:1,y:1};
    for(const t of tiles){ if(!used.some(u=>u.f===f&&Math.abs(u.x-t.x)+Math.abs(u.y-t.y)<5)){pick=t;break;} }
    used.push({f,x:pick.x,y:pick.y});
    return tileToWorld(pick.x,pick.y);
  }
  // 指定ホーム(lane)上のランダム位置（地下2階の敵をプレイヤーと同じホームに置く用）
  function spawnOnLane(idx){
    const [x0,x1]=LANES[idx]; const xc=x0+1; const tiles=[];
    for(let y=PLAT_TOP;y<=PLAT_BOT;y++) for(let x=x0;x<=x1;x++)
      if(grids[1][y][x]===0 && !stairTileSet.has(x+","+y) && !(x===xc&&OBJ_ROWS.includes(y))) tiles.push({x,y});
    const t=tiles.length?tiles[(Math.random()*tiles.length)|0]:{x:x0,y:PLAT_TOP};
    return tileToWorld(t.x,t.y);
  }

  // 出口（最上階・外周）
  function placeExits(topSkip){
    const topBase=(NF-1)*FH;
    const cand=[];
    for(let y=0;y<C.ROWS;y++)for(let x=0;x<C.COLS;x++){
      if(grids[NF][y][x]!==0 || stairTileSet.has(x+","+y)) continue;
      let ox=0,oy=0,bx=0,by=0;
      if(x===1){ox=-1;bx=0;by=y;} else if(x===C.COLS-2){ox=1;bx=C.COLS-1;by=y;}
      else if(y===1){oy=-1;bx=x;by=0;} else if(y===C.ROWS-2){oy=1;bx=x;by=C.ROWS-1;}
      else continue;
      cand.push({tx:x,ty:y,ox,oy,bx,by});
    }
    shuffle(cand);
    const chosen=[];
    // 間隔をあけて選ぶ。目標数に届かなければ間隔を詰めて追加（14個を必ず確保）
    for(let gap=4; gap>=1 && chosen.length<C.EXIT_COUNT; gap--){
      for(const c of cand){
        if(chosen.length>=C.EXIT_COUNT) break;
        if(chosen.includes(c)) continue;
        if(chosen.some(p=>Math.abs(p.tx-c.tx)+Math.abs(p.ty-c.ty)<gap)) continue;
        chosen.push(c);
      }
    }
    // 番号を外周(時計回り)順に並べる＝1,2,3,..が順に並ぶ
    const perimIdx=c=> c.oy<0 ? c.tx : (c.ox>0 ? C.COLS+c.ty : (c.oy>0 ? C.COLS+C.ROWS+(C.COLS-c.tx) : 2*C.COLS+C.ROWS+(C.ROWS-c.ty)));
    chosen.sort((a,b)=>perimIdx(a)-perimIdx(b));
    chosen.forEach((c,idx)=>{
      const no=idx+1;
      const wide=(no===3||no===5);          // 3番・5番は横幅5倍の改札出口
      const mid=(no===8);                   // 8番は「少し大きめ」(3マス幅)
      const half=wide?2:(mid?1:0);
      const perpx=(c.ox===0)?1:0, perpy=(c.oy===0)?1:0;
      const w=tileToWorld(c.tx,c.ty);
      const mx=w.x+c.ox*T*0.5, mz=w.z+c.oy*T*0.5;
      const signTex=new THREE.MeshBasicMaterial({map:exitSignTextureV(no),side:THREE.DoubleSide});
      for(let k=-half;k<=half;k++){
        const bx=c.bx+k*perpx, by=c.by+k*perpy;
        if(bx>=0&&by>=0&&bx<C.COLS&&by<C.ROWS) topSkip.add(bx+","+by); // 壁を開口
        if(wide||mid){
          const ix=c.tx+k*perpx, iy=c.ty+k*perpy;
          if(inInner(ix,iy)&&!stairTileSet.has(ix+","+iy)) grids[NF][iy][ix]=0;
          const jx=ix-c.ox, jy=iy-c.oy;     // 一つ内側も開けて改札前の広場に
          if(inInner(jx,jy)&&!stairTileSet.has(jx+","+jy)) grids[NF][jy][jx]=0;
        }
      }
      // ① ドアの真上に大きな出口番号サイン（構内側を向く＝必ず見える）
      const ph1=topBase+FH*0.78, sw=wide?T*1.8:(mid?T*1.3:T*0.9);
      const sign1=new THREE.Mesh(new THREE.PlaneGeometry(sw,T*0.7), signTex);
      sign1.position.set(mx-c.ox*0.15, ph1, mz-c.oy*0.15); sign1.lookAt(w.x, ph1, w.z); worldRoot.add(sign1);
      // ② 横に縦長サイン＋ポール
      const leftx=c.oy, leftz=-c.ox, ph2=topBase+1.7, sideOff=wide?T*2.4:(mid?T*1.3:T*0.7);
      const sx=mx + c.ox*T*0.45 + leftx*sideOff, sz=mz + c.oy*T*0.45 + leftz*sideOff;
      const sign2=new THREE.Mesh(new THREE.PlaneGeometry(T*0.34,T*0.7), signTex);
      sign2.position.set(sx, ph2, sz); sign2.lookAt(w.x, ph2, w.z); worldRoot.add(sign2);
      const post=new THREE.Mesh(new THREE.BoxGeometry(0.1, ph2-topBase, 0.1), new THREE.MeshLambertMaterial({color:0x8b9197}));
      post.position.set(sx, topBase+(ph2-topBase)/2, sz); worldRoot.add(post);
      // 出口の外は地上の広場（フラット。広い改札は幅広）
      buildOutsidePlaza(mx,mz,c.ox,c.oy,topBase, wide?T*4.6:(mid?T*2.2:T*0.85));
      // 改札ゲートの柱（広い出口のみ）
      if(wide){
        const gateMat=new THREE.MeshLambertMaterial({color:0x4a5560});
        for(let k=-2;k<=3;k++){
          const gx=mx+perpx*(k-0.5)*T, gz=mz+perpy*(k-0.5)*T;
          const gate=new THREE.Mesh(new THREE.BoxGeometry(0.45,1.3,0.9), gateMat);
          gate.position.set(gx - c.ox*0.6, topBase+0.65, gz - c.oy*0.6); worldRoot.add(gate);
        }
      }
      const inner=tileToWorld(c.tx,c.ty);   // 出口の構内側の床（人の出入り口）
      exits.push({no, tx:c.tx, ty:c.ty, x:mx, z:mz, sx:inner.x, sz:inner.z, level:NF, wide, mid});
    });
    // 正解の出口は毎回ランダム（固定シードのRNGではなくMath.randomを使う）
    correctExitNo=(C.CORRECT_EXIT && exits.some(e=>e.no===C.CORRECT_EXIT))
      ? C.CORRECT_EXIT : (exits.length?exits[(Math.random()*exits.length)|0].no:1);
  }

  // 出口の外＝地上の広場（フラットに広がる。階段なし）
  function buildOutsidePlaza(mx,mz,ox,oy,base,pw){
    pw=pw||T*0.85;
    const len=T*12, pwz=pw+T*5;                       // 奥行きと、開口より広く広がる幅
    const geo=ox!==0? new THREE.PlaneGeometry(len,pwz) : new THREE.PlaneGeometry(pwz,len);
    const floor=new THREE.Mesh(geo, plazaMat);
    floor.rotation.x=-Math.PI/2; floor.position.set(mx+ox*len/2, base+0.02, mz+oy*len/2); worldRoot.add(floor);
    // 明るい空（霧を無視・大きめ）
    const skyW=Math.max(T*9,pwz+T*2);
    const sky=ox!==0? new THREE.BoxGeometry(0.5,T*9,skyW) : new THREE.BoxGeometry(skyW,T*9,0.5);
    const wall=new THREE.Mesh(sky,skyMat); wall.position.set(mx+ox*(len-T), base+T*3, mz+oy*(len-T)); worldRoot.add(wall);
  }

  // ---------- 入力 ----------
  const player={x:0,z:0,y:0,yaw:0,pitch:0,level:1};
  const keys={}; let running=false, locked=false, userMode=false, stepAcc=0, alertPrev=false, crouching=false;
  addEventListener("keydown",e=>{const k=e.key.toLowerCase();keys[k]=true;
    if(k==="m" && !userMode) setMapCollapsed(!mapCollapsed);   // Mでマップ開閉（ユーザープレイ時は無効）
    if(["arrowup","arrowdown","arrowleft","arrowright"].includes(k))e.preventDefault();});
  addEventListener("keyup",e=>{keys[e.key.toLowerCase()]=false;});

  function applyLook(mx,my,sens){
    player.yaw+=mx*sens*lookX; player.pitch+=my*sens*lookY;
    const lim=Math.PI/2-0.05; player.pitch=Math.max(-lim,Math.min(lim,player.pitch));
  }
  const canvasEl=renderer.domElement;
  document.addEventListener("mousemove",e=>{ if(locked) applyLook(e.movementX,e.movementY,C.MOUSE_SENS); });
  document.addEventListener("pointerlockchange",()=>{ locked=(document.pointerLockElement===canvasEl); if(running&&!locked) pauseToStart(); });
  function requestLock(){ if(canvasEl.requestPointerLock) canvasEl.requestPointerLock(); }

  const isTouch=("ontouchstart" in window)||navigator.maxTouchPoints>0;
  let lookId=null,lastLook=null;
  function setupTouch(){
    if(!isTouch) return; touch.style.display="block";
    touch.addEventListener("touchstart",e=>{for(const t of e.changedTouches){ if(t.target.closest("#pad"))continue; if(lookId===null){lookId=t.identifier;lastLook={x:t.clientX,y:t.clientY};}}},{passive:true});
    touch.addEventListener("touchmove",e=>{for(const t of e.changedTouches){ if(t.identifier===lookId&&lastLook){ applyLook(t.clientX-lastLook.x,t.clientY-lastLook.y,0.005); lastLook={x:t.clientX,y:t.clientY}; }}},{passive:true});
    touch.addEventListener("touchend",e=>{for(const t of e.changedTouches){ if(t.identifier===lookId){lookId=null;lastLook=null;}}},{passive:true});
    const map={up:"w",down:"s",left:"a",right:"d"};
    document.querySelectorAll("#pad div").forEach(el=>{ const key=map[el.className];
      el.addEventListener("touchstart",e=>{e.preventDefault();keys[key]=true;},{passive:false});
      el.addEventListener("touchend",e=>{e.preventDefault();keys[key]=false;},{passive:false});
      el.addEventListener("touchcancel",e=>{e.preventDefault();keys[key]=false;},{passive:false});
    });
  }

  // ---------- 進行 ----------
  // 5つのホームのどこかをランダムに開始位置として返す
  let playerStartLane=0;
  function platformStartTile(){
    const li=(Math.random()*LANES.length)|0; playerStartLane=li;   // どのホームかを記録
    const [x0,x1]=LANES[li]; const xc=x0+1; const tiles=[];
    for(let y=PLAT_TOP;y<=PLAT_BOT;y++) for(let x=x0;x<=x1;x++)
      if(grids[1][y][x]===0 && !stairTileSet.has(x+","+y) && !(x===xc&&OBJ_ROWS.includes(y))) tiles.push({x,y});
    const t=tiles.length?tiles[(Math.random()*tiles.length)|0]:{x:x0,y:PLAT_TOP};
    return tileToWorld(t.x,t.y);
  }
  function startGame(){
    RNG = mulberry32(C.SEED);   // 毎回同じマップにする
    generateAllFloors(); findStairs(); cleanupDeadEnds();
    const s=platformStartTile();    // 5つのホームのどれかをランダムに選んで開始（ホームを記録）

    player.x=s.x; player.z=s.z; player.y=0; player.yaw=0; player.pitch=0; player.level=1;

    player.plevel=1;   // 階移動の効果音用
    const showMap = C.SHOW_MAP && !userMode;   // ユーザープレイ時はマップを消す
    if(showMap){ mapCv.width=C.COLS*MAP_CELL; mapCv.height=C.ROWS*MAP_CELL;
      mapCv.classList.remove("hidden"); mapLabel.classList.remove("hidden"); mapToggle.classList.remove("hidden");
      mapLabel.style.top=(66+mapCv.height)+"px"; setMapCollapsed(mapCollapsed); }
    else { mapCv.classList.add("hidden"); mapLabel.classList.add("hidden"); mapToggle.classList.add("hidden"); }
    startScreen.classList.add("hidden"); resultScreen.classList.add("hidden");

  }
  function pauseToStart(){ if(!running)return; running=false;
    startScreen.querySelector("h1").textContent="一時停止中"; startScreen.classList.remove("hidden"); }
  function endGame(cleared){ running=false; if(document.exitPointerLock)document.exitPointerLock();
    resultText.textContent=cleared?"CLEAR!":"GAME OVER"; resultText.className=cleared?"clear":"over";
    resultScreen.classList.remove("hidden"); cross.classList.add("hidden");
    if(cleared) sfxClear(); else sfxOver(); }

  function beginOrResume(asUser){
    ensureAudio();
    if(startScreen.querySelector("h1").textContent==="一時停止中"){ // 一時停止からの再開（モードは維持）
      startScreen.classList.add("hidden"); running=true; if(!isTouch)requestLock(); return;

  devBtn.addEventListener("click",()=>beginOrResume(false));
  userBtn.addEventListener("click",()=>beginOrResume(true));
