  // ---------- 移動 ----------
  const fwd=new THREE.Vector3(), right=new THREE.Vector3(), up=new THREE.Vector3(0,1,0);
  function playerCanStand(x,z){
    if(!canStand(x,z,PLAYER_R,player.level)) return false;
    if(obstacleHit(x,z,0.45,player.level)) return false;   // 地下2階の中央オブジェクト／地上の売店
    // 階段とその周辺ではプレイヤー優先＝通行人で絶対に詰まらない（必ず通れる）
    let nearStair=isStairTileAt(x,z) || isStairTileAt(player.x,player.z);
    if(!nearStair){
      for(const s of stairs){ if(s.lvl===player.level||s.lvl+1===player.level){
        if(Math.abs(x-s.cx)<T*2.2 && Math.abs(z-s.cz)<T*2.2){ nearStair=true; break; } } }
    }
    if(!nearStair){
      for(const p of pedestrians){ if(p.level===player.level && Math.hypot(x-p.x,z-p.z)<PED_R+0.35) return false; }
    }
    return true;
  }
  function updatePlayer(dt){
    camera.rotation.set(player.pitch,player.yaw,0);
    camera.getWorldDirection(fwd); fwd.y=0; fwd.normalize(); right.crossVectors(fwd,up).normalize();
    let mf=0,ms=0;
    if(keys["w"]||keys["arrowup"])mf+=1; if(keys["s"]||keys["arrowdown"])mf-=1;
    if(keys["d"]||keys["arrowright"])ms+=1; if(keys["a"]||keys["arrowleft"])ms-=1;
    const px0=player.x, pz0=player.z;
    let vx=fwd.x*mf+right.x*ms, vz=fwd.z*mf+right.z*ms; const len=Math.hypot(vx,vz);
    crouching = (keys["c"]||keys["control"]) && !carrying;   // 連れている間はしゃがめない
    const spd = carrying ? C.WALK_SPEED : (crouching ? C.CROUCH_SPEED : C.MOVE_SPEED);
    if(len>0){ vx=vx/len*spd*dt; vz=vz/len*spd*dt;
      if(playerCanStand(player.x+vx,player.z)) player.x+=vx;
      if(playerCanStand(player.x,player.z+vz)) player.z+=vz;
    }
    if(player.x!==px0 || player.z!==pz0){ stepAcc+=dt; if(stepAcc>=0.42){ stepAcc=0; sfxStep(); } }  // 足音
    const si=stairInfo(player.x,player.z,player.level);
    if(si){ player.y=si.y; player.level=si.t>=0.5?si.lvl+1:si.lvl; } else { player.y=(player.level-1)*FH; }
    if(player.level!==player.plevel){ player.plevel=player.level; sfxFloor(); }   // 階移動の音
    camera.position.set(player.x, player.y+(crouching?C.CROUCH_EYE:C.EYE_HEIGHT), player.z);
  }

  function entCanStand(x,z,r,f){ return canStand(x,z,r,f) && !obstacleHit(x,z,0.3,f); }
  function moveToward(ent,tx,tz,speed,dt,r){
    const f=ent.level;
    let dx=tx-ent.x, dz=tz-ent.z; const len=Math.hypot(dx,dz);
    if(len>0.001){ dx=dx/len*speed*dt; dz=dz/len*speed*dt;
      const bx=ent.x,bz=ent.z;
      if(entCanStand(ent.x+dx,ent.z,r,f)) ent.x+=dx;
      if(entCanStand(ent.x,ent.z+dz,r,f)) ent.z+=dz;
      if(ent.x===bx&&ent.z===bz){
        const alt=Math.abs(dx)>Math.abs(dz)?[[0,speed*dt],[0,-speed*dt]]:[[speed*dt,0],[-speed*dt,0]];
        for(const [ax,az] of alt){ if(entCanStand(ent.x+ax,ent.z+az,r,f)){ent.x+=ax;ent.z+=az;break;} }
      }
    }
  }

  // 巡回の目標（遠い到達可能タイル）を選び、そこへ向かう経路場を作る＝フロアを大きく巡回
  function newPatrolTarget(chaser){
    const f=chaser.level, tx=Math.floor(chaser.x/T), ty=Math.floor(chaser.z/T), blk=obsBlock[f];
    if(tx<0||ty<0||tx>=C.COLS||ty>=C.ROWS) return;
    const fromEnemy=bfsField(f,[[tx,ty]],blk);          // 敵からの距離（売店などは避ける）
    let far=[];
    for(let y=0;y<C.ROWS;y++)for(let x=0;x<C.COLS;x++){ if(fromEnemy.dist[y][x]>=12) far.push([x,y]); }
    if(!far.length){ for(let y=0;y<C.ROWS;y++)for(let x=0;x<C.COLS;x++){ if(fromEnemy.dist[y][x]>=2) far.push([x,y]); } }
    if(!far.length) return;
    const t=far[(Math.random()*far.length)|0];
    chaser.patField=bfsField(f,[[t[0],t[1]]],blk); chaser.patReached=false;
  }
  function patrolStep(chaser, dt){
    if(!chaser.patField || chaser.patReached){ newPatrolTarget(chaser); }
    const ff=chaser.patField;
    const tx=Math.floor(chaser.x/T), ty=Math.floor(chaser.z/T);
    const d=(ff && tx>=0&&ty>=0&&tx<C.COLS&&ty<C.ROWS)? ff.dist[ty][tx] : -1;
    if(ff && d>=0 && d<=1){ chaser.patReached=true; return; }                    // 到着→次の巡回先
    if(ff && d>=0 && ff.step[ty][tx]>=0){ const dd=DIRS4[ff.step[ty][tx]], tw=tileToWorld(tx+dd[0],ty+dd[1]);
      moveToward(chaser, tw.x, tw.z, C.CHASER_WANDER, dt, CHASER_R); }
    else { // 経路場が無い/外れた→ランダム方向に歩いて次の目標を引く（絶対に止まらない）
      if(chaser.dir==null) chaser.dir=Math.random()*6.28;
      moveToward(chaser, chaser.x+Math.cos(chaser.dir)*4, chaser.z+Math.sin(chaser.dir)*4, C.CHASER_WANDER, dt, CHASER_R);
      chaser.patReached=true;
    }
  }
  // フロア間移動（巡回先ではなく階段へ向かい渡る）
  function enemyStair(x,z,f,dir){
    let best=-1,bd=1e9, tx=Math.floor(x/T),ty=Math.floor(z/T);
    if(tx<0||ty<0||tx>=C.COLS||ty>=C.ROWS) return -1;
    for(let i=0;i<stairs.length;i++){ const s=stairs[i];
      if(dir>0? s.lvl!==f : s.lvl+1!==f) continue;
      const ff=flowFields[f+"_"+i]; if(!ff) continue;
      const dd=ff.dist[ty][tx]; if(dd<0) continue;
      if(dd<bd){ bd=dd; best=i; } }
    return best;
  }
  function enemyTransitStep(chaser, dt){
    const t=chaser.transit; t.t=(t.t||0)+dt;
    if(t.t>30){ // 安全策：万一渡れず詰まったら目的フロアへワープして到着扱い（人数を必ず保つ）
      const tiles=allFloorTiles(t.goal).filter(q=>!stairTileSet.has(q.x+","+q.y));
      if(tiles.length){ const q=tiles[(Math.random()*tiles.length)|0], w=tileToWorld(q.x,q.y); chaser.x=w.x; chaser.z=w.z; chaser.level=t.goal; }
      return;
    }
    const s=stairs[t.sid], ff=flowFields[chaser.level+"_"+t.sid];
    const tx=Math.floor(chaser.x/T), ty=Math.floor(chaser.z/T);
    const fd=(ff && tx>=0&&ty>=0&&tx<C.COLS&&ty<C.ROWS)? ff.dist[ty][tx] : -2;
    if(isStairTileAt(chaser.x,chaser.z) || (fd>=0 && fd<=1)){   // 階段口/階段上→渡る
      const dest=t.dir>0? s.exit : s.entry, dw=tileToWorld(dest[0],dest[1]);
      moveToward(chaser, dw.x, dw.z, C.CHASER_WANDER, dt, CHASER_R);
    } else if(ff && fd>=0 && ff.step[ty][tx]>=0){
      const dd=DIRS4[ff.step[ty][tx]], tw=tileToWorld(tx+dd[0],ty+dd[1]);
      moveToward(chaser, tw.x, tw.z, C.CHASER_WANDER, dt, CHASER_R);
    } else {                                                    // 経路が見つからない→階段を選び直す/中心へ
      const si=enemyStair(chaser.x,chaser.z,chaser.level,t.dir);
      if(si>=0 && si!==t.sid){ t.sid=si; } else { moveToward(chaser, s.cx, s.cz, C.CHASER_WANDER, dt, CHASER_R); }
    }
  }
  function startTransit(c, dir){
    const goal=c.level+dir, sid=enemyStair(c.x,c.z,c.level,dir);
    if(sid<0){ c.floorTimer=4+Math.random()*4; return false; }   // 階段に行けない→後で再挑戦
    c.mode="transit"; c.transit={dir,goal,sid}; return true;
  }
  // フロア間の入れ替え：隣り合う階で「巡回時間が過ぎた敵」が両方に居たら同時に交換＝人数を保つ
  function swapChaserFloors(){
    for(let f=1; f<NF; f++){
      const a=chasers.find(c=> c.level===f   && c.mode==="patrol" && c.floorTimer<=0 && c.mem<=0);
      const b=chasers.find(c=> c.level===f+1 && c.mode==="patrol" && c.floorTimer<=0 && c.mem<=0);
      if(a && b){ if(startTransit(a,+1)) startTransit(b,-1); }    // a:上へ / b:下へ
    }
  }
  function updateChasers(dt){
    swapChaserFloors();
    for(const chaser of chasers){
      const same=chaser.level===player.level;
      const d=Math.hypot(player.x-chaser.x, player.z-chaser.z);
      let sight=chaser.alerted?C.CHASER_SIGHT*C.ALERT_SIGHT_MULT:C.CHASER_SIGHT;
      if(crouching) sight*=C.CROUCH_SIGHT_MULT;                 // しゃがむと見つかりにくい
      let see=same && d<sight && hasLOS(chaser.x,chaser.z,player.x,player.z,chaser.level);
      if(see && crouching && pedestrians.some(p=>p.level===player.level && Math.hypot(p.x-player.x,p.z-player.z)<C.CROUCH_HIDE_PED)) see=false; // 人混みに紛れる
      if(see){ chaser.lx=player.x; chaser.lz=player.z; chaser.alerted=true; chaser.mem=C.CHASER_MEMORY; }
      else if(chaser.mem>0) chaser.mem-=dt;
      // 追跡は「巡回中＆同フロア」のみ（移動中=transitは横断に専念）。スピードは従来どおり
      const chasing = chaser.mode==="patrol" && same && chaser.mem>0;
      chaser.showAlert = chasing;
      chaser.state = chasing? (see?"発見・追跡":"捜索") : (chaser.mode==="transit"?"別フロアへ移動":"巡回");

      if(chasing){
        moveToward(chaser, chaser.lx, chaser.lz, C.CHASER_SPEED, dt, CHASER_R);
      } else if(chaser.mode==="transit"){
        enemyTransitStep(chaser, dt);
      } else {
        chaser.floorTimer-=dt;
        patrolStep(chaser, dt);
      }
      let mvx=chaser.x-chaser._px, mvz=chaser.z-chaser._pz;
      // どのモードでも「止まり続けない」安全策：0.5秒動けなければランダムに押し出す（柱/売店などに詰まっても解消）
      if(Math.hypot(mvx,mvz)<0.002){
        chaser._stuck=(chaser._stuck||0)+dt;
        if(chaser._stuck>0.5){ chaser._stuck=0; const a=Math.random()*6.28;
          moveToward(chaser, chaser.x+Math.cos(a)*4, chaser.z+Math.sin(a)*4, C.CHASER_WANDER, dt, CHASER_R);
          chaser.dir=a; chaser.patReached=true;
          mvx=chaser.x-chaser._px; mvz=chaser.z-chaser._pz;
        }
      } else chaser._stuck=0;
      chaser._px=chaser.x; chaser._pz=chaser.z;

      const si=stairInfo(chaser.x,chaser.z,chaser.level);
      if(si){ chaser.y=si.y; chaser.level=si.t>=0.5?si.lvl+1:si.lvl; } else { chaser.y=(chaser.level-1)*FH; }
      if(chaser.mode==="transit" && !si && chaser.transit && chaser.level===chaser.transit.goal){  // 到着→巡回へ
        chaser.mode="patrol"; chaser.transit=null; chaser.patField=null; chaser.patReached=true;
        chaser.floorTimer=C.CHASER_FLOOR_TIME*(0.6+Math.random()*0.8);
      }
      chaser.group.position.set(chaser.x,chaser.y+FOOT_LIFT,chaser.z);
      if(chasing){ chaser.group.lookAt(player.x, chaser.y+1+FOOT_LIFT, player.z); }
      else if(Math.hypot(mvx,mvz)>0.0001){ chaser.group.rotation.set(0,Math.atan2(mvx,mvz),0); }   // 巡回中は進行方向を向く
    }
  }

  // 1歩動かす（dir=希望方向。allowStair=trueなら階段に乗れる＝徘徊者は乗らない）
  function pedMoveDir(p, vx, vz, dt, allowStair){
    let dodge=false;
    if(p.level===player.level){
      const dx=p.x-player.x, dz=p.z-player.z, d=Math.hypot(dx,dz);
      // 階段上ではプレイヤーをより強く避け、ぶつかったら素早く退く（プレイヤー優先）
      const R=allowStair? C.PED_AVOID_R*1.7 : C.PED_AVOID_R;
      const wMul=allowStair? 3.6 : 2.0, near=allowStair? 1.8 : 1.1;
      if(d<R && d>0.001){ const w=(R-d)/R*wMul; vx+=dx/d*w; vz+=dz/d*w;
        if(d<near){ vx=dx/d; vz=dz/d; dodge=true; } }
    }
    const L=Math.hypot(vx,vz); if(L>0.0001){ vx/=L; vz/=L; }
    const sp= dodge? C.PED_DODGE_SPEED*(allowStair?1.7:1)
                   : (allowStair? C.PED_SPEED*1.8 : (p.rush>0? C.PED_RUSH_SPEED : C.PED_SPEED)); // 階段は速く通り抜け＝詰まりにくく
    const nx=vx*sp*dt, nz=vz*sp*dt, f=p.level;
    const ok=(X,Z)=> allowStair ? entCanStand(X,Z,PED_R,f)
                                : (canStandPed(X,Z,PED_R,f) && !obstacleHit(X,Z,0.3,f));
    let moved=false;
    if(ok(p.x+nx,p.z)){ p.x+=nx; moved=true; }
    if(ok(p.x,p.z+nz)){ p.z+=nz; moved=true; }
    if(L>0.0001) p.ry=Math.atan2(vx,vz);
    return moved;
  }
  // 人口密度の粗いグリッド（地上・地下1階で「空いている方へ寄る」傾向に使う）
  const DCELL=4, densW=Math.ceil(C.COLS/DCELL), densH=Math.ceil(C.ROWS/DCELL);
  let densGrid={}, densAccum=0;
  function computeDensity(){
    densGrid={};
    for(let f=1;f<=NF;f++){ densGrid[f]=Array.from({length:densH},()=>new Array(densW).fill(0)); }
    for(const p of pedestrians){
      const cx=Math.max(0,Math.min(densW-1,(p.x/T/DCELL)|0)), cy=Math.max(0,Math.min(densH-1,(p.z/T/DCELL)|0));
      if(densGrid[p.level]) densGrid[p.level][cy][cx]++;
    }
  }
  // 自分のセルより空いている隣セルがあればその向きを返す（最も空いている方）。無ければ null
  function lowDensityDir(p){
    const dg=densGrid[p.level]; if(!dg) return null;
    const cx=(p.x/T/DCELL)|0, cy=(p.z/T/DCELL)|0;
    if(cx<0||cy<0||cx>=densW||cy>=densH) return null;
    let bx=0,bz=0,bd=dg[cy][cx];
    for(const [dx,dy] of DIRS4){ const nx=cx+dx,ny=cy+dy;
      if(nx<0||ny<0||nx>=densW||ny>=densH) continue;
      if(dg[ny][nx]<bd){ bd=dg[ny][nx]; bx=dx; bz=dy; } }
    if(bx===0&&bz===0) return null;   // 自分のセルが一番空いている→そのまま
    return Math.atan2(bz,bx);
  }
  function wanderStep(p, dt){
    p.timer-=dt;
    if(p.timer<=0){
      let nd=null;
      if(p.level===2 || p.level===NF) nd=lowDensityDir(p);     // 地上/地下1階は空いている方へ寄る傾向
      p.dir = (nd!==null && Math.random()<0.6) ? nd+(Math.random()-0.5)*0.9 : Math.random()*6.28;
      p.timer=1.5+Math.random()*3;
      if(p.rush<=0 && Math.random()<C.PED_RUSH_CHANCE) p.rush=1.2+Math.random()*1.8; }
    if(p.rush>0) p.rush-=dt;
    if(!pedMoveDir(p, Math.cos(p.dir), Math.sin(p.dir), dt, false)){ p.dir=Math.random()*6.28; p.timer=0.5; }
  }
  function moverStep(p, dt){
    if(p.rush>0) p.rush-=dt;
    if(p.ride){ pedMoveDir(p, p.ride.dx-p.x, p.ride.dz-p.z, dt, true); return; }
    if(p.trip<0){ p.trip=pickStair(p); if(p.trip<0){ wanderStep(p,dt); return; } }
    const s=stairs[p.trip], dir=(p.level===NF)?-1:1;
    const fl=fieldAt(p.level, p.trip, p.x, p.z);
    // 目的の階段が混雑している時は「諦めて離れる」＝階段口に溜まらない／時間が経っても集中しない
    if((stairRiders[p.trip]||0) > 3 && fl && fl.dist>=0 && fl.dist<=3){
      const aw=Math.atan2(p.z-s.cz, p.x-s.cx);
      p.dir=aw; p.rush=1.3; p.timer=2.5; p.kind="W"; p.trip=-1; p.goal=0; p.roleT=5+Math.random()*7;
      return;
    }
    if(fl && fl.dist>=0 && fl.dist<=1){          // 目的の階段の昇降口に到着→階段に乗る
      const dest=dir>0?s.exit:s.entry, dw=tileToWorld(dest[0],dest[1]);
      p.ride={dx:dw.x,dz:dw.z,goal:p.level+dir,sid:p.trip};
      stairRiders[p.trip]=(stairRiders[p.trip]||0)+1;   // 即時カウント（同フレームで一気に乗らせない）
      pedMoveDir(p, dw.x-p.x, dw.z-p.z, dt, true); return;
    }
    if(fl && fl.step>=0){                         // 経路場に沿って隣のマス中央へ
      const tx=Math.floor(p.x/T), ty=Math.floor(p.z/T), d=DIRS4[fl.step], tw=tileToWorld(tx+d[0],ty+d[1]);
      pedMoveDir(p, tw.x-p.x, tw.z-p.z, dt, false); return;
    }
    wanderStep(p, dt);                            // 経路なし→徘徊
  }
  // フロアごとの人数を目標値へ。余剰フロアの人を「出入り口」経由で不足フロアの「出入り口」へ移す
  function relocatePed(p, g){
    const src=sourcePts[g]; let X,Z;
    if(src && src.length){ const s=src[(Math.random()*src.length)|0]; X=s.x+(Math.random()-0.5)*T*0.5; Z=s.z+(Math.random()-0.5)*T*0.5; }
    else { X=NaN; }
    if(!(X===X) || !canStand(X,Z,PED_R,g)){ if(src&&src.length){ const s=src[(Math.random()*src.length)|0]; X=s.x; Z=s.z; } }
    if(!(X===X) || !canStand(X,Z,PED_R,g)){ const pool=pedPool[g]; const t=pool[(Math.random()*pool.length)|0]; const w=tileToWorld(t.x,t.y); X=w.x; Z=w.z; }
    p.x=X; p.z=Z; p.level=g; p.y=(g-1)*FH; p.ride=null; p.lastStair=-1; p.trip=-1; p.roleT=1+Math.random()*4; setPedRole(p);
  }
  function balancePedestrians(){
    const byF={}; for(let f=1;f<=NF;f++) byF[f]=[];
    for(let i=0;i<pedestrians.length;i++) byF[pedestrians[i].level].push(i);
    const give=[], take=[];
    for(let f=1;f<=NF;f++){ const d=byF[f].length-(pedTargets[f]||0); if(d>0) give.push([f,d]); else if(d<0) take.push([f,-d]); }
    if(!give.length || !take.length) return;
    for(const gv of give) byF[gv[0]].sort((a,b)=> // 昇順＝最後がプレイヤーから最遠（移しても見えにくい）
      (Math.hypot(pedestrians[a].x-player.x,pedestrians[a].z-player.z))-(Math.hypot(pedestrians[b].x-player.x,pedestrians[b].z-player.z)));
    let mv=0; const MAX=80, gi=[0];
    for(const tk of take){ let need=tk[1];
      while(need>0 && mv<MAX){
        while(gi[0]<give.length && give[gi[0]][1]<=0) gi[0]++;
        if(gi[0]>=give.length) return;
        const gv=give[gi[0]], arr=byF[gv[0]], idx=arr.pop();
        if(idx===undefined){ gv[1]=0; continue; }
        relocatePed(pedestrians[idx], tk[0]); need--; gv[1]--; mv++;
      }
    }
  }
  function updatePedestrians(dt){
    balAccum+=dt;
    if(balAccum>=0.5){ balAccum=0; balancePedestrians(); }
    densAccum+=dt; if(densAccum>=0.4){ densAccum=0; computeDensity(); }   // 人口密度を更新（空いている方へ寄る用）
    // 各階段の混雑度を集計（pickStair=総需要で分散 / キャップ=実際に乗っている人数）
    stairLoad=new Array(stairs.length).fill(0);
    stairRiders=new Array(stairs.length).fill(0);
    for(const p of pedestrians){ const sid=p.ride?p.ride.sid:p.trip; if(sid>=0) stairLoad[sid]++; if(p.ride) stairRiders[p.ride.sid]++; }
    for(const p of pedestrians){
      if(!p.ride && !(p.kind==="K"&&p.visit>0)){ p.roleT-=dt; if(p.roleT<=0){ setPedRole(p); p.roleT=6+Math.random()*8; } }
      if(p.kind==="K"){ kioskStep(p, dt); p.y=(p.level-1)*FH; }
      else if(p.kind==="E"){ exitStep(p, dt); p.y=(p.level-1)*FH; }
      else if(p.kind==="M"){
        moverStep(p, dt);
        const si=stairInfo(p.x,p.z,p.level);
        if(si){ p.y=si.y; p.level=si.t>=0.5?si.lvl+1:si.lvl; }
        else { p.y=(p.level-1)*FH;
          if(p.ride && p.level===p.ride.goal){ // 目的フロアに到着→直前の階段を記録＋階段口から素早く離れて長めに徘徊（滞留防止）
            const s=stairs[p.ride.sid], aw=Math.atan2(p.z-s.cz, p.x-s.cx);
            p.dir=aw; p.rush=1.6; p.timer=2.5;                 // 階段から離れる向きに小走り
            p.lastStair=p.ride.sid; p.ride=null; p.trip=-1; p.kind="W"; p.goal=0; p.roleT=9+Math.random()*9; }
        }
      } else { wanderStep(p, dt); p.y=(p.level-1)*FH; }
      const base=p.y+FOOT_LIFT;
      _pedDummy.rotation.set(0,p.ry,0);
      _pedDummy.position.set(p.x,base+0.4,p.z); _pedDummy.updateMatrix(); pedLegsInst.setMatrixAt(p.gi,_pedDummy.matrix);
      _pedDummy.position.y=base+1.05; _pedDummy.updateMatrix(); pedTorsoInsts[p.ci].setMatrixAt(p.ti,_pedDummy.matrix);
      _pedDummy.position.y=base+1.5; _pedDummy.updateMatrix(); pedHeadInst.setMatrixAt(p.gi,_pedDummy.matrix);
    }
    if(pedLegsInst){ pedLegsInst.instanceMatrix.needsUpdate=true; pedHeadInst.instanceMatrix.needsUpdate=true;
      for(const ci in pedTorsoInsts) pedTorsoInsts[ci].instanceMatrix.needsUpdate=true; }
  }

  // ---------- 運搬ジレンマ：酔っ払いNPC＋コンビニ ----------
  function konbiniSignTex(){
    const cv=document.createElement("canvas"); cv.width=256; cv.height=96; const g=cv.getContext("2d");
    g.fillStyle="#0a7d3a"; g.fillRect(0,0,256,96); g.fillStyle="#fff"; g.fillRect(6,6,244,84);
    g.fillStyle="#0a7d3a"; g.textAlign="center"; g.textBaseline="middle"; g.font="bold 46px sans-serif";
    g.fillText("コンビニ",128,52);
    const t=new THREE.CanvasTexture(cv); t.anisotropy=4; return t;
  }
  function randUndergroundTile(f, avoidStart, sx, sz){
    let tiles=allFloorTiles(f).filter(t=>!stairTileSet.has(t.x+","+t.y) && !(obsBlock[f]&&obsBlock[f].has(t.x+","+t.y)));
    if(f===1) tiles=tiles.filter(t=>!(CENTER_COLS.includes(t.x)&&OBJ_ROWS.includes(t.y)));
    if(!tiles.length) tiles=allFloorTiles(f);
    for(let k=0;k<60;k++){ const t=tiles[(Math.random()*tiles.length)|0], w=tileToWorld(t.x,t.y);
      if(!avoidStart || Math.hypot(w.x-sx,w.z-sz)>T*9) return t; }
    return tiles[(Math.random()*tiles.length)|0];
  }
  function buildDrunkAndKonbini(sx,sz,slevel){
    drunk=null; konbini=null; carrying=false; playerTrail=[]; drunkMsg=""; drunkMsgT=0;
    // 酔っ払い（地下のランダムな階・位置）
    const df=Math.random()<0.5?1:2, dtk=randUndergroundTile(df, df===slevel, sx, sz), dw=tileToWorld(dtk.x,dtk.y);
    const g=makeHuman(0x8e44ad,0x3a2a4a,0xe6a07a); worldRoot.add(g);   // 紫の服・赤ら顔
    const beacon=new THREE.Mesh(new THREE.CylinderGeometry(0.16,0.16,8,8),
      new THREE.MeshBasicMaterial({color:0xffd23a, transparent:true, opacity:0.5})); beacon.material.toneMapped=false;
    beacon.position.set(dw.x,(df-1)*FH+4,dw.z); worldRoot.add(beacon);   // 黄色い光の柱（壁越しに見える目印）
    // 頭上の尿意メーター（予兆/猶予の可視化）
    const mg=new THREE.Group();
    const mbg=new THREE.Mesh(new THREE.PlaneGeometry(1.5,0.26), new THREE.MeshBasicMaterial({color:0x10141a})); mbg.material.toneMapped=false;
    const mfill=new THREE.Mesh(new THREE.PlaneGeometry(1.4,0.2), new THREE.MeshBasicMaterial({color:0x4caf50})); mfill.material.toneMapped=false; mfill.position.z=0.01;
    mg.add(mbg,mfill); mg.visible=false; worldRoot.add(mg);
    drunk={ x:dw.x, z:dw.z, level:df, y:(df-1)*FH, group:g, beacon, meter:{group:mg,fill:mfill}, sway:Math.random()*6, stopT:0, konbiniDone:false, _px:dw.x, _pz:dw.z };
    // コンビニ（地下のランダムな階・位置）
    const kf=Math.random()<0.5?1:2, ktk=randUndergroundTile(kf,false), kw=tileToWorld(ktk.x,ktk.y), kg=new THREE.Group();
    const box=new THREE.Mesh(new THREE.BoxGeometry(T*0.85,FH*0.66,T*0.85), new THREE.MeshLambertMaterial({color:0x16a34a})); box.position.y=FH*0.33; kg.add(box);
    const stex=konbiniSignTex();
    [0.43,-0.43].forEach((zf,i)=>{ const m=new THREE.Mesh(new THREE.PlaneGeometry(T*0.8,0.9), new THREE.MeshBasicMaterial({map:stex,side:THREE.DoubleSide}));
      m.material.toneMapped=false; m.position.set(0, FH*0.66+0.3, zf*T); if(i) m.rotation.y=Math.PI; kg.add(m); });
    kg.position.set(kw.x,(kf-1)*FH,kw.z); worldRoot.add(kg);
    konbini={ x:kw.x, z:kw.z, level:kf };
    buildToilets(); resetToiletUrge();   // トイレ配置＆尿意タイマー初期化
  }
  function setDrunkMsg(m,t){ drunkMsg=m; drunkMsgT=t; }
  // ---------- トイレ（尿意：予兆→猶予→失敗でGAME OVER） ----------
  function toiletSignTex(){
    const cv=document.createElement("canvas"); cv.width=128; cv.height=128; const g=cv.getContext("2d");
    g.fillStyle="#1d4ed8"; g.fillRect(0,0,128,128); g.fillStyle="#fff"; g.textAlign="center"; g.textBaseline="middle";
    g.font="bold 38px sans-serif"; g.fillText("トイレ",64,46); g.font="bold 34px sans-serif"; g.fillText("WC",64,92);
    const t=new THREE.CanvasTexture(cv); t.anisotropy=4; return t;
  }
  function buildToilets(){
    toilets=[]; const stex=toiletSignTex();
    for(let f=1;f<=NF;f++){
      const tk=randUndergroundTile(f,false), w=tileToWorld(tk.x,tk.y), kg=new THREE.Group();
      const box=new THREE.Mesh(new THREE.BoxGeometry(T*0.7,FH*0.6,T*0.7), new THREE.MeshLambertMaterial({color:0x2563c9})); box.position.y=FH*0.3; kg.add(box);
      [0.36,-0.36].forEach((zf,i)=>{ const m=new THREE.Mesh(new THREE.PlaneGeometry(T*0.6,0.8), new THREE.MeshBasicMaterial({map:stex,side:THREE.DoubleSide}));
        m.material.toneMapped=false; m.position.set(0,FH*0.6+0.25,zf*T); if(i) m.rotation.y=Math.PI; kg.add(m); });
      kg.position.set(w.x,(f-1)*FH,w.z); worldRoot.add(kg);
      const beacon=new THREE.Mesh(new THREE.CylinderGeometry(0.15,0.15,7,8), new THREE.MeshBasicMaterial({color:0x3b9bff,transparent:true,opacity:0.55}));
      beacon.material.toneMapped=false; beacon.position.set(w.x,(f-1)*FH+3.5,w.z); beacon.visible=false; worldRoot.add(beacon);
      toilets.push({x:w.x,z:w.z,level:f,beacon});
    }
  }
  function setToiletBeacons(on){ for(const t of toilets) if(t.beacon) t.beacon.visible=on; }
  function resetToiletUrge(){ toiletState="none"; toiletT=C.TOILET_INTERVAL_MIN+Math.random()*(C.TOILET_INTERVAL_MAX-C.TOILET_INTERVAL_MIN); setToiletBeacons(false); }
  function updateToiletUrge(dt){
    if(!drunk) return;
    if(!carrying){ if(toiletState!=="none"){ toiletState="none"; setToiletBeacons(false); } updateToiletMeter(); return; }
    if(toiletState==="none"){
      toiletT-=dt;
      if(toiletT<=0){ toiletState="warn"; toiletT=C.TOILET_WARN; setToiletBeacons(true); setDrunkMsg("酔っ払いがソワソワし始めた…トイレが近いぞ！",3); sfxAlert(); }
    } else if(toiletState==="warn"){
      toiletT-=dt; if(toiletT<=0){ toiletState="urge"; toiletT=C.TOILET_LIMIT; setDrunkMsg("もう限界！青い印のトイレへ急げ！",2.5); }
    } else if(toiletState==="urge"){
      toiletT-=dt;
      if(toilets.some(t=> t.level===drunk.level && Math.hypot(drunk.x-t.x,drunk.z-t.z)<C.TOILET_DIST)){
        resetToiletUrge(); setDrunkMsg("ふぅ…間に合った",2); sfxFloor();
      } else if(toiletT<=0){ setToiletBeacons(false); setDrunkMsg("間に合わなかった…",2); endGame(false); return; }
    }
    updateToiletMeter();
  }
  function updateToiletMeter(){
    if(!drunk||!drunk.meter) return;
    const show = carrying && toiletState!=="none";
    drunk.meter.group.visible=show; if(!show) return;
    const prog = toiletState==="urge" ? 1-Math.max(0,toiletT)/C.TOILET_LIMIT : 0.04;  // 予兆中はほぼ空（点滅で知らせる）
    const fill=drunk.meter.fill;
    fill.scale.x=Math.max(0.001,prog); fill.position.x=-0.7+0.7*prog;
    fill.material.color.setHex(prog>0.66?0xe23030:(prog>0.33?0xe8a23a:0x4caf50));
    const g=drunk.meter.group;
    g.position.set(drunk.x, drunk.y+FOOT_LIFT+2.35, drunk.z); g.quaternion.copy(camera.quaternion);
    g.scale.setScalar(toiletState==="warn" ? (0.85+0.3*(0.5+0.5*Math.sin(flick*9))) : 1);
  }
  // ---------- 動的な人混み（電車到着でホームに通行人が大量に集まる） ----------
  function surgeToPlatform(n){
    const tiles=pedPool[1]; if(!tiles||!tiles.length) return;
    let pl=-1;
    if(player.level===1){ const px=Math.floor(player.x/T); for(let i=0;i<LANES.length;i++){ if(px>=LANES[i][0]-1&&px<=LANES[i][1]+1){ pl=i; break; } } }
    const laneTiles = pl>=0 ? tiles.filter(t=> t.x>=LANES[pl][0] && t.x<=LANES[pl][1]) : null;
    let moved=0;
    for(const p of pedestrians){
      if(moved>=n) break;
      if(p.level===1) continue;                 // 他フロアから引っ張ってくる
      const useLane = laneTiles && laneTiles.length && Math.random()<0.7;   // プレイヤーのホームに7割
      const pool = useLane?laneTiles:tiles, t=pool[(Math.random()*pool.length)|0], w=tileToWorld(t.x,t.y);
      p.x=w.x+(Math.random()-0.5)*T*0.5; p.z=w.z+(Math.random()-0.5)*T*0.5; p.level=1; p.y=0;
      p.ride=null; p.trip=-1; p.kind="W"; p.visit=0; p.ktarget=-1; p.roleT=C.CROWD_DURATION*(0.7+Math.random()*0.6);
      moved++;
    }
  }
  function updateCrowd(dt){
    if(!crowdActive){
      crowdTimer-=dt;
      if(crowdTimer<=0){
        crowdActive=true; crowdEndT=C.CROWD_DURATION;
        pedTargets[1]=baseB2Target+C.CROWD_SURGE;   // 混雑の間はホームの目標人数を増やして維持
        surgeToPlatform(C.CROWD_SURGE);
        setDrunkMsg("🚃 電車が到着！ホームが人混みで動きにくい",3.2); trainPass();
      }
    } else {
      crowdEndT-=dt;
      if(crowdEndT<=0){ crowdActive=false; pedTargets[1]=baseB2Target; crowdTimer=C.TRAIN_INTERVAL*(0.8+Math.random()*0.5); }
    }
  }
  function updateDrunk(dt){
    if(!drunk) return;
    drunk.sway+=dt*4; if(drunkMsgT>0) drunkMsgT-=dt;
    if(!carrying){
      if(drunk.level===player.level && Math.hypot(player.x-drunk.x,player.z-drunk.z)<C.DRUNK_TOUCH){
        carrying=true; playerTrail=[]; if(drunk.beacon) drunk.beacon.visible=false; resetToiletUrge();
        setDrunkMsg("酔っ払いを連れた！地上の正しい出口へ送り届けろ",3.5); sfxFloor();
      }
    } else {
      if(drunk.stopT>0){ drunk.stopT-=dt; }                                   // コンビニで立ち止まり中
      else if(konbini && drunk.level===konbini.level && !drunk.konbiniDone && Math.hypot(drunk.x-konbini.x,drunk.z-konbini.z)<C.KONBINI_DIST){
        drunk.stopT=C.KONBINI_STOP; drunk.konbiniDone=true; setDrunkMsg("酔っ払いがコンビニで酒を欲しがり動かない…そばで待て！",3.5); sfxAlert();
      } else {                                                                // プレイヤーの通った道を辿って付いてくる
        const last=playerTrail[playerTrail.length-1];
        if(!last || last.level!==player.level || Math.hypot(last.x-player.x,last.z-player.z)>1.0){
          playerTrail.push({x:player.x,z:player.z,level:player.level}); if(playerTrail.length>240) playerTrail.shift(); }
        if(playerTrail.length){ const tgt=playerTrail[0];
          if(drunk.level===tgt.level && Math.hypot(drunk.x-tgt.x,drunk.z-tgt.z)<1.3) playerTrail.shift();
          else moveToward(drunk, tgt.x, tgt.z, C.DRUNK_SPEED, dt, DRUNK_R); }
      }
      if(Math.hypot(player.x-drunk.x,player.z-drunk.z) > C.DRUNK_SEPARATE){    // はぐれ
        carrying=false; drunk.konbiniDone=false; drunk.stopT=0; if(drunk.beacon) drunk.beacon.visible=true;
        setDrunkMsg("酔っ払いとはぐれた！もう一度探せ",3.5); sfxAlert();
      }
    }
    const si=stairInfo(drunk.x,drunk.z,drunk.level);
    if(si){ drunk.y=si.y; drunk.level=si.t>=0.5?si.lvl+1:si.lvl; } else drunk.y=(drunk.level-1)*FH;
    const mvx=drunk.x-drunk._px, mvz=drunk.z-drunk._pz; drunk._px=drunk.x; drunk._pz=drunk.z;
    const fy=Math.hypot(mvx,mvz)>0.0001?Math.atan2(mvx,mvz):drunk.group.rotation.y;
    drunk.group.rotation.set(0, fy, Math.sin(drunk.sway)*0.12);               // ふらつき
    drunk.group.position.set(drunk.x, drunk.y+FOOT_LIFT, drunk.z);
    if(drunk.beacon && drunk.beacon.visible) drunk.beacon.position.set(drunk.x,(drunk.level-1)*FH+4,drunk.z);
    updateToiletUrge(dt);   // 尿意（予兆→猶予→失敗）
  }
  function checkResult(){
    for(const chaser of chasers){
      if(chaser.level===player.level && Math.hypot(player.x-chaser.x,player.z-chaser.z)<C.CATCH_DIST){ endGame(false); return; }
    }
    if(player.level===NF){
      for(const e of exits){ if(Math.hypot(player.x-e.x,player.z-e.z)<(e.wide?T*2.6:(e.mid?T*1.3:T*0.6)) && e.no===correctExitNo){
        if(carrying){ endGame(true); return; }
        else { if(drunkMsgT<=0) setDrunkMsg("酔っ払いを連れて来い！",1.5); return; }
      } }
    }
  }
  let flick=0;
  function updateDeco(dt){ flick+=dt; }  // flick は警告点滅用のタイマー（ライトは一定）

  // ---------- ミニマップ（現在フロアを表示。階を上がると切り替わる） ----------
  function drawMinimap(){
    if(!C.SHOW_MAP || mapCollapsed || userMode) return; const cs=MAP_CELL;
    const F=player.level, g=grids[F];
    mapCtx.clearRect(0,0,mapCv.width,mapCv.height);
    for(let y=0;y<C.ROWS;y++)for(let x=0;x<C.COLS;x++){
      const k=x+","+y, sl=stairTileLevel[k];
      // このフロアに関係する階段だけ色付け（上り=明るい橙, 下り=青）
      const up = sl===F, down = sl===F-1;
      mapCtx.fillStyle = g[y][x]===1 ? "#5b626b" : (up?"#e8a23a":(down?"#5a9bd6":"#eef1f4"));
      mapCtx.fillRect(x*cs,y*cs,cs,cs);
    }
    // 出口は最上階にいるときだけ表示（番号は大きめ）
    if(F===NF){
      for(const e of exits){ const px=(e.x/T)*cs, py=(e.z/T)*cs;
        mapCtx.fillStyle=(e.no===correctExitNo)?"#f5b50a":"#2ecf6b";
        mapCtx.fillRect(px-cs*0.6,py-cs*0.6,cs*1.2,cs*1.2);
        mapCtx.fillStyle="#0c2a16"; mapCtx.font="bold "+Math.round(cs*1.7)+"px sans-serif"; mapCtx.textAlign="center"; mapCtx.textBaseline="middle";
        mapCtx.fillText(String(e.no),px,py);
      }
    }
    // 現在フロアの歩行者・敵だけ表示
    mapCtx.fillStyle="#9aa1aa";
    for(const p of pedestrians){ if(p.level!==F) continue; mapCtx.beginPath(); mapCtx.arc((p.x/T)*cs,(p.z/T)*cs,cs*0.16,0,6.28); mapCtx.fill(); }
    for(const chaser of chasers){ if(chaser.level!==F) continue; mapCtx.fillStyle=(chaser.mem>0||chaser.hunt)?"#ff2d2d":"#b03b3b"; mapCtx.beginPath();
      mapCtx.arc((chaser.x/T)*cs,(chaser.z/T)*cs,cs*0.4,0,6.28); mapCtx.fill(); }
    const px=(player.x/T)*cs, py=(player.z/T)*cs;
    mapCtx.strokeStyle="#1f6dd0"; mapCtx.lineWidth=2; mapCtx.beginPath();
    mapCtx.moveTo(px,py); mapCtx.lineTo(px+fwd.x*cs*1.2,py+fwd.z*cs*1.2); mapCtx.stroke();
    mapCtx.fillStyle="#1f6dd0"; mapCtx.beginPath(); mapCtx.arc(px,py,cs*0.4,0,6.28); mapCtx.fill();

    // 階段の向き矢印（小さく。頭・白フチ・線幅すべて控えめにして階段が隠れないように）
    const tri=(tx,ty,a,hl,hw)=>{ const bx=tx-Math.cos(a)*hl, by=ty-Math.sin(a)*hl, nx=-Math.sin(a), ny=Math.cos(a);
      mapCtx.beginPath(); mapCtx.moveTo(tx,ty); mapCtx.lineTo(bx+nx*hw,by+ny*hw); mapCtx.lineTo(bx-nx*hw,by-ny*hw); mapCtx.closePath(); };
    const drawArrow=(x1,y1,x2,y2,color)=>{
      const a=Math.atan2(y2-y1,x2-x1), hl=cs*0.42, hw=cs*0.26;
      const bx=x2-Math.cos(a)*hl, by=y2-Math.sin(a)*hl;
      mapCtx.lineCap="round";
      mapCtx.strokeStyle="#fff"; mapCtx.lineWidth=2.4;
      mapCtx.beginPath(); mapCtx.moveTo(x1,y1); mapCtx.lineTo(bx,by); mapCtx.stroke();
      mapCtx.fillStyle="#fff"; tri(x2,y2,a,hl+1,hw+1); mapCtx.fill();
      mapCtx.strokeStyle=color; mapCtx.lineWidth=1.4;
      mapCtx.beginPath(); mapCtx.moveTo(x1,y1); mapCtx.lineTo(bx,by); mapCtx.stroke();
      mapCtx.fillStyle=color; tri(x2,y2,a,hl,hw); mapCtx.fill();
    };
    for(const s of stairs){
      const up=s.lvl===F, down=s.lvl===F-1; if(!up&&!down) continue;
      const dir=up?1:-1, half=0.45;   // 階段中央に小さく（オレンジが見えるように）
      const adx=s.adir[0]*dir, ady=s.adir[1]*dir;
      const x1=(s.cxTile-adx*half)*cs, y1=(s.cyTile-ady*half)*cs;
      const x2=(s.cxTile+adx*half)*cs, y2=(s.cyTile+ady*half)*cs;
      drawArrow(x1,y1,x2,y2, up?"#e0241a":"#2566d6");
    }
  }

  // ---------- ループ ----------
  const clock=new THREE.Clock();
  function loop(){
    const dt=Math.min(clock.getDelta(),0.05);
    if(running){
      updatePlayer(dt); updateChasers(dt); updateDrunk(dt); updateCrowd(dt); updatePedestrians(dt); updateDeco(dt); updateBoarders(flick); checkResult();
      drawMinimap();
      gameTime+=dt; timerEl.textContent="TIME "+fmtTime(gameTime);
      const alert = chasers.some(c=>c.showAlert);
      if(alert && !alertPrev) sfxAlert();   // 新たに見つかった瞬間の音
      alertPrev = alert;
      // 目標表示（運搬の状態を反映。一時メッセージ優先）
      if(drunkMsgT>0) goalEl.textContent=drunkMsg;
      else goalEl.textContent = carrying ? ("▶ "+correctExitNo+"番出口（地上）へ送り届けろ") : "▶ 地下で酔っ払いを探せ（黄色い光の柱が目印）";
      floorEl.textContent = "現在地: "+floorName(player.level);
      mapLabel.textContent = "MAP（"+floorName(player.level)+"）";
      subEl.textContent = "敵: "+(alert?"追跡中！":"徘徊")+(crouching?"　/　🫥しゃがみ中":"")+"　/　WASD移動・C:しゃがむ・マウス視点";
    }
    // 敵に見つかって追われている間は画面周囲を赤くチカチカ（サイレント追跡は除く）
    const chased = running && chasers.some(c=>c.showAlert);
    alertEl.style.opacity = chased ? (0.35 + 0.55*Math.abs(Math.sin(flick*11))) : 0;
    renderer.render(scene,camera);
    requestAnimationFrame(loop);
  }

  setupTouch(); loop();
})();
</script>
