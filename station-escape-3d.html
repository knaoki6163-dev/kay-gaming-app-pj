<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>駅の出口探索ゲーム 3D（3階建て）</title>
<style>
  html, body { margin:0; padding:0; height:100%; background:#000; overflow:hidden;
    font-family:"Segoe UI","Hiragino Kaku Gothic ProN",Meiryo,sans-serif; color:#eee;
    user-select:none; -webkit-user-select:none; }
  #app { position:fixed; inset:0; }
  canvas { display:block; }

  #hud { position:fixed; top:0; left:0; right:0; padding:10px 14px; pointer-events:none;
    text-align:center; text-shadow:0 1px 3px #000; }
  #goal { font-size:30px; font-weight:900; color:#ffe33a; letter-spacing:1px;
    text-shadow:0 0 6px rgba(0,0,0,.9), 0 2px 4px #000; }
  #sub  { font-size:12px; color:#cdd3da; margin-top:2px; }
  #dash { display:inline-block; position:relative; margin-top:5px; width:170px; height:17px;
    background:rgba(20,30,45,.72); border-radius:5px; overflow:hidden; vertical-align:middle;
    box-shadow:0 2px 6px rgba(0,0,0,.4); }
  #dashFill { position:absolute; left:0; top:0; bottom:0; width:100%; background:#33d17a; }
  #dashTxt { position:absolute; left:0; right:0; top:0; bottom:0; text-align:center;
    font-size:11px; font-weight:bold; color:#fff; line-height:17px; text-shadow:0 1px 2px rgba(0,0,0,.85); }

  #floor { position:fixed; top:8px; left:10px; z-index:8; font-size:15px; font-weight:bold;
    color:#fff; background:rgba(20,30,45,.85); padding:4px 10px; border-radius:6px;
    box-shadow:0 2px 6px rgba(0,0,0,.4); }
  #carry { position:fixed; top:40px; left:10px; z-index:8; font-size:15px; font-weight:bold;
    color:#fff; background:rgba(22,140,60,.95); padding:4px 12px; border-radius:6px;
    box-shadow:0 2px 6px rgba(0,0,0,.4); }
  #lost { position:fixed; top:40px; left:10px; z-index:9; font-size:15px; font-weight:bold;
    color:#fff; background:rgba(200,30,30,.95); padding:4px 12px; border-radius:6px;
    box-shadow:0 2px 8px rgba(0,0,0,.5); }
  #timer { position:fixed; top:8px; right:12px; z-index:8; font-size:17px; font-weight:bold;
    color:#fff; background:rgba(20,30,45,.85); padding:4px 12px; border-radius:6px;
    box-shadow:0 2px 6px rgba(0,0,0,.4); }
  #verHud { position:fixed; top:40px; right:12px; z-index:8; font-size:12px; font-weight:bold;
    color:#ffe27a; background:rgba(20,30,45,.85); padding:2px 8px; border-radius:5px; }
  #muteBtn { position:fixed; top:66px; right:12px; z-index:9; font-size:16px; cursor:pointer;
    background:rgba(20,30,45,.85); padding:2px 8px; border-radius:5px; user-select:none; }
  #langBtn { position:fixed; top:66px; right:52px; z-index:11; font-size:12px; font-weight:bold; cursor:pointer;
    color:#cfe3ff; background:rgba(20,30,45,.9); padding:3px 9px; border-radius:5px; user-select:none;
    border:1px solid rgba(120,170,230,.5); }
  #mission { position:fixed; top:98px; right:12px; z-index:8; width:212px;
    background:rgba(18,26,40,.84); border-radius:8px; padding:8px 11px;
    box-shadow:0 2px 8px rgba(0,0,0,.45); pointer-events:none; }
  #missionTitle { font-size:12px; font-weight:bold; color:#ffe27a; letter-spacing:1.5px; margin-bottom:6px; }
  #mission ul { list-style:none; margin:0; padding:0; }
  #mission li { display:flex; align-items:center; gap:8px; font-size:13px; font-weight:bold;
    color:#e6ebf1; margin:5px 0; line-height:1.3; }
  #mission li.done { color:#9fe6a8; }
  #mission li.done .mtxt { text-decoration:line-through; opacity:.85; }
  #mission .chk { font-size:14px; width:18px; text-align:center; flex:0 0 auto; }
  #mapToggle { position:fixed; top:38px; left:10px; z-index:8; font-size:13px; font-weight:bold;
    color:#fff; background:rgba(20,30,45,.85); padding:3px 9px; border-radius:6px; cursor:pointer;
    box-shadow:0 2px 6px rgba(0,0,0,.4); user-select:none; }
  #map { position:fixed; top:62px; left:10px; z-index:6; border:2px solid rgba(0,0,0,.4);
    background:#fff; border-radius:4px; box-shadow:0 2px 8px rgba(0,0,0,.4); }
  #mapLabel { position:fixed; left:12px; z-index:7; font-size:11px; color:#222;
    background:rgba(255,255,255,.85); padding:1px 5px; border-radius:3px; }

  #cross { position:fixed; left:50%; top:50%; width:6px; height:6px; margin:-3px 0 0 -3px;
    background:#fff; border-radius:50%; opacity:.6; pointer-events:none; }

  /* 敵に追われているときの赤い警告（画面周囲）＋四隅で方向を示す */
  #alert { position:fixed; inset:0; z-index:9; pointer-events:none; opacity:0;
    box-shadow: inset 0 0 150px 55px rgba(225,0,0,0.85); }
  #cwTR,#cwTL,#cwBR,#cwBL{ position:fixed; width:62%; height:62%; z-index:9; pointer-events:none; opacity:0; }
  #cwTR{ top:0; right:0;    background:radial-gradient(ellipse at top right,    rgba(235,0,0,0.95), rgba(235,0,0,0) 72%); }
  #cwTL{ top:0; left:0;     background:radial-gradient(ellipse at top left,     rgba(235,0,0,0.95), rgba(235,0,0,0) 72%); }
  #cwBR{ bottom:0; right:0; background:radial-gradient(ellipse at bottom right, rgba(235,0,0,0.95), rgba(235,0,0,0) 72%); }
  #cwBL{ bottom:0; left:0;  background:radial-gradient(ellipse at bottom left,  rgba(235,0,0,0.95), rgba(235,0,0,0) 72%); }
  /* ダッシュ中の疾走感：画面左右の端に薄い白の横線 */
  #speedL,#speedR{ position:fixed; top:0; bottom:0; width:24%; z-index:8; pointer-events:none; opacity:0;
    background:repeating-linear-gradient(0deg, rgba(255,255,255,0) 0 7px, rgba(255,255,255,0.5) 7px 9px); }
  #speedL{ left:0;  -webkit-mask-image:linear-gradient(to right, #000, transparent); mask-image:linear-gradient(to right, #000, transparent); }
  #speedR{ right:0; -webkit-mask-image:linear-gradient(to left,  #000, transparent); mask-image:linear-gradient(to left,  #000, transparent); }
  /* トイレが漏れる直前の黄色い警告（画面周囲）＋カウント */
  #toiletwarn { position:fixed; inset:0; z-index:9; pointer-events:none; opacity:0;
    box-shadow: inset 0 0 130px 50px rgba(240,205,30,0.85); }
  #toiletcount { position:fixed; left:50%; top:34%; transform:translate(-50%,-50%); z-index:10;
    font-size:96px; font-weight:900; color:#ffe33a; text-shadow:0 0 18px rgba(0,0,0,.95),0 2px 6px #000;
    display:none; pointer-events:none; }

  .overlay { position:fixed; inset:0; display:flex; flex-direction:column;
    align-items:center; justify-content:center; text-align:center;
    background:rgba(0,0,0,.7); z-index:10; }
  .hidden { display:none !important; }
  .overlay h1 { font-size:40px; margin:0 0 8px; }
  .overlay p { font-size:14px; color:#ccc; margin:4px 0; max-width:540px; line-height:1.6; }
  .overlay button { margin-top:18px; font-size:16px; padding:10px 26px; cursor:pointer;
    border:none; border-radius:8px; background:#4a90e2; color:#fff; }
  .clear { color:#5fd36a; } .over { color:#e25555; }
  #version { margin-top:16px; font-size:18px; font-weight:bold; color:#9aa3ad; letter-spacing:.5px; }
  #resultInfo { margin-top:10px; font-size:20px; color:#e6ebf1; line-height:1.7; }
  #resultInfo b { color:#ffe27a; font-size:24px; }

  #touch { position:fixed; inset:0; z-index:5; display:none; }
  #pad { position:absolute; left:18px; bottom:18px; display:grid;
    grid-template-columns:repeat(3,56px); grid-template-rows:repeat(3,56px); gap:6px; }
  #pad div { background:rgba(0,0,0,.25); border:1px solid rgba(255,255,255,.4);
    border-radius:10px; display:flex; align-items:center; justify-content:center;
    font-size:22px; color:#fff; }
  #pad .up{grid-area:1/2} #pad .left{grid-area:2/1} #pad .down{grid-area:2/2} #pad .right{grid-area:2/3}

  /* スマホ：マップを左端に寄せ、タイトル文と重ならないよう本文を右寄せ */
  body.is-touch #floor { left:2px; font-size:12px; padding:3px 7px; }
  body.is-touch #map { left:2px; }
  body.is-touch #mapLabel { left:4px; }
  body.is-touch #hud { top:88px; left:0; right:0; padding:3px 14px; text-align:center; }  /* 右上のボタン群(TIME/Ver/🔊)より下へ降ろして被りを解消 */
  body.is-touch #goal { font-size:14px; line-height:1.3; }
  body.is-touch #sub  { font-size:10px; }
  body.is-touch #mission { top:120px; right:4px; width:150px; padding:5px 7px; }
  body.is-touch #mission li { font-size:10px; margin:3px 0; gap:5px; }
  body.is-touch #missionTitle { font-size:10px; margin-bottom:3px; }
  body.is-touch #langBtn { right:48px; }
</style>
</head>
<body>

<!-- ====== 難易度・設定（ここを変えれば簡単に調整できます） ====== -->
<script>
const CONFIG = {
  SEED: 1,              // 迷路の固定シード（縦長ホーム5面+各階段／全フロア連結・到達性を検証済み）
  NUM_FLOORS: 3,        // フロア数（3階建て）
  COLS: 27, ROWS: 49,   // 迷路の広さ（ホーム長＝電車長の3倍に合わせて縦長）
  TILE: 5,              // 1マスのワールドサイズ
  WALL_H: 4.5,          // 1フロアの高さ（各階の段差）

  CHASER_FLOORS: [1, 2,2,2,2,2, 3,3,3,3,3], // 敵の配置階（level）。1=地下1階(1人), 2=地上1階(5人), 3=地上2階(5人)
  MOVE_SPEED: 6.075,    // 通常速度（手ぶら歩き）※さらに0.9倍に減速
  WALK_SPEED: 4.86,     // 酔っ払いを連れて歩く速度（さらに0.9倍に減速）
  DASH_SPEED: 8.0,      // ダッシュ（W連打）の速度
  DASH_DUR: 10,         // ダッシュ・スタミナの満タン量(秒)＝合計でこの秒数だけ走れる
  DASH_MIN_START: 1.0,  // ダッシュを「新たに」始めるのに必要な残量(秒)。0付近での点滅防止
  DASH_FULL_AT: 20,     // 空から満タンまでの回復秒数（途中でやめた場合は残量からそのぶん早く回復）
  DRUNK_SPEED: 6.5,     // 酔っ払いがついてくる速度（連れて歩いても離れない様に歩行より少し速い）
  DRUNK_TOUCH: 1.9,     // この距離まで近づくと「連れる」
  DRUNK_SEPARATE: 8.5,  // 連れている時、これ以上離れると「はぐれ」
  KONBINI_DIST: 6.0,    // コンビニにこの距離まで近づくと酔っ払いが立ち止まる
  KONBINI_STOP: 4.0,    // 立ち止まる秒数（酒を求める）
  TOILET_INTERVAL_MIN: 45, // 連れている間、次の尿意までの最短秒数（頻度を少し下げた）
  TOILET_INTERVAL_MAX: 85, // 〃 最長秒数
  TOILET_WARN: 7.0,     // 予兆（猶予が始まる前の警告）秒数
  TOILET_LIMIT: 28.0,   // 予兆後、トイレに着くまでの猶予秒数（超過でGAME OVER）
  TOILET_CRITICAL: 10.0,// 漏れる(GAME OVER)この秒数前から「段階2」の強い警告（赤点滅）
  TOILET_DIST: 5.0,     // トイレにこの距離まで近づくと用を足せる（解消）
  TOILET_STOP_DUR: 10.0,// トイレでの足止め秒数（この間カウントダウン・解消）
  TRAIN_INTERVAL: 28,   // 電車到着（人混み発生）の間隔(秒)
  CROWD_DURATION: 12,   // 到着後、ホームが混雑している秒数
  CROWD_SURGE: 1100,    // 到着時にホームへ集まる通行人の数（電車から大量に＝従来の5倍）
  CROWD_TO_B1_FRAC: 0.5,// 人混みのうち地下1階へ移る割合（半分）
  CROWD_B1_DWELL: 14,   // 移った人混みが地下1階に滞留する秒数
  CROWD_GROUND_SPREAD: 18, // その後、地上へ分散的に出ていくのにかける秒数
  THROUGH_PED_COUNT: 60,// 地下1階の前後の別ビルを通り抜ける人流の数（半分が前→後ろ、半分が後ろ→前）
  CHASER_SPEED: 4.0,    // 敵が追跡してくる速度（プレイヤーの歩行3.6より少し速い／走り6.0より遅い）
  CHASER_WANDER: 2.0,   // 敵が徘徊しているときの速度
  CHASER_SIGHT: 28,     // 敵の視認距離（これ以内＋視線が通ると追跡開始）
  CHASER_FOV: 150,      // 敵の視野角(度)。顔の向いている方向±半分の範囲だけ探知（全方位ではない）
  STAIR_PRERENDER: 16,  // プレイヤーが階段口にこの距離まで近づくと、接続先フロアの階段付近も先に3D表示
  STAIR_PRERENDER_AREA: 13, // その階段付近として別フロアを表示する半径
  ALERT_SIGHT_MULT: 1.5,// 一度見つけた敵の探知範囲の倍率（探知能力UP）
  NEAR_EXIT_SIGHT_MULT: 1.7, // 出口付近では地上の敵の視認距離を上げる（運搬の最終局面を難しく）
  NEAR_EXIT_DIST: 22,   // 出口からこの距離内で発動
  CROUCH_SPEED: 2.34,   // しゃがみ移動速度（従来の0.9倍）
  CROUCH_EYE: 0.85,     // しゃがみ時の視点の高さ
  CROUCH_SIGHT_MULT: 0.35, // しゃがむと敵の視認距離をこの倍率に（見つかりにくい）
  CROUCH_HIDE_PED: 2.8, // しゃがみ中、この距離内に通行人がいると完全に紛れて見つからない
  CHASER_MEMORY: 4,     // 見失ってから追跡を続ける秒数
  B2_CHASER_MEMORY: 12, // 地下2階の敵が見失ってから追跡を続ける秒数（長め・速度は同じ）
  CATCH_DIST: 1.4,      // この距離まで近づかれると捕まる
  CATCH_FOV: 62,        // 捕まえるのはプレイヤーの正面±この角度(度)に敵が居る時だけ（画面に映る範囲）。背後からは捕まえず正面へ回り込む
  CATCH_GRAB_TIME: 3.0, // 密着(CATCH_DIST内)がこの秒数続いたら、正面でなくても掴む（視点クルクル回避の悪用防止）
  CHASER_FLOOR_TIME: 22,// 敵が1フロアを巡回し続ける時間(秒)。これを過ぎると別フロアへ入れ替わる
  START_GRACE: 10,      // スタートから この秒数は敵に探知されない（猶予）

  PEDESTRIAN_COUNT: 225, // 歩行者の基準人数（各階に均等配分。地下2階/地下1階=各75人）

  // ===== 通行人の描画LODのしきい値（見た目と負荷を見ながら調整）=====
  PED_LOD_NEAR: 26,     // 同フロアでこの距離(ワールド単位)以内＝3Dモデル、これより遠い＝2Dビルボード
  PED_LOD_FAR: 80,      // これより遠い／視野外／別フロアは描画しない（カリング）。移動計算も間引く境界
  PED_DORMANT_STRIDE: 6,// 描画対象外(遠い/別フロア)の通行人の移動計算を何フレームに1回へ間引くか
  GROUND_PED_MULT: 30,  // 地上フロアの歩行者は基準の何倍にするか（地上=2250人）
  GROUND_CEIL_EXTRA: 3, // 地上フロアだけ天井をこの分だけ高くする
  B1_PED_MULT: 30,      // 地上1階(level2)の歩行者倍率＝地上2階と同じ（=2250人）
  B2_PED_MULT: 10,      // 地下1階(level1=プラットホーム)の歩行者倍率（=750人）
  PED_SPEED: 1.6,       // 歩行者の歩く速さ
  PED_RUSH_SPEED: 5.4,  // 一時的に速くなる通行人の速度（プレイヤー級）
  PED_RUSH_CHANCE: 0.12,// 方向転換時に急ぎ足になる確率
  PED_AVOID_R: 1.8,     // この距離まで近づくとプレイヤーを避け始める
  PED_DODGE_SPEED: 6.5, // ぶつかった瞬間に素早く退く速さ

  STAIR_COUNT: 6,       // 地下1階→地上の階段の数（多めにして渋滞を分散。一方通行で上り3/下り3）
  STAIR_LEN: 3,         // 階段の長さ（マス数）
  START_CLEAR: 8,       // スタート地点からこのマス数以内には階段を置かない

  MOUSE_SENS: 0.0022,   // マウス感度
  INVERT_LOOK_X: true,  // 視点の左右反転
  INVERT_LOOK_Y: true,  // 視点の上下反転
  EYE_HEIGHT: 1.6,      // 視点の高さ
  OUTSIDE_RING: 18,     // 改札の外＝建物外周をぐるりと歩ける広場リングの幅（各地上階の出口が外でつながる）

  LOOP_PROB: 0.16,      // 回り道を作る確率（大きいほど開放的）
  PLAZA_COUNTS: {1:0, 2:16, 3:14}, // 各フロアの広場の数（地下2階はプラットホームなので未使用）

  EXIT_COUNT: 17,       // 出口の数（すべて最上階。1つが正解）
  CORRECT_EXIT: null,   // 正解番号。null ならランダム

  SHOW_MAP: true,       // 左上のテスト用マップ
  FOG: true,
};
</script>
<!-- ========================================================= -->

<div id="app"></div>
<div id="floor" class="hidden"></div>
<div id="carry" class="hidden">🟢 酔っ払いを連れている（W連打で手放す）</div>
<div id="lost" class="hidden">🔴 酔っ払いとはぐれた！</div>
<div id="verHud"></div>
<div id="langBtn">EN</div>
<div id="muteBtn" title="音のオン/オフ">🔊</div>
<div id="mission" class="hidden">
  <div id="missionTitle">ミッション</div>
  <ul>
    <li id="m1"><span class="chk">⬜</span><span class="mtxt"></span></li>
    <li id="m2"><span class="chk">⬜</span><span class="mtxt"></span></li>
  </ul>
</div>
<div id="mapToggle" class="hidden">🗺 たたむ（M）</div>
<div id="timer" class="hidden"></div>
<canvas id="map" class="hidden"></canvas>
<div id="mapLabel" class="hidden">MAP</div>
<div id="alert"></div>
<div id="cwTR"></div><div id="cwTL"></div><div id="cwBR"></div><div id="cwBL"></div>
<div id="speedL"></div><div id="speedR"></div>
<div id="toiletwarn"></div>
<div id="toiletcount"></div>
<div id="cross" class="hidden"></div>
<div id="hud" class="hidden">
  <div id="goal"></div>
  <div id="sub"></div>
  <div id="dash" class="hidden"><div id="dashFill"></div><span id="dashTxt"></span></div>
</div>

<div id="touch">
  <div id="pad">
    <div class="up">▲</div><div class="left">◀</div><div class="down">▼</div><div class="right">▶</div>
  </div>
</div>

<div id="start" class="overlay">
  <h1 id="title">新宿駅から出られない</h1>
  <p id="desc">酔っ払いを見つけて、地上の出口まで送り届けろ。<br>
     連れている間は走れない。ヤクザに捕まるな。<br>
     [WASD]移動 [マウス]視点 [しゃがむ]隠れる</p>
  <div style="display:flex;gap:14px;flex-wrap:wrap;justify-content:center">
    <button id="devBtn">開発者としてプレイ<br><span style="font-size:12px;opacity:.85">（マップ表示）</span></button>
    <button id="userBtn">ユーザーとしてプレイ<br><span style="font-size:12px;opacity:.85">（マップなし）</span></button>
  </div>
  <div id="version"></div>
</div>

<div id="result" class="overlay hidden">
  <h1 id="resultText"></h1>
  <div id="resultInfo"></div>
  <button id="restartBtn">もう一度</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function () {
  "use strict";
  if (typeof THREE === "undefined") {
    document.getElementById("start").innerHTML =
      "<h1>読み込み失敗</h1><p>Three.js を読み込めませんでした。ネット接続を確認して再読み込みしてください。</p>";
    return;
  }

  const C = CONFIG;
  const T = C.TILE;

  function ensureAudio(){

  function tone(freq,dur,o){ o=o||{}; if(!AC) return;
    const t=AC.currentTime+(o.when||0), osc=AC.createOscillator(); osc.type=o.type||"sine";
    osc.frequency.setValueAtTime(freq,t); if(o.glideTo) osc.frequency.exponentialRampToValueAtTime(o.glideTo,t+dur);
    const g=AC.createGain(), v=o.vol==null?0.2:o.vol, a=o.attack==null?0.01:o.attack;
    g.gain.setValueAtTime(0.0001,t); g.gain.linearRampToValueAtTime(v,t+a); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    osc.connect(g).connect(masterGain); osc.start(t); osc.stop(t+dur+0.03);
  }
  function noise(dur,o){ o=o||{}; if(!AC||!noiseBuf) return;
    const t=AC.currentTime+(o.when||0), src=AC.createBufferSource(); src.buffer=noiseBuf;
    let node=src; const lpf=AC.createBiquadFilter(); lpf.type="lowpass"; lpf.frequency.value=o.lp||1200; node.connect(lpf); node=lpf;
    if(o.hp){ const hpf=AC.createBiquadFilter(); hpf.type="highpass"; hpf.frequency.value=o.hp; node.connect(hpf); node=hpf; }
    const g=AC.createGain(), v=o.vol==null?0.2:o.vol; g.gain.setValueAtTime(v,t); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    node.connect(g).connect(masterGain); src.start(t); src.stop(t+dur+0.03);
  }
  function startAmbient(){
    // 低い駅のハム（連続・うなり）
    const o1=AC.createOscillator(); o1.type="sine"; o1.frequency.value=55;
    const o2=AC.createOscillator(); o2.type="sine"; o2.frequency.value=58.5;
    const hg=AC.createGain(); hg.gain.value=0.045; o1.connect(hg); o2.connect(hg); hg.connect(masterGain); o1.start(); o2.start();
    // 空調のホワイトノイズ（連続）
    const src=AC.createBufferSource(); src.buffer=noiseBuf; src.loop=true;
    const lpf=AC.createBiquadFilter(); lpf.type="lowpass"; lpf.frequency.value=340;

  function trainPass(){ if(!AC) return; const t=AC.currentTime; // 電車通過のゴーという増減

    const g=AC.createGain(); g.gain.setValueAtTime(0.0001,t); g.gain.linearRampToValueAtTime(0.11,t+1.6);
    g.gain.setValueAtTime(0.11,t+2.6); g.gain.exponentialRampToValueAtTime(0.0001,t+5);

  function makeTileTexture(o){
    const s=256, cv=document.createElement("canvas"); cv.width=cv.height=s;
    const g=cv.getContext("2d");
    g.fillStyle=o.base; g.fillRect(0,0,s,s);
    const step=s/o.div; g.strokeStyle=o.grout; g.lineWidth=o.line;
    for(let i=0;i<=o.div;i++){ g.beginPath();g.moveTo(i*step,0);g.lineTo(i*step,s);g.stroke();
      g.beginPath();g.moveTo(0,i*step);g.lineTo(s,i*step);g.stroke(); }
    if(o.sheen){ g.fillStyle="rgba(255,255,255,0.16)";
      for(let y=0;y<o.div;y++)for(let x=0;x<o.div;x++) g.fillRect(x*step+o.line,y*step+o.line,step*0.28,step*0.18); }
    const t=new THREE.CanvasTexture(cv); t.wrapS=t.wrapT=THREE.RepeatWrapping; t.anisotropy=4; return t;
  }

  // ---------- 迷路生成（フロアごとに独立した迷路） ----------
  let grids = {};   // grids[f] = 2D配列（f=1..NF）
  function shuffle(a){ for(let i=a.length-1;i>0;i--){const j=(RNG()*(i+1))|0;[a[i],a[j]]=[a[j],a[i]];} return a; }
  const inInner=(x,y)=> x>=1&&y>=1&&x<C.COLS-1&&y<C.ROWS-1;
  function gFloor(f,x,y){ const g=grids[f]; return x>=0&&y>=0&&x<C.COLS&&y<C.ROWS&&g[y][x]===0; }
  function gWall(f,x,y){ return !(x>=0&&y>=0&&x<C.COLS&&y<C.ROWS) || grids[f][y][x]===1; }

  function generateMazeGrid(floor){
    const g=[]; for(let y=0;y<C.ROWS;y++) g.push(new Array(C.COLS).fill(1));
    const F=(x,y)=> x>=0&&y>=0&&x<C.COLS&&y<C.ROWS&&g[y][x]===0;
    (function carve(cx,cy){
      g[cy][cx]=0;
      for(const [dx,dy] of shuffle([[0,-2],[0,2],[-2,0],[2,0]])){
        const nx=cx+dx, ny=cy+dy;
        if(ny>0&&ny<C.ROWS-1&&nx>0&&nx<C.COLS-1&&g[ny][nx]===1){ g[cy+dy/2][cx+dx/2]=0; carve(nx,ny); }
      }
    })(1,1);
    for(let y=1;y<C.ROWS-1;y++)for(let x=1;x<C.COLS-1;x++){
      if(g[y][x]===1){
        const h=F(x-1,y)&&F(x+1,y), v=F(x,y-1)&&F(x,y+1);
        if((h||v)&&RNG()<C.LOOP_PROB) g[y][x]=0;
      }
    }
    const pc=C.PLAZA_COUNTS[floor]||3;
    for(let i=0;i<pc;i++){
      // 広場は大きさランダム(3〜6マス)で駅構内らしい開放感を出す
      const rw=3+((RNG()*4)|0), rh=3+((RNG()*4)|0);
      const rx=1+((RNG()*(C.COLS-1-rw))|0), ry=1+((RNG()*(C.ROWS-1-rh))|0);
      for(let y=ry;y<ry+rh;y++)for(let x=rx;x<rx+rw;x++) g[y][x]=0;
    }
    braidFill(g);   // 行き止まりを除去（つなぐ／埋める）
    return g;
  }
  // 地下2階＝駅のプラットホーム（縦長・2マス幅の島式ホーム5面を独立配置、両側に電車。各ホーム同位置に階段）
  const LANES=[[2,3],[6,7],[10,11],[14,15],[18,19],[22,23]];          // 6つのホーム(2マス幅・少し狭め)
  const TRACKS=[[0,1],[4,5],[8,9],[12,13],[16,17],[20,21],[24,25]];   // 線路(電車)＝7本
  const PLAT_TOP=6, PLAT_BOT=42, TOP_Y0=3, BOT_Y0=43;        // ホームは y=6..42、階段は両端(上y3〜/下y43〜)
  const CENTER_COLS=LANES.map(l=>l[0]+1);                     // 各ホームの中央列
  const OBJ_ROWS=[]; for(let _y=PLAT_TOP+2;_y<=PLAT_BOT-2;_y+=2) OBJ_ROWS.push(_y); // 中央に等間隔・多めに
  function objType(y){ const i=((y-PLAT_TOP)/2)|0; return i%8===3?"kiosk":(i%8===5?"sign":(i%8===7?"trash":"pillar")); }
  function inLane(x){ return LANES.some(l=>x>=l[0]&&x<=l[1]); }
  function isTrainZone(x,y){ return TRACKS.some(l=>x>=l[0]&&x<=l[1]) && y>=PLAT_TOP && y<=PLAT_BOT; }
  function generatePlatformFloor(){
    const g=[]; for(let y=0;y<C.ROWS;y++) g.push(new Array(C.COLS).fill(1));
    // ホームは全面床。中央の柱などは壁にせず小さい円の当たり判定で扱う
    for(const [x0,x1] of LANES) for(let y=PLAT_TOP;y<=PLAT_BOT;y++) for(let x=x0;x<=x1;x++) g[y][x]=0;
    return g;
  }
  function generateAllFloors(){
    grids={}; grids[1]=generatePlatformFloor();
    for(let f=2;f<=NF;f++) grids[f]=generateMazeGrid(f);
  }

  // ---------- 行き止まり除去 ----------
  const DIRS4=[[1,0],[-1,0],[0,1],[0,-1]];
  function gFloorG(g,x,y){ return x>=0&&y>=0&&x<C.COLS&&y<C.ROWS && g[y][x]===0; }
  function braidFill(g){
    // 1) 行き止まりを並行通路へつないでループ化
    for(let p=0;p<4;p++){ let ch=false;
      for(let y=1;y<C.ROWS-1;y++)for(let x=1;x<C.COLS-1;x++){
        if(g[y][x]!==0) continue;
        let c=0; for(const[dx,dy]of DIRS4) if(gFloorG(g,x+dx,y+dy)) c++;
        if(c!==1) continue;
        for(const[dx,dy]of DIRS4){ const nx=x+dx,ny=y+dy,fx=x+2*dx,fy=y+2*dy;
          if(inInner(nx,ny)&&g[ny][nx]===1&&gFloorG(g,fx,fy)){ g[ny][nx]=0; ch=true; break; } }
      } if(!ch) break;
    }
    // 2) 残りの行き止まりは埋める（開始マスは除く）
    for(let p=0;p<C.COLS+C.ROWS;p++){ let ch=false;
      for(let y=1;y<C.ROWS-1;y++)for(let x=1;x<C.COLS-1;x++){
        if(g[y][x]!==0||(x===1&&y===1)) continue;
        let c=0; for(const[dx,dy]of DIRS4) if(gFloorG(g,x+dx,y+dy)) c++;
        if(c<=1){ g[y][x]=1; ch=true; }
      } if(!ch) break;
    }
  }
  function braidConnect(g,pw){
    for(let p=0;p<5;p++){ let ch=false;
      for(let y=1;y<C.ROWS-1;y++)for(let x=1;x<C.COLS-1;x++){
        if(g[y][x]!==0||(x===1&&y===1)) continue;
        let c=0; for(const[dx,dy]of DIRS4) if(gFloorG(g,x+dx,y+dy)) c++;
        if(c!==1) continue;
        for(const[dx,dy]of DIRS4){ const nx=x+dx,ny=y+dy,fx=x+2*dx,fy=y+2*dy;
          if(inInner(nx,ny)&&g[ny][nx]===1&&!pw.has(nx+","+ny)&&gFloorG(g,fx,fy)){ g[ny][nx]=0; ch=true; break; } }
      } if(!ch) break;
    }
  }
  function fillDead(g,pf){
    for(let p=0;p<C.COLS+C.ROWS;p++){ let ch=false;
      for(let y=1;y<C.ROWS-1;y++)for(let x=1;x<C.COLS-1;x++){
        if(g[y][x]!==0||(x===1&&y===1)||pf.has(x+","+y)) continue;
        let c=0; for(const[dx,dy]of DIRS4) if(gFloorG(g,x+dx,y+dy)) c++;
        if(c<=1){ g[y][x]=1; ch=true; }
      } if(!ch) break;
    }
  }
  // 階段配置後の行き止まり除去（階段は壊さないよう保護）
  // 連結成分（floorのみ）
  function components(g){
    const seen=new Set(), cs=[];
    for(let y=0;y<C.ROWS;y++)for(let x=0;x<C.COLS;x++){
      if(g[y][x]!==0||seen.has(x+","+y)) continue;
      const comp=[], q=[[x,y]]; seen.add(x+","+y); let i=0;
      while(i<q.length){ const [cx,cy]=q[i++]; comp.push([cx,cy]);
        for(const [dx,dy] of DIRS4){ const nx=cx+dx,ny=cy+dy;
          if(nx>=0&&ny>=0&&nx<C.COLS&&ny<C.ROWS&&g[ny][nx]===0&&!seen.has(nx+","+ny)){ seen.add(nx+","+ny); q.push([nx,ny]); } } }
      cs.push(comp);
    }
    return cs;
  }
  // 分断された連結成分を、保護壁(pw)を避けつつ最短で掘ってつなぐ
  function connectComps(g,pw){
    let cs=components(g); if(cs.length<=1) return;
    cs.sort((a,b)=>b.length-a.length);
    let mainSet=new Set(cs[0].map(c=>c[0]+","+c[1]));
    for(let i=1;i<cs.length;i++){
      if(mainSet.has(cs[i][0][0]+","+cs[i][0][1])) continue;
      const dist={}, prev={}, dq=[];
      for(const [x,y] of cs[i]){ const k=x+","+y; dist[k]=0; dq.push([x,y]); }
      let hit=null;
      while(dq.length){
        const [x,y]=dq.shift(), k=x+","+y, d=dist[k]; if(d===undefined) continue;
        if(mainSet.has(k)){ hit=k; break; }
        for(const [dx,dy] of DIRS4){ const nx=x+dx,ny=y+dy; if(!(nx>=0&&ny>=0&&nx<C.COLS&&ny<C.ROWS)) continue;
          const nk=nx+","+ny, isF=g[ny][nx]===0; let cost;
          if(isF) cost=0; else if(pw.has(nk)||!inInner(nx,ny)) continue; else cost=1;
          const nd=d+cost;
          if(dist[nk]===undefined||nd<dist[nk]){ dist[nk]=nd; prev[nk]=k; if(cost===0) dq.unshift([nx,ny]); else dq.push([nx,ny]); }
        }
      }
      if(hit){ let k=hit; while(prev[k]!==undefined){ const p=k.split(","); const x=+p[0],y=+p[1]; if(g[y][x]===1) g[y][x]=0; k=prev[k]; } }
      mainSet=new Set(components(g).sort((a,b)=>b.length-a.length)[0].map(c=>c[0]+","+c[1]));
    }
  }
  function cleanupDeadEnds(){
    const pf={}, pw={}, pcn={};   // pcn=連結修復用の保護（手すりは除外＝つなぐために通す）
    for(let f=1;f<=NF;f++){ pf[f]=new Set(); pw[f]=new Set(); pcn[f]=new Set(); }
    const asArr=t=>Array.isArray(t[0])?t:[t];
    for(const s of stairs){
      const lv=s.lvl;
      s.run.forEach(([x,y])=>{ pf[lv].add(x+","+y); pf[lv+1].add(x+","+y); });
      asArr(s.entry).forEach(([x,y])=>{ pf[lv].add(x+","+y); pw[lv+1].add(x+","+y); pcn[lv+1].add(x+","+y); });
      asArr(s.exit).forEach(([x,y])=>{ pf[lv+1].add(x+","+y); pw[lv].add(x+","+y); pcn[lv].add(x+","+y); });
      asArr(s.beyond).forEach(([x,y])=>pf[lv+1].add(x+","+y));
      s.rails.forEach(([x,y])=>{ pw[lv].add(x+","+y); pw[lv+1].add(x+","+y); });
    }
    for(let f=2;f<=NF;f++){
      braidConnect(grids[f], pw[f]); fillDead(grids[f], pf[f]);
      connectComps(grids[f], pcn[f]); fillDead(grids[f], pf[f]);
    }
  }

  // ---------- 階段（フロア間を貫く。非対称に掘る：上り口側=下階の通路／降り口側=上階の通路、坂の反対は壁） ----------
  let stairs = [];
  const stairTileSet = new Set();
  let slabOmit = {};               // level -> Set("x,y") その階の床を抜く位置（吹き抜け）
  let stairTileLevel = {};         // "x,y" -> lvl
  function carveConn(g,sx,sy,dx,dy){
    let x=sx,y=sy;
    for(let k=0;k<C.COLS+C.ROWS;k++){ const nx=x+dx,ny=y+dy; if(!inInner(nx,ny)) break; if(g[ny][nx]===0) break; g[ny][nx]=0; x=nx; y=ny; }
  }
  function setWall(g,x,y){ if(y>=0&&y<C.ROWS&&x>=0&&x<C.COLS) g[y][x]=1; }
  function makeStair(axis,x0,y0,lvl){
    const L=C.STAIR_LEN; const run=[],rails=[]; let entry,exit,bd,fd,adir,ta0,ta1,tc0,tc1;
    if(axis==="x"){ for(let i=0;i<L;i++){run.push([x0+i,y0]);rails.push([x0+i,y0-1]);rails.push([x0+i,y0+1]);} entry=[x0-1,y0]; exit=[x0+L,y0]; bd=[-1,0]; fd=[1,0]; adir=[1,0]; ta0=x0; ta1=x0+L; tc0=y0; tc1=y0+1; }
    else          { for(let i=0;i<L;i++){run.push([x0,y0+i]);rails.push([x0-1,y0+i]);rails.push([x0+1,y0+i]);} entry=[x0,y0-1]; exit=[x0,y0+L]; bd=[0,-1]; fd=[0,1]; adir=[0,1]; ta0=y0; ta1=y0+L; tc0=x0; tc1=x0+1; }
    return { axis,lvl,run,rails,entry,exit,bd,fd,adir, beyond:[exit[0]+adir[0],exit[1]+adir[1]],
      a0:ta0*T,a1:ta1*T,c0:tc0*T,c1:tc1*T,
      cx:axis==="x"?(ta0+ta1)/2*T:(tc0+tc1)/2*T, cz:axis==="x"?(tc0+tc1)/2*T:(ta0+ta1)/2*T,
      cxTile:axis==="x"?x0+L/2:x0+0.5, cyTile:axis==="x"?y0+0.5:y0+L/2 };
  }
  function carveStairInto(s){
    const lo=grids[s.lvl], up=grids[s.lvl+1];
    // 下階：上り口(entry)側を通路に、坂の反対側(exit)は壁
    s.run.forEach(([x,y])=>lo[y][x]=0); lo[s.entry[1]][s.entry[0]]=0; setWall(lo,s.exit[0],s.exit[1]);
    s.rails.forEach(([x,y])=>setWall(lo,x,y)); carveConn(lo, s.entry[0],s.entry[1], s.bd[0],s.bd[1]);
    // 上階：降り口(exit)側を通路に、坂の反対側(entry)は壁
    s.run.forEach(([x,y])=>up[y][x]=0); up[s.exit[1]][s.exit[0]]=0; setWall(up,s.entry[0],s.entry[1]);
    s.rails.forEach(([x,y])=>setWall(up,x,y)); carveConn(up, s.exit[0],s.exit[1], s.fd[0],s.fd[1]);
    // 上がった先(beyond)は必ず通路
    if(inInner(s.beyond[0],s.beyond[1])) up[s.beyond[1]][s.beyond[0]]=0;
  }
  // 地下2階ホーム用：1マス幅・3段の階段（中央列）。ホーム両端に配置。up=+1(下端)/-1(上端)
  function makePlatStair(x0,y0,up){
    const xc=x0+1;
    const run=[[xc,y0],[xc,y0+1],[xc,y0+2]];
    const rails=[[x0,y0],[x0,y0+1],[x0,y0+2],[x0+2,y0],[x0+2,y0+1],[x0+2,y0+2]];
    let entry,exit,beyond;
    if(up===1){ entry=[xc,y0-1]; exit=[xc,y0+3]; beyond=[xc,y0+4]; }
    else      { entry=[xc,y0+3]; exit=[xc,y0-1]; beyond=[xc,y0-2]; }
    return { axis:"z", lvl:1, run, rails, entry, exit, beyond, up,
      a0:y0*T, a1:(y0+3)*T, c0:xc*T, c1:(xc+1)*T,
      cx:(xc+0.5)*T, cz:(y0+1.5)*T, adir:[0,up], cxTile:xc+0.5, cyTile:y0+1.5 };
  }
  function carvePlatStair(s){
    const lo=grids[1], up=grids[2], e=s.entry, ex=s.exit, by=s.beyond;
    s.run.forEach(([x,y])=>{ lo[y][x]=0; up[y][x]=0; });
    lo[e[1]][e[0]]=0; setWall(up,e[0],e[1]);   // 下=通路, 上=壁
    setWall(lo,ex[0],ex[1]); up[ex[1]][ex[0]]=0; // 下=壁, 上=通路
    if(inInner(by[0],by[1])) up[by[1]][by[0]]=0;
    s.rails.forEach(([x,y])=>{ setWall(lo,x,y); setWall(up,x,y); });
    carveConn(up, ex[0], ex[1], 0, s.up);        // 地下1階の迷路側へ接続
  }
  function findStairs(){
    stairs=[]; stairTileSet.clear(); slabOmit={}; stairTileLevel={};
    for(let f=2;f<=NF;f++) slabOmit[f]=new Set();
    const L=C.STAIR_LEN; const usedW=new Set(); const usedR=new Set(); const placed=[];
    // 地下1階(ホーム)→地上1階：各ホームの両端＋中央に1マス幅の階段
    const CY0=((PLAT_TOP+PLAT_BOT)>>1)-1;   // 中央の階段の起点
    LANES.forEach(([x0,x1],laneIdx)=>{
      for(const [y0,up,center] of [[TOP_Y0,-1,false],[BOT_Y0,1,false],[CY0,1,true]]){
        const s=makePlatStair(x0,y0,up);
        s.lane=laneIdx;   // この階段が通じるホーム（路線）の番号
        carvePlatStair(s);
        if(center) for(let dy=0;dy<3;dy++) grids[1][y0+dy][x0]=0;   // 中央階段は内側(x0)を平面のまま残し、ホームを分断しない
        s.run.forEach(([x,y])=>{ const k=x+","+y; stairTileSet.add(k); stairTileLevel[k]=1; slabOmit[2].add(k); });
        [...s.run,s.entry,s.exit,s.beyond].forEach(t=>usedW.add(t[0]+","+t[1]));
        s.rails.forEach(t=>usedR.add(t[0]+","+t[1]));
        placed.push({cxTile:s.cxTile,cyTile:s.cyTile});
        stairs.push(s);
      }
    });
    // 小田急線：地上1階(level2)にもホームを作り、地下1階→地上1階→地上2階を直通でつなぐ階段を追加
    oduHall=null;
    const odaIdx=SHINJUKU_LINES.findIndex(l=>l.name==="小田急線");
    if(odaIdx>=0 && odaIdx<LANES.length && NF>=3){
      const [hx0,hx1]=LANES[odaIdx], tCols=[hx0-2,hx0-1];          // ホーム列(18,19)・左の線路列(16,17)
      for(let y=PLAT_TOP;y<=PLAT_BOT;y++){
        grids[2][y][hx0]=0; grids[2][y][hx1]=0;                    // ホール＝床
        setWall(grids[2],tCols[0],y); setWall(grids[2],tCols[1],y);// 線路＝壁（電車を載せる）
        usedW.add(hx0+","+y); usedW.add(hx1+","+y); usedR.add(tCols[0]+","+y); usedR.add(tCols[1]+","+y);
      }
      const sy0=PLAT_BOT-C.STAIR_LEN-2;                            // 直通階段はホール下寄り、中央列(hx1)
      const su=makeStair("z", hx1, sy0, 2);
      carveStairInto(su);
      su.run.forEach(([x,y])=>{ const k=x+","+y; stairTileSet.add(k); stairTileLevel[k]=2; slabOmit[3].add(k); });
      // oneWayは設定しない（=両方向。通行人も上り下りに使える）
      [...su.run,su.entry,su.exit,su.beyond].forEach(t=>usedW.add(t[0]+","+t[1]));
      su.rails.forEach(t=>usedR.add(t[0]+","+t[1]));
      placed.push({cxTile:su.cxTile,cyTile:su.cyTile});
      stairs.push(su);
      oduHall={x0:hx0,x1:hx1,tCols,lineIdx:odaIdx};
    }
    // 地下1階→地上：ランダム
    for(let lvl=2; lvl<NF; lvl++){
      let n=0, att=0;
      while(n<C.STAIR_COUNT && att<1200){
        att++;
        const axis = RNG()<0.5?"x":"z";
        let x0,y0;
        if(axis==="x"){ x0=2+((RNG()*(C.COLS-2-L-1))|0); y0=1+((RNG()*(C.ROWS-2))|0); }
        else          { x0=1+((RNG()*(C.COLS-2))|0);     y0=2+((RNG()*(C.ROWS-2-L-1))|0); }
        const s=makeStair(axis,x0,y0,lvl);
        const wkeys=[...s.run,s.entry,s.exit,s.beyond].map(t=>t[0]+","+t[1]);
        const rkeys=s.rails.map(t=>t[0]+","+t[1]);
        if(wkeys.some(k=>usedW.has(k)||usedR.has(k))) continue;
        if(rkeys.some(k=>usedW.has(k))) continue;
        if(placed.some(p=>Math.abs(p.cxTile-s.cxTile)+Math.abs(p.cyTile-s.cyTile)<4)) continue;
        carveStairInto(s);
        s.oneWay = (n%2===0)?1:-1;   // 通行人専用の一方通行(上り/下りを別階段に分けて渋滞を防ぐ。プレイヤー/敵は両用)
        s.run.forEach(([x,y])=>{ const k=x+","+y; stairTileSet.add(k); stairTileLevel[k]=lvl; slabOmit[lvl+1].add(k); });
        wkeys.forEach(k=>usedW.add(k)); rkeys.forEach(k=>usedR.add(k));
        placed.push({cxTile:s.cxTile,cyTile:s.cyTile});
        stairs.push(s); n++;
      }
    }
  }


  // 現在 level にいる人がその階段に乗っているか判定し、高さと移行先を返す
  function stairInfo(x,z,level){
    for(const s of stairs){
      if(level!==s.lvl && level!==s.lvl+1) continue;   // その階段に関係する階層のみ
      const along=s.axis==="x"?x:z, cross=s.axis==="x"?z:x;
      if(cross>=s.c0&&cross<=s.c1&&along>=s.a0&&along<=s.a1){
        let t=(along-s.a0)/(s.a1-s.a0);
        if(s.up===-1) t=1-t;                  // 上端の階段は向きが逆
        return { t, y:(s.lvl-1)*FH + t*FH, lvl:s.lvl };
      }
    }
    return null;
  }
  // level から dir 方向(+1=上,-1=下)へ移動できる最寄りの階段の中心を返す
  function nearestStairForMove(x,z,level,dir){
    let best=null,bd=1e9;
    for(const s of stairs){
      if(dir>0 && s.lvl!==level) continue;       // 上る：下端がこの階の階段
      if(dir<0 && s.lvl+1!==level) continue;      // 下る：上端がこの階の階段

  }

  // 黄色い誘導線：通路だけ中央線を引く。広場(open)の中には一切引かない（無駄な線・格子を出さない）
  function buildYellowLines(f){
    if(f===1){ buildPlatformYellow(); return; }
    const g=grids[f];
    const isFloor=(x,y)=> x>=0&&y>=0&&x<C.COLS&&y<C.ROWS && g[y][x]===0 && !stairTileSet.has(x+","+y);
    // 広場(open)=どこかの2x2が全部床に含まれるマス（＝開けた場所）
    const open=Array.from({length:C.ROWS},()=>new Array(C.COLS).fill(false));
    for(let y=0;y<C.ROWS-1;y++)for(let x=0;x<C.COLS-1;x++){
      if(isFloor(x,y)&&isFloor(x+1,y)&&isFloor(x,y+1)&&isFloor(x+1,y+1)){
        open[y][x]=open[y][x+1]=open[y+1][x]=open[y+1][x+1]=true;
      }
    }
    const h=(f-1)*FH+0.06, wHalf=0.2, verts=[];
    const segWorld=(ax,az,bx,bz)=>{ const px=(ax===bx)?wHalf:0, pz=(az===bz)?wHalf:0;
      verts.push(ax+px,h,az+pz, bx+px,h,bz+pz, bx-px,h,bz-pz,
                 ax+px,h,az+pz, bx-px,h,bz-pz, ax-px,h,az-pz); };
    const seg=(x1,y1,x2,y2)=>{ const a=tileToWorld(x1,y1),b=tileToWorld(x2,y2); segWorld(a.x,a.z,b.x,b.z); };
    // 通路の中央線のみ。広場どうし(open&&open)の辺は引かない＝広場の中は線なし
    for(let y=0;y<C.ROWS;y++)for(let x=0;x<C.COLS;x++){
      if(!isFloor(x,y)) continue;
      for(const [dx,dy] of [[1,0],[0,1]]){ const nx=x+dx,ny=y+dy;
        if(!isFloor(nx,ny)) continue;
        if(open[y][x] && open[ny][nx]) continue;   // 広場の内部：線を引かない
        seg(x,y,nx,ny);                            // 通路の線（広場の縁では1マスだけ出る）
      }
    }
    if(!verts.length) return;
    const geo=new THREE.BufferGeometry();
    geo.setAttribute("position", new THREE.Float32BufferAttribute(verts,3));
    worldRoot.add(new THREE.Mesh(geo, yellowMat));
  }

  function buildDeptEntrances(f){
    deptDoors=[];
    // デパートは「外周(建物の外壁)」沿いだけに配置する（マップ中央の迷路壁には置かない）
    const peri=[];
    for(let y=2;y<C.ROWS-2;y++){ peri.push([1,y,-1,0]); peri.push([C.COLS-2,y,1,0]); }       // 左右の外壁
    for(let x=2;x<C.COLS-2;x++){ peri.push([x,1,0,-1]); peri.push([x,C.ROWS-2,0,1]); }         // 上下の外壁
    const cand=[];
    for(const [x,y,dx,dy] of peri){
      if(grids[f][y][x]!==0 || stairTileSet.has(x+","+y)) continue;   // 構内側が床、階段でない
      if(!gWall(f,x+dx,y+dy)) continue;                              // 背後が外壁
      // 横幅3マスぶん、後ろが平らな壁になっている所だけ（幅広の出入口用に）
      const px=(dx===0)?1:0, py=(dy===0)?1:0;
      if(!gWall(f,x+dx+px,y+dy+py) || !gWall(f,x+dx-px,y+dy-py)) continue;
      if(stairTileSet.has((x+px)+","+(y+py))||stairTileSet.has((x-px)+","+(y-py))) continue;
      cand.push({x,y,dx,dy,px,py});
    }
    for(let i=cand.length-1;i>0;i--){ const j=(Math.random()*(i+1))|0; [cand[i],cand[j]]=[cand[j],cand[i]]; }
    const signMat=new THREE.MeshBasicMaterial({map:deptSignTex(),side:THREE.DoubleSide});
    const glassTex=deptGlassTex(); glassTex.wrapS=THREE.RepeatWrapping; glassTex.repeat.set(3,1); // 幅広ぶんガラス戸を3枚並べる
    const glassMat=new THREE.MeshBasicMaterial({map:glassTex,side:THREE.DoubleSide});
    const frameMat=new THREE.MeshLambertMaterial({color:0x3a4047,side:THREE.DoubleSide});
    const base=(f-1)*FH, want=12+((Math.random()*4)|0); // 従来の3倍＝12〜15カ所
    const WD=3*T;                                       // 開口幅＝地上の通常出口(1マス)の3倍
    const placed=[];
    for(const c of cand){
      if(placed.length>=want) break;
      if(placed.some(p=>Math.abs(p.x-c.x)+Math.abs(p.y-c.y)<5)) continue;
      if(exits.some(e=>e.level===f && Math.abs(e.tx-c.x)+Math.abs(e.ty-c.y)<6)) continue;   // 出口の近くにはデパート出入口を置かない（表示の干渉防止）
      placed.push(c);
      const w=tileToWorld(c.x,c.y);
      deptDoors.push({x:w.x, z:w.z});   // デパートの人の出入り口（手前の床）
      const fx=w.x+c.dx*(T/2-0.06), fz=w.z+c.dy*(T/2-0.06);  // 壁手前
      const bx=w.x+c.dx*(T/2-0.02), bz=w.z+c.dy*(T/2-0.02);  // 枠は少し奥
      const frame=new THREE.Mesh(new THREE.PlaneGeometry(WD+0.6,3.7), frameMat);
      frame.position.set(bx, base+1.85, bz); frame.lookAt(w.x, base+1.85, w.z); worldRoot.add(frame);
      const door=new THREE.Mesh(new THREE.PlaneGeometry(WD*0.92,2.9), glassMat);
      door.position.set(fx, base+1.45, fz); door.lookAt(w.x, base+1.45, w.z); worldRoot.add(door);
      const sgn=new THREE.Mesh(new THREE.PlaneGeometry(WD*0.95,1.05), signMat);
      sgn.position.set(fx, base+3.4, fz); sgn.lookAt(w.x, base+3.4, w.z); worldRoot.add(sgn);
      // 庇（キャノピー）：入口の上から通路側へ張り出す
      const ext=1.1, ccx=fx-c.dx*ext*0.5, ccz=fz-c.dy*ext*0.5;
      const cgeo=(c.dx!==0)? new THREE.BoxGeometry(ext+0.2,0.18,WD*0.98) : new THREE.BoxGeometry(WD*0.98,0.18,ext+0.2);
      const canopy=new THREE.Mesh(cgeo, frameMat); canopy.position.set(ccx, base+2.95, ccz); worldRoot.add(canopy);
    }
  }

  // ---------- 地下1階：フロア前後の「別ビルへの超巨大な出入口」＋通り抜けの人流 ----------
  function buildingSignTex(side){

  // side="front"(前=低座標側) / "back"(後ろ=高座標側) の各列で、その壁に最も近い床タイル＝出入口の口
  function collectMouthTiles(f, side){
    const out=[];
    for(let x=1;x<C.COLS-1;x++){
      if(side==="front"){ for(let y=1;y<C.ROWS/2;y++){ if(grids[f][y][x]===0 && !stairTileSet.has(x+","+y)){ out.push({x,y}); break; } } }
      else { for(let y=C.ROWS-2;y>=C.ROWS/2;y--){ if(grids[f][y][x]===0 && !stairTileSet.has(x+","+y)){ out.push({x,y}); break; } } }
    }
    return out;
  }
  function buildBuildingPortal(f, side){
    const base=(f-1)*FH, H=FH*0.94, cx=C.COLS*T/2;
    const z = side==="front" ? T*0.55 : C.ROWS*T - T*0.55;
    const face = side==="front" ? 1 : -1;                 // フロア内側へ向く向き（前=+z / 後ろ=-z）
    // この側(前/後ろ)にある出口の開口x範囲は避けてスリット状に作る＝出口と干渉しない
    const exRanges = exits.filter(e=> e.level===f && (side==="front"? e.oy<0 : e.oy>0)).map(e=>{ const hw=(e.wide?3:e.mid?2:1)*T; return [e.x-hw, e.x+hw]; });
    const blocked=(x)=> exRanges.some(r=> x>r[0] && x<r[1]);
    const frameMat=new THREE.MeshLambertMaterial({color:0x23282e});
    const glowMat=new THREE.MeshBasicMaterial({color:0xf2e6c4}); glowMat.toneMapped=false;
    const gtex=deptGlassTex(); const glassMat=new THREE.MeshBasicMaterial({map:gtex,transparent:true,opacity:0.5,side:THREE.DoubleSide}); glassMat.toneMapped=false;
    const x0=2*T, x1=(C.COLS-2)*T;
    for(let xs=x0; xs<x1-1; xs+=T){ const xc=xs+T/2; if(blocked(xc)) continue;
      const frame=new THREE.Mesh(new THREE.BoxGeometry(T*0.98,H+0.6,0.4), frameMat); frame.position.set(xc, base+H/2, z-face*0.28); worldRoot.add(frame);
      const glow=new THREE.Mesh(new THREE.PlaneGeometry(T*0.72,H*0.9), glowMat); glow.position.set(xc, base+H/2, z-face*0.12); if(face<0) glow.rotation.y=Math.PI; worldRoot.add(glow);
      const glass=new THREE.Mesh(new THREE.PlaneGeometry(T*0.8,H*0.8), glassMat); glass.position.set(xc, base+H*0.42, z); if(face<0) glass.rotation.y=Math.PI; worldRoot.add(glass);
    }
    // 看板＋庇は上部（出口ゲートと高さがかぶらない位置）にまとめて
    const sg=new THREE.Mesh(new THREE.PlaneGeometry((C.COLS-6)*T, FH*0.34), new THREE.MeshBasicMaterial({map:buildingSignTex(side),side:THREE.DoubleSide}));
    sg.material.toneMapped=false; sg.position.set(cx, base+H*0.9, z+face*0.06); if(face<0) sg.rotation.y=Math.PI; worldRoot.add(sg);
    const can=new THREE.Mesh(new THREE.BoxGeometry((C.COLS-4)*T,0.3,T*0.85), new THREE.MeshLambertMaterial({color:0x2c3238}));
    can.position.set(cx, base+H*0.78, z+face*(T*0.42)); worldRoot.add(can);
  }
  function buildB1Portals(){
    throughFront=collectMouthTiles(2,"front"); throughBack=collectMouthTiles(2,"back");
    buildBuildingPortal(2,"front"); buildBuildingPortal(2,"back");
    throughFields.front = throughFront.length ? bfsField(2, throughFront.map(t=>[t.x,t.y])) : null;
    throughFields.back  = throughBack.length  ? bfsField(2, throughBack.map(t=>[t.x,t.y]))  : null;
    if(!throughFront.length || !throughBack.length) return;
    let pi2=pedestrians.length;
    for(let k=0;k<C.THROUGH_PED_COUNT;k++){
      const f2b=(k%2===0), src=f2b?throughFront:throughBack;
      const m=src[(Math.random()*src.length)|0], w=tileToWorld(m.x,m.y);
      pedestrians.push({ x:w.x+(Math.random()-0.5)*T*0.4, z:w.z+(Math.random()-0.5)*T*0.4, level:2, y:FH,
        dir:Math.random()*6.28, timer:Math.random()*3, rush:0, ci:(pi2++)%clothColors.length, ry:0,
        kind:"T", thr:f2b?"F2B":"B2F", goal:0, ride:null, trip:-1, lastStair:-1, ktarget:-1, visit:0, roleT:1e9 });
    }
  }
  // 通り抜け：目標ビルの出入口へ向かい、着いたら反対側のビルから再び現れる（常に前⇄後ろの人流）
  function throughStep(p, dt){
    if(p.rush>0) p.rush-=dt;
    const f2b=(p.thr==="F2B"), field=f2b?throughFields.back:throughFields.front;
    const srcMouth=f2b?throughFront:throughBack;
    if(!field){ wanderStep(p,dt); return; }
    const tx=Math.floor(p.x/T), ty=Math.floor(p.z/T);
    if(tx<0||ty<0||tx>=C.COLS||ty>=C.ROWS){ wanderStep(p,dt); return; }
    const d=field.dist[ty][tx];
    if(d>=0 && d<=1){   // 目標ビルに到達→反対側のビルから出直す
      const mm=srcMouth[(Math.random()*srcMouth.length)|0]||{x:tx,y:ty}, w=tileToWorld(mm.x,mm.y);
      p.x=w.x+(Math.random()-0.5)*T*0.3; p.z=w.z+(Math.random()-0.5)*T*0.3; return;
    }
    if(field.step[ty][tx]>=0){ const dd=DIRS4[field.step[ty][tx]], tw=tileToWorld(tx+dd[0],ty+dd[1]); pedMoveDir(p, tw.x-p.x, tw.z-p.z, dt, false); }
    else wanderStep(p, dt);
  }

  // 小田急線の地上1階(level2)ホーム＋電車を描画（地下1階の小田急線の真上）
  function buildOdakyuUpper(){

    const stripe="#"+ln.col.toString(16).padStart(6,"0");

    const endMat=new THREE.MeshLambertMaterial({color:0xe2e7ec}), roofMat=new THREE.MeshLambertMaterial({color:0xbac1c7}), underMat=new THREE.MeshLambertMaterial({color:0x20252a});

      const cz0=z0+c*(total/NCARS)+gap/2, czc=cz0+carLen/2;

      const under=new THREE.Mesh(new THREE.BoxGeometry(carW*0.9,0.6,carLen*0.98),underMat); under.position.set(xc,base+0.3,czc); worldRoot.add(under);
      const roof=new THREE.Mesh(new THREE.BoxGeometry(carW*0.86,0.3,carLen*0.99),roofMat); roof.position.set(xc,by0+carH+0.1,czc); worldRoot.add(roof);
    }
    // ホーム端の黄色い縁（電車側）
    const yl=new THREE.Mesh(new THREE.PlaneGeometry(T*0.5,z1-z0), new THREE.MeshBasicMaterial({color:0xf2c200})); yl.material.toneMapped=false;
    yl.rotation.x=-Math.PI/2; yl.position.set(oduHall.x0*T+T*0.15, base+0.06, (z0+z1)/2); worldRoot.add(yl);
    // 小田急線サイン（吊り下げ・両面）
    const blank=new THREE.MeshLambertMaterial({color:0x10151b});
    const face=new THREE.MeshBasicMaterial({map:lineSignTex(ln,"ホーム","Platform")}); face.toneMapped=false;
    for(const zf of [0.3,0.7]){ const zz=(PLAT_TOP+(PLAT_BOT-PLAT_TOP)*zf)*T;
      const sign=new THREE.Mesh(new THREE.BoxGeometry(T*1.4,0.7,0.12),[blank,blank,blank,blank,face,face]);
      sign.position.set((oduHall.x0+1)*T, base+FH*0.72, zz); worldRoot.add(sign);
      const pole=new THREE.Mesh(new THREE.BoxGeometry(0.08,0.5,0.08), blank); pole.position.set((oduHall.x0+1)*T, base+FH*0.72+0.6, zz); worldRoot.add(pole); }
  }
  // 地下2階の描画：中央の柱/売店/看板/ゴミ箱（小さい当たり判定）、線路の電車、境界壁
  function buildPlatform(){
    platObstacles=[];
    // 中央列のオブジェクト（壁ではなく小さい円の当たり判定）
    for(const [x0,x1] of LANES){ const xc=x0+1;
      for(const y of OBJ_ROWS){
        if(stairTileSet.has(xc+","+y)) continue;   // 中央階段の上にはオブジェクトを置かない
        const w=tileToWorld(xc,y); const t=objType(y); let m,r;
        if(t==="pillar"){ m=new THREE.Mesh(new THREE.BoxGeometry(0.6,FH,0.6),pillarMat); m.position.set(w.x,FH/2,w.z); r=0.32; }
        else if(t==="kiosk"){ m=buildKiosk(w.x,0,w.z); r=2.0; } // 人より大きい遮蔽物（店舗）
        else if(t==="trash"){ m=new THREE.Mesh(new THREE.BoxGeometry(0.7,1.0,0.7),trashMat); m.position.set(w.x,0.5,w.z); r=0.36; }
        else { m=new THREE.Mesh(new THREE.BoxGeometry(T*0.7,1.7,0.16),signMat); m.position.set(w.x,1.6,w.z); r=0.4; }
        worldRoot.add(m);
        platObstacles.push({x:w.x, z:w.z, r});
      }
    }
    // 壁（境界など。中央オブジェクトはもう壁ではない）
    for(let y=0;y<C.ROWS;y++)for(let x=0;x<C.COLS;x++){
      if(grids[1][y][x]!==1) continue;
      if(stairTileLevel[x+","+y]===1) continue;      // この階の階段だけ別描画（上階の階段位置の壁は普通に描く＝見えない壁を防ぐ）
      if(isTrainZone(x,y)) continue;                 // 線路は電車でまとめて描画
      const w=tileToWorld(x,y);
      const seg=new THREE.Mesh(wallSegGeo,wallMat); seg.position.set(w.x,FH/2,w.z); worldRoot.add(seg);
    }
    // 電車（複数車両編成・連続窓ライン／ドア／床下機器／屋根＋クーラー／先頭車／開ドアの室内灯）
    boarders=[]; trainDoors=[];
    const z0=PLAT_TOP*T, z1=(PLAT_BOT+1)*T, total=(z1-z0)*0.98, NCARS=4, gap=0.5, carLen=total/NCARS-gap;
    TRACKS.forEach((l,i)=>{
      const xc=(l[0]+l[1]+1)/2*T, carW=(l[1]-l[0]+1)*T*0.62, carH=FH*0.78, by0=0.55;
      const stripe="#"+SHINJUKU_LINES[i%SHINJUKU_LINES.length].col.toString(16).padStart(6,"0"); // 路線カラー
      const side=new THREE.MeshLambertMaterial({map:makeTrainSideTex(stripe)});
      const endMat=new THREE.MeshLambertMaterial({color:0xe2e7ec});
      const roofMat=new THREE.MeshLambertMaterial({color:0xbac1c7});
      const underMat=new THREE.MeshLambertMaterial({color:0x20252a});
      const glowMat=new THREE.MeshBasicMaterial({color:0xfff0d4,side:THREE.DoubleSide}); glowMat.toneMapped=false;
      const winMat=new THREE.MeshBasicMaterial({color:0x1b2932,side:THREE.DoubleSide}); winMat.toneMapped=false;
      const sideAdj=[[-1,l[0]-1],[1,l[1]+1]];
      for(let c=0;c<NCARS;c++){
        const cz0=z0 + c*(total/NCARS) + gap/2, czc=cz0+carLen/2;
        const body=new THREE.Mesh(new THREE.BoxGeometry(carW,carH,carLen), [side,side,endMat,endMat,endMat,endMat]);
        body.position.set(xc, by0+carH/2, czc); worldRoot.add(body);
        const under=new THREE.Mesh(new THREE.BoxGeometry(carW*0.9,by0+0.1,carLen*0.98), underMat);
        under.position.set(xc,(by0+0.1)/2,czc); worldRoot.add(under);                 // 床下/スカート
        const roof=new THREE.Mesh(new THREE.BoxGeometry(carW*0.86,0.34,carLen*0.99), roofMat);
        roof.position.set(xc, by0+carH+0.1, czc); worldRoot.add(roof);
        const ac=new THREE.Mesh(new THREE.BoxGeometry(carW*0.5,0.28,carLen*0.42), underMat);
        ac.position.set(xc, by0+carH+0.3, czc); worldRoot.add(ac);                     // クーラー
        if(c===0||c===NCARS-1){                                                        // 先頭車の前面窓
          const fw=new THREE.Mesh(new THREE.PlaneGeometry(carW*0.72,carH*0.36), winMat);
          fw.position.set(xc, by0+carH*0.62, c===0?cz0-0.05:cz0+carLen+0.05); worldRoot.add(fw);
        }
        sideAdj.forEach(([sgn,adjX])=>{                                                // ホーム側の開ドア
          if(!inLane(adjX)) return;
          const platX=(adjX+0.5)*T, dxs=xc+sgn*carW/2;
          [0.28,0.72].forEach((frac,di)=>{
            const dz=cz0+carLen*frac;
            const open=new THREE.Mesh(new THREE.BoxGeometry(0.14,carH*0.62,1.35), new THREE.MeshBasicMaterial({color:0x0a0e12}));
            open.position.set(dxs, by0+carH*0.4, dz); worldRoot.add(open);              // 開口
            const glow=new THREE.Mesh(new THREE.PlaneGeometry(1.25,carH*0.55), glowMat);
            glow.position.set(dxs - sgn*0.28, by0+carH*0.38, dz); glow.rotation.y=sgn>0?-Math.PI/2:Math.PI/2; worldRoot.add(glow); // 室内灯
            trainDoors.push({x:platX, z:dz});
            if(di===0 && c%2===0){
              const bty=Math.floor(dz/T);   // 往復先が階段/壁のドアには乗降客を置かない（階段や柵をすり抜けて歩くのを防ぐ）
              if(bty>=0 && bty<C.ROWS && grids[1][bty][adjX]===0 && stairTileLevel[adjX+","+bty]!==1){
                for(let k=0;k<2;k++){ const gh=makeHuman(clothColors[(i*3+k)%clothColors.length]); worldRoot.add(gh);
                  boarders.push({ group:gh, doorX:dxs, platX, z:dz+(k-0.5)*1.0, phase:Math.random()*6.28 }); } } }
          });
        });
      }
    });
    // ホームの吊り下げ案内サイン（◯番線 のりば）＋ 駅名標
    const psBlank=new THREE.MeshLambertMaterial({color:0x171c22});
    const ekiFace=new THREE.MeshBasicMaterial({map:ekimeiTex()}); ekiFace.toneMapped=false;
    LANES.forEach(([x0,x1],li)=>{
      const ln=SHINJUKU_LINES[li%SHINJUKU_LINES.length];
      const cx=(x0+x1+1)/2*T, stex=platformSignTex(li+1, ln), face=new THREE.MeshBasicMaterial({map:stex}); face.toneMapped=false;
      for(const zf of [0.3,0.7]){
        const z=(PLAT_TOP + (PLAT_BOT-PLAT_TOP)*zf)*T;
        const sign=new THREE.Mesh(new THREE.BoxGeometry(T*1.25,0.55,0.12), [psBlank,psBlank,psBlank,psBlank,face,face]);
        sign.position.set(cx, FH-0.55, z); worldRoot.add(sign);
        const pole=new THREE.Mesh(new THREE.BoxGeometry(0.07,0.45,0.07), psBlank);
        pole.position.set(cx, FH-0.27, z); worldRoot.add(pole);
      }
      // 駅名標（ホーム中央に吊り下げ）
      const ez=(PLAT_TOP+(PLAT_BOT-PLAT_TOP)*0.5)*T;
      const eki=new THREE.Mesh(new THREE.BoxGeometry(T*1.5,0.7,0.12), [psBlank,psBlank,psBlank,psBlank,ekiFace,ekiFace]);
      eki.position.set(cx,FH-0.78,ez); worldRoot.add(eki);
      const epole=new THREE.Mesh(new THREE.BoxGeometry(0.08,0.3,0.08), psBlank); epole.position.set(cx,FH-0.35,ez); worldRoot.add(epole);
    });
  }
  function platformSignTex(n, line){   // 日英併記
    const w=340,hh=76,cv=document.createElement("canvas");cv.width=w;cv.height=hh;const g=cv.getContext("2d");
    g.fillStyle="#141a20"; g.fillRect(0,0,w,hh); g.strokeStyle="#3a444d"; g.lineWidth=3; g.strokeRect(3,3,w-6,hh-6);
    g.fillStyle="#"+(line?line.col:0x888888).toString(16).padStart(6,"0"); g.fillRect(10,16,16,44);   // 路線カラーチップ
    g.fillStyle="#fff"; g.textAlign="left"; g.textBaseline="middle"; g.font="bold 30px sans-serif"; g.fillText((line?line.name:n+"番線"),36,28);
    g.fillStyle="#aab"; g.font="bold 16px sans-serif"; g.fillText((line?line.en+"  ":"")+n+"番線 のりば / Platform "+n,36,56);
    const t=new THREE.CanvasTexture(cv); t.anisotropy=4; return t;
  }

    const t=new THREE.CanvasTexture(cv); t.anisotropy=4; return t;

  // ---------- 路線案内サイン（地下1階の各ホーム階段／地上の各出口） ----------

    g.fillStyle="#aeb6bd"; g.textAlign="center"; g.font="bold 16px sans-serif"; g.fillText("階段で地下へ / Stairs to platforms",w/2,hh-20);
    const t=new THREE.CanvasTexture(cv); t.anisotropy=4; return t;

  function buildLineSigns(){
    const blank=new THREE.MeshLambertMaterial({color:0x10151b});
    // 各ホーム連結階段の「上の階(地上1階)側」に「○○線 ▼ホーム」サイン。階段の吹き抜け中央に吊り、壁にめり込まないよう細め
    for(const s of stairs){ if(s.lvl!==1 || s.lane==null) continue;
      const ln=SHINJUKU_LINES[s.lane%SHINJUKU_LINES.length];
      const face=new THREE.MeshBasicMaterial({map:lineSignTex(ln,"ホーム▼","Platform")}); face.toneMapped=false;
      const horiz=(s.axis==="x");                                   // 階段の向きに合わせてサインの面を通路へ
      const geo=horiz? new THREE.BoxGeometry(0.12,0.66,T*0.86) : new THREE.BoxGeometry(T*0.86,0.66,0.12);
      const faces=horiz? [face,face,blank,blank,blank,blank] : [blank,blank,blank,blank,face,face];
      const sign=new THREE.Mesh(geo, faces);
      sign.position.set(s.cx, FH+1.9, s.cz); worldRoot.add(sign);   // 吹き抜けの中央（開いた階段上）に吊る
      const pole=new THREE.Mesh(new THREE.BoxGeometry(0.08,0.5,0.08), blank); pole.position.set(s.cx, FH+2.3, s.cz); worldRoot.add(pole);
    }
    // 地上：各出口の構内側に路線案内ボード（吊り下げ・両面）
    const dirFace=new THREE.MeshBasicMaterial({map:lineDirectoryTex(),side:THREE.DoubleSide}); dirFace.toneMapped=false;
    for(const e of exits){
      const base=(e.level-1)*FH;                                  // 出口のあるフロアの高さ
      const board=new THREE.Mesh(new THREE.PlaneGeometry(1.5,1.9), dirFace);
      board.position.set(e.sx, base+2.7, e.sz); board.lookAt(2*e.sx-e.x, base+2.7, 2*e.sz-e.z); worldRoot.add(board); // 構内側を向く
    }
  }
  // 乗降客：ドアとホームの間を行き来
  function updateBoarders(t){
    for(const b of boarders){
      const s=(Math.sin(t*1.2+b.phase)*0.5+0.5);   // 0..1
      const x=b.doorX+(b.platX-b.doorX)*s;
      b.group.position.set(x, FOOT_LIFT, b.z);
      b.group.rotation.y = (b.platX>b.doorX)? Math.PI/2 : -Math.PI/2;
    }
  }

  function buildWorld(){
    while(worldRoot.children.length) worldRoot.remove(worldRoot.children[0]);
    exits=[]; pedestrians=[]; extraObs={}; outsideObs=[];
    const W=C.COLS*T, D=C.ROWS*T;

    // 1階(地下2階)の床（全面）
    floorTex.repeat.set(W/2.2, D/2.2);
    const floor1=new THREE.Mesh(new THREE.PlaneGeometry(W,D),floorMat);
    floor1.rotation.x=-Math.PI/2; floor1.position.set(W/2,0,D/2); worldRoot.add(floor1);

    // 各階の床スラブは「出口の開口(grids書き換え)」の後に作る（穴が空かないように）→ placeExits の後で実行

    // 最上階(地上)の天井は少し高く
    const GHX=C.GROUND_CEIL_EXTRA, TOPCEIL=FH*NF+GHX;
    ceilTex.repeat.set(C.COLS,C.ROWS);
    const ceil=new THREE.Mesh(new THREE.PlaneGeometry(W,D),ceilMat);
    ceil.rotation.x=Math.PI/2; ceil.position.set(W/2,TOPCEIL+0.04,D/2); worldRoot.add(ceil);
    // 下の各階（最上階以外）にも白めグレーの天井を貼る
    for(let f=1;f<NF;f++) buildFloorCeilings(f);

    // 各階の天井照明。到達距離は「真下のフロアに届かない」値に制限＝下の階の床が光らない（発光防止）
    for(let f=2;f<=NF;f++){
      const isTop=(f===NF), liMax=isTop?14:8;
      const lightY=(isTop?TOPCEIL:f*FH)-0.5;
      const dist=Math.min((isTop?10:7), lightY-(f-2)*FH-1.0); // 下の階の床(=(f-2)*FH)に届く手前で減衰
      let li=0;
      for(let y=2;y<C.ROWS-1;y+=3){ for(let x=2;x<C.COLS-1;x+=3){
        if(li>=liMax) break;
        if(grids[f][y][x]===0 && !stairTileSet.has(x+","+y)){
          const w=tileToWorld(x,y);
          const pl=new THREE.PointLight(isTop?0xfff6ec:0xfff2d8, isTop?0.5:0.45, dist, 2);
          pl.position.set(w.x, lightY, w.z); worldRoot.add(pl); li++;
        }
      }}
    }

    // 出口を先に決める（方角で地上1階/地上2階に振り分け・外周）→ 開口する壁をフロアごとに記録＋gridsを掘る
    const skip={}; for(let f=2;f<=NF;f++) skip[f]=new Set();
    placeExits(skip);

    // 各階の床スラブ（出口の開口後に作る。階段マスは抜く＝吹き抜け）
    for(let f=2;f<=NF;f++){
      for(let y=0;y<C.ROWS;y++)for(let x=0;x<C.COLS;x++){
        if(grids[f][y][x]===0 && !slabOmit[f].has(x+","+y)){
          const w=tileToWorld(x,y);
          const q=new THREE.Mesh(new THREE.PlaneGeometry(T,T),slabMat);
          q.rotation.x=-Math.PI/2; q.position.set(w.x,(f-1)*FH+0.04,w.z); worldRoot.add(q);
        }
      }
    }

    // 壁（地下1階・地上は迷路の壁。出口は最上階だけ開口）
    for(let f=2;f<=NF;f++){
      for(let y=0;y<C.ROWS;y++)for(let x=0;x<C.COLS;x++){
        if(grids[f][y][x]===1){
          if(skip[f].has(x+","+y)) continue;
          if(f===2 && oduHall && (x===oduHall.tCols[0]||x===oduHall.tCols[1]) && y>=PLAT_TOP && y<=PLAT_BOT) continue; // 小田急線の線路は電車で描画
          const w=tileToWorld(x,y), wh=FH+(f===NF?GHX:0);   // 地上は壁も高く
          const seg=new THREE.Mesh(f===NF?wallSegGeoTall:wallSegGeo,wallMat); seg.position.set(w.x,(f-1)*FH+wh/2,w.z); worldRoot.add(seg);
        }
      }
    }
    buildPlatform();   // 地下2階＝プラットホーム
    buildOutsideRings();// 各地上階の外周をつなぐ広場リング（出口どうしが外でつながる）
    buildOdakyuUpper();// 小田急線の地上1階ホーム＋電車
    buildLineSigns();  // 路線案内サイン（地下1階の各ホーム階段／地上の各出口）

    // 階段（段々のステップ＋横の手すり。ライトは付けない）
    const stepMat=new THREE.MeshLambertMaterial({color:0x9aa0a6});
    const railMat=new THREE.MeshLambertMaterial({color:0x6b7178});
    for(const s of stairs){
      const base=(s.lvl-1)*FH;
      const run=s.a1-s.a0, rise=FH, across=s.c1-s.c0, ascX=(s.axis==="x");
      const N=10, tread=run/N, stepH=rise/N, dn=(s.up===-1);  // dn=上端の階段（向き逆）
      // 段々（下から積み上がる箱。up=-1 は逆向きに高くなる）
      for(let i=0;i<N;i++){
        const hgt=(dn?(N-i):(i+1))*stepH, along=s.a0+(i+0.5)*tread;
        const box = ascX ? new THREE.Mesh(new THREE.BoxGeometry(tread,hgt,across), stepMat)
                         : new THREE.Mesh(new THREE.BoxGeometry(across,hgt,tread), stepMat);
        if(ascX) box.position.set(along, base+hgt/2, s.cz);
        else     box.position.set(s.cx, base+hgt/2, along);
        worldRoot.add(box);
      }
      // 横の手すり（両サイドに斜めのバー）
      const len=Math.hypot(run,rise), ang=Math.atan2(rise,run)*(dn?-1:1), midY=base+rise/2+0.95;
      for(const so of [0.18, across-0.18]){
        const rail = ascX ? new THREE.Mesh(new THREE.BoxGeometry(len,0.09,0.09), railMat)
                          : new THREE.Mesh(new THREE.BoxGeometry(0.09,0.09,len), railMat);
        if(ascX){ rail.rotation.z=ang; rail.position.set(s.cx, midY, s.c0+so); }
        else    { rail.rotation.x=-ang; rail.position.set(s.c0+so, midY, s.cz); }
        worldRoot.add(rail);
      }
    }

    // 各階の天井の蛍光灯＋黄色い誘導線＋壁の看板/ポスター
    const stripMat=new THREE.MeshBasicMaterial({color:0xffffff});
    for(let f=1;f<=NF;f++){
      const cy=(f===NF?TOPCEIL:f*FH)-0.06;
      allFloorTiles(f).forEach((t,i)=>{ if(i%2) return;
        if(stairTileSet.has(t.x+","+t.y)) return;   // 階段の上にはライトを付けない
        const w=tileToWorld(t.x,t.y);
        const a=new THREE.Mesh(new THREE.BoxGeometry(T*0.6,0.08,T*0.16),stripMat); a.position.set(w.x,cy,w.z); worldRoot.add(a);
      });
      buildYellowLines(f);
      buildPosters(f);
      if(f===2) buildDeptEntrances(f);   // 地下1階の壁にデパート出入口（装飾・通行不可）
    }
    buildStationVending(skip);   // 地上フロアの壁沿いに自販機（トイレはこの位置を避ける）

    // 追跡者（赤い人型）を指定階に配置。フロアごとの人数を保つ目標値も作る
    chasers=[];
    chaserTargets={}; for(let f=1;f<=NF;f++) chaserTargets[f]=0;
    C.CHASER_FLOORS.forEach(l=>{ chaserTargets[l]=(chaserTargets[l]||0)+1; });

  // 歩行者の役割: 'W'=徘徊 / 'M'=フロア間移動 / 'K'=売店へ出入り / 'E'=出口へ出入り（K,Eは地上のみ）

  // フロー場(BFS)。block=避けたいタイル集合(柱/売店など)を渡すとそこを通らない経路になる
  function bfsField(f,targets,block){
    const dist=Array.from({length:C.ROWS},()=>new Array(C.COLS).fill(-1));
    const step=Array.from({length:C.ROWS},()=>new Array(C.COLS).fill(-1));
    const q=[];
    for(const t of targets){ const x=t[0],y=t[1];
      if(x>=0&&y>=0&&x<C.COLS&&y<C.ROWS&&grids[f][y][x]===0){ dist[y][x]=0; q.push([x,y]); } }
    let i=0;
    while(i<q.length){ const [x,y]=q[i++];
      for(let d=0;d<4;d++){ const nx=x+DIRS4[d][0], ny=y+DIRS4[d][1];
        if(nx<0||ny<0||nx>=C.COLS||ny>=C.ROWS) continue;
        if(grids[f][ny][nx]!==0) continue;                                 // 壁は通さない
        const sk=nx+","+ny;                                                // このフロアに関係する階段の上も通さない
        if(stairTileSet.has(sk) && (stairTileLevel[sk]===f || stairTileLevel[sk]+1===f)) continue;
        if(block && block.has(nx+","+ny)) continue;                       // 柱/売店などの上も通さない
        if(dist[ny][nx]>=0) continue;

        q.push([nx,ny]);

    for(const o of platObstacles){ if(o.r>=1.5) add(1,o.x,o.z); }       // 地下2階の売店など大きいもの

  // flowFields["<floor>_<stairId>"]: そのフロアからその階段へ向かう経路場
  function buildFlowFields(){

                     flowFields["2_"+i]=bfsField(2,[s.entry]); }    // 地下1階→その階段(上り口)
      else if(s.lvl===1){ flowFields["1_"+i]=bfsField(1,[s.entry],obsBlock[1]);  // 地下2階→その階段(上り口)

  function fieldAt(floor,sid,x,z){

  // 現在地から行ける階段のうち、直前に使った階段を除き「距離＋混雑度」が最小のものを選ぶ（渋滞を分散）
  let stairLoad=[];   // 各階段に向かっている+乗っている総数（pickStairの分散用）
  let stairRiders=[]; // 各階段に今“乗っている”人数（混雑キャップ用。乗ると減っていくのでデッドロックしない）
  function pickStair(p){

    for(let i=0;i<stairs.length;i++){ const s=stairs[i];
      if(dir>0 ? s.lvl!==f : s.lvl+1!==f) continue;
      if(s.oneWay!==undefined && s.oneWay!==dir) continue;            // 一方通行：方向の合う階段だけ
      const fl=fieldAt(f,i,p.x,p.z); if(!fl || fl.dist<0) continue;   // ここから到達不能な階段は除外
      const score=fl.dist + (stairLoad[i]||0)*1.5;                    // 混んでいる階段は避ける
      if(score<ad){ ad=score; any=i; }

  // 地上の売店：中央の広場に7か所（階段の近く・出口(外周)の近くには置かない）
  function findGroundKiosks(){
    groundKiosks=[]; kioskFields={};
    const f=NF, g=grids[f];
    const isFloor=(x,y)=> x>=0&&y>=0&&x<C.COLS&&y<C.ROWS && g[y][x]===0 && !stairTileSet.has(x+","+y);
    const open=Array.from({length:C.ROWS},()=>new Array(C.COLS).fill(false));
    for(let y=0;y<C.ROWS-1;y++)for(let x=0;x<C.COLS-1;x++){
      if(isFloor(x,y)&&isFloor(x+1,y)&&isFloor(x,y+1)&&isFloor(x+1,y+1)){
        open[y][x]=open[y][x+1]=open[y+1][x]=open[y+1][x+1]=true; } }
    const cxC=(C.COLS-1)/2, cyC=(C.ROWS-1)/2;          // マップ中央
    const margin=5;                                    // 外周(出口)からこれだけ離す
    const stairClear=5;                                // 階段からこれだけ離す（タイル）

    const cand=[];

      if(!okS) continue;

    cand.sort((a,b)=>a.dc-b.dc);                        // 中央に近い順

        if(groundKiosks.some(k=>Math.abs(k.tx-c.x)+Math.abs(k.ty-c.y)<gap)) continue;

  // 現在地から到達できる売店のうち最寄りを選ぶ
  function pickKiosk(p){

    for(let i=0;i<groundKiosks.length;i++){ const ff=kioskFields[i]; if(!ff)continue;
      const d=ff.dist[ty][tx]; if(d<0)continue; if(d<bd){bd=d;best=i;} }
    return best;
  }
  // 売店へ向かい、着いたら一定時間「出入り(滞在)」してから徘徊に戻る

    } else { pedMoveDir(p, k.x-p.x, k.z-p.z, dt, false); }

  // プレイヤーが階段口に近づくと、接続先フロア側の階段付近も「先に」3D表示するためのアンカー
  let stairAnchors=[];

  function buildPedInstances(){
    const n=pedestrians.length;
    pedTorsoInsts={}; pedBillInsts={};
    if(!n){ pedLegsInst=pedHeadInst=null; return; }
    ensureBillAssets();
    pedLegsInst=new THREE.InstancedMesh(legGeo, legMat, n);
    pedHeadInst=new THREE.InstancedMesh(headGeo, headMat, n);
    pedLegsInst.frustumCulled=false; pedHeadInst.frustumCulled=false;
    worldRoot.add(pedLegsInst, pedHeadInst);
    const counts={};
    pedestrians.forEach(p=>{ counts[p.ci]=(counts[p.ci]||0)+1; });   // 服色ごとの最大数（=3D胴/ビルボードの容量）
    for(const ci in counts){
      const im=new THREE.InstancedMesh(torsoGeo, new THREE.MeshLambertMaterial({color:clothColors[ci]}), counts[ci]); im.frustumCulled=false; pedTorsoInsts[ci]=im;
      const bm=new THREE.InstancedMesh(billGeo, pedBillMats[ci], counts[ci]); bm.frustumCulled=false; pedBillInsts[ci]=bm;   // 遠距離用ビルボード（同容量）
    }
    for(const ci in pedTorsoInsts) worldRoot.add(pedTorsoInsts[ci]);
    for(const ci in pedBillInsts) worldRoot.add(pedBillInsts[ci]);
    // 描画スロットは毎フレーム動的に割り当てる（近=3D / 遠=ビルボード）。固定の p.gi/p.ti は使わない
  }

  // 指定フロアの、既存湧きから離れた湧き位置（ワールド座標）
  function spawnOnFloor(f, used){
    let tiles=allFloorTiles(f).filter(t=>!stairTileSet.has(t.x+","+t.y));
    for(let i=tiles.length-1;i>0;i--){const j=(Math.random()*(i+1))|0;[tiles[i],tiles[j]]=[tiles[j],tiles[i]];}
    let pick=tiles[0]||{x:1,y:1};
    for(const t of tiles){ if(!used.some(u=>u.f===f&&Math.abs(u.x-t.x)+Math.abs(u.y-t.y)<5)){pick=t;break;} }
    used.push({f,x:pick.x,y:pick.y});
    return tileToWorld(pick.x,pick.y);
  }
  // 指定ホーム(lane)上のランダム位置（地下2階の敵をプレイヤーと同じホームに置く用）
  function spawnOnLane(idx){
    const [x0,x1]=LANES[idx]; const xc=x0+1; const tiles=[];
    for(let y=PLAT_TOP;y<=PLAT_BOT;y++) for(let x=x0;x<=x1;x++)
      if(grids[1][y][x]===0 && !stairTileSet.has(x+","+y) && !(x===xc&&OBJ_ROWS.includes(y))) tiles.push({x,y});
    const t=tiles.length?tiles[(Math.random()*tiles.length)|0]:{x:x0,y:PLAT_TOP};
    return tileToWorld(t.x,t.y);
  }

  // 出口（最上階・外周）
  // 出口（外周）。方角で階を振り分け：南・南西・南東＝地上2階(最上階NF)、それ以外＝地上1階(level2)
  function placeExits(skip){
    const cx=(C.COLS-1)/2, cy=(C.ROWS-1)/2;
    const exitFloorOf=(tx,ty)=>{ const ang=Math.atan2(tx-cx, -(ty-cy))*180/Math.PI;  // 0=北,+東,±180=南,-西
      return (Math.abs(ang)>=112.5) ? NF : 2; };                                       // 南グループ=地上2階, それ以外=地上1階
    const cand=[];
    for(const f of [2,NF]){
      for(let y=0;y<C.ROWS;y++)for(let x=0;x<C.COLS;x++){
        if(grids[f][y][x]!==0 || stairTileSet.has(x+","+y)) continue;
        let ox=0,oy=0,bx=0,by=0;
        if(x===1){ox=-1;bx=0;by=y;} else if(x===C.COLS-2){ox=1;bx=C.COLS-1;by=y;}
        else if(y===1){oy=-1;bx=x;by=0;} else if(y===C.ROWS-2){oy=1;bx=x;by=C.ROWS-1;}
        else continue;
        if(exitFloorOf(x,y)!==f) continue;            // その方角を担当するフロアの外周のみ候補に
        cand.push({tx:x,ty:y,ox,oy,bx,by,f});
      }
    }
    shuffle(cand);
    const chosen=[];
    for(let gap=4; gap>=1 && chosen.length<C.EXIT_COUNT; gap--){
      for(const c of cand){
        if(chosen.length>=C.EXIT_COUNT) break;
        if(chosen.includes(c)) continue;
        if(chosen.some(p=>Math.abs(p.tx-c.tx)+Math.abs(p.ty-c.ty)<gap)) continue;
        chosen.push(c);
      }
    }
    const perimIdx=c=> c.oy<0 ? c.tx : (c.ox>0 ? C.COLS+c.ty : (c.oy>0 ? C.COLS+C.ROWS+(C.COLS-c.tx) : 2*C.COLS+C.ROWS+(C.ROWS-c.ty)));
    chosen.sort((a,b)=>perimIdx(a)-perimIdx(b));
    // 出口名は番号ではなく方角（東西南北）。同方角が複数なら連番を付与
    const DJA=["北","北東","東","南東","南","南西","西","北西"], DEN=["North","Northeast","East","Southeast","South","Southwest","West","Northwest"];
    const dir8=c=>{ const a=Math.atan2(c.tx-cx,-(c.ty-cy))*180/Math.PI; return ((Math.round(a/45)%8)+8)%8; };
    const dcount={}; chosen.forEach(c=>{ const d=dir8(c); dcount[d]=(dcount[d]||0)+1; }); const dseen={};
    chosen.forEach((c,idx)=>{
      const no=idx+1, ef=c.f, base=(ef-1)*FH;
      const di=dir8(c); dseen[di]=(dseen[di]||0)+1; const suf=(dcount[di]>1)?String(dseen[di]):"";
      const dirName=DJA[di]+"口"+suf, dirEn=DEN[di]+" Exit"+(suf?" "+suf:""), dshort=DJA[di]+suf;  // 例：北口 / 南東口2
      const wide=(no===3||no===5);          // 横幅5倍の改札出口
      const mid=(no===8);                   // 少し大きめ(3マス幅)
      const half=wide?2:(mid?1:0);
      const perpx=(c.ox===0)?1:0, perpy=(c.oy===0)?1:0;
      const w=tileToWorld(c.tx,c.ty);
      const mx=w.x+c.ox*T*0.5, mz=w.z+c.oy*T*0.5;
      const signTex=new THREE.MeshBasicMaterial({map:exitSignTextureV(dirName,dirEn),side:THREE.DoubleSide});
      for(let k=-half;k<=half;k++){
        const bx=c.bx+k*perpx, by=c.by+k*perpy;
        if(bx>=0&&by>=0&&bx<C.COLS&&by<C.ROWS){ skip[ef].add(bx+","+by); grids[ef][by][bx]=0; } // 壁を開口＝床にして通り抜け可能に
        if(wide||mid){
          const ix=c.tx+k*perpx, iy=c.ty+k*perpy;
          if(inInner(ix,iy)&&!stairTileSet.has(ix+","+iy)) grids[ef][iy][ix]=0;
          const jx=ix-c.ox, jy=iy-c.oy;     // 一つ内側も開けて改札前の広場に
          if(inInner(jx,jy)&&!stairTileSet.has(jx+","+jy)) grids[ef][jy][jx]=0;
        }
      }
      const ph1=base+FH*0.78, sw=wide?T*1.8:(mid?T*1.3:T*0.9);
      const sign1=new THREE.Mesh(new THREE.PlaneGeometry(sw,T*0.7), signTex);
      sign1.position.set(mx-c.ox*0.15, ph1, mz-c.oy*0.15); sign1.lookAt(w.x, ph1, w.z); worldRoot.add(sign1);
      const leftx=c.oy, leftz=-c.ox, ph2=base+1.7, sideOff=wide?T*2.4:(mid?T*1.3:T*0.7);
      const sxp=mx + c.ox*T*0.45 + leftx*sideOff, szp=mz + c.oy*T*0.45 + leftz*sideOff;
      const sign2=new THREE.Mesh(new THREE.PlaneGeometry(T*0.34,T*0.7), signTex);
      sign2.position.set(sxp, ph2, szp); sign2.lookAt(w.x, ph2, w.z); worldRoot.add(sign2);
      const post=new THREE.Mesh(new THREE.BoxGeometry(0.1, ph2-base, 0.1), new THREE.MeshLambertMaterial({color:0x8b9197}));
      post.position.set(sxp, base+(ph2-base)/2, szp); worldRoot.add(post);
      buildOutsidePlaza(mx,mz,c.ox,c.oy,base, wide?T*4.6:(mid?T*2.2:T*0.85));   // 出口の外＝広場
      // 改札（ターンスタイル）：開口幅を細かく区切って改札機を多く並べる。各レーンは人1.5人分(約3.3)
      const owid=(2*half+1)*T, GLW=3.5, ng=Math.max(1,Math.round(owid/GLW));   // レーン数
      const gateMat=new THREE.MeshLambertMaterial({color:0x42505c});
      const gleam=new THREE.MeshBasicMaterial({color:0x16c0b0}); gleam.toneMapped=false;
      for(let k=0;k<=ng;k++){
        const off=(k/ng-0.5)*owid, gx=mx+perpx*off, gz=mz+perpy*off;
        const gm=new THREE.Mesh(new THREE.BoxGeometry(perpx?0.38:1.5,1.05,perpy?0.38:1.5), gateMat);
        gm.position.set(gx, base+0.55, gz); worldRoot.add(gm);
        const bar=new THREE.Mesh(new THREE.BoxGeometry(perpx?0.42:0.16,0.12,perpy?0.42:0.16), gleam);
        bar.position.set(gx, base+1.05, gz); worldRoot.add(bar);
        addObs(ef, gx, gz, 0.22);   // 改札機は通り抜け不可（レーンの間を通る。見た目より広く塞がない）
      }
      // 通り抜け可能な広場の範囲（プレイヤー・通行人が出入りできる外のスペース）。owidは改札と共通(開口幅)
      const dep=T*3.0;
      let plaza;
      if(c.ox!==0){ const a0=mx - c.ox*T*0.6, a1=mx + c.ox*dep;
        plaza={minX:Math.min(a0,a1), maxX:Math.max(a0,a1), minZ:w.z-owid/2, maxZ:w.z+owid/2, level:ef}; }
      else { const a0=mz - c.oy*T*0.6, a1=mz + c.oy*dep;
        plaza={minX:w.x-owid/2, maxX:w.x+owid/2, minZ:Math.min(a0,a1), maxZ:Math.max(a0,a1), level:ef}; }
      const inner=tileToWorld(c.tx,c.ty);   // 出口の構内側の床（人の出入り口）
      exits.push({no, dirName, dirEn, dshort, tx:c.tx, ty:c.ty, x:mx, z:mz, sx:inner.x, sz:inner.z, level:ef, wide, mid, plaza, ox:c.ox, oy:c.oy});
    });
    correctExitNo=(C.CORRECT_EXIT && exits.some(e=>e.no===C.CORRECT_EXIT))
      ? C.CORRECT_EXIT : (exits.length?exits[(Math.random()*exits.length)|0].no:1);
  }

  // 出口の外＝地上の広場（フラットに広がる。階段なし）
  function buildOutsidePlaza(mx,mz,ox,oy,base,pw){
    // 改札前の短いエプロン（建物フロアの高さ）。その先は外周の坂(buildOutsideRings)＋遠景(buildOutsideScenery)が受け持つ
    pw=pw||T*0.85;
    const len=T*2.6, pwz=pw+T*3;
    const geo=ox!==0? new THREE.PlaneGeometry(len,pwz) : new THREE.PlaneGeometry(pwz,len);
    const floor=new THREE.Mesh(geo, plazaMat);
    floor.rotation.x=-Math.PI/2; floor.position.set(mx+ox*len/2, base+0.02, mz+oy*len/2); worldRoot.add(floor);
  }
  // 駅の外周を「南=地上2階 / 北=地上1階」のなだらかな坂でぐるりとつなぐ（出口どうしが外で連続）
  function buildOutsideRings(){
    const W=C.COLS*T, D=C.ROWS*T, R=C.OUTSIDE_RING, slope=Math.atan(FH/D);
    const flat=(x0,x1,z0,z1,y)=>{ const m=new THREE.Mesh(new THREE.PlaneGeometry(x1-x0,z1-z0), plazaMat); m.rotation.x=-Math.PI/2; m.position.set((x0+x1)/2,y+0.012,(z0+z1)/2); worldRoot.add(m); };
    flat(-R,W+R,-R,0,FH);            // 北の端＝地上1階(FH)
    flat(-R,W+R,D,D+R,2*FH);         // 南の端＝地上2階(2FH)
    const ramp=(xc,wx)=>{ const m=new THREE.Mesh(new THREE.PlaneGeometry(wx,D), plazaMat); m.rotation.x=-Math.PI/2-slope; m.position.set(xc,1.5*FH+0.012,D/2); worldRoot.add(m); };
    ramp(-R/2,R); ramp(W+R/2,R);     // 東西の坂（z=0でFH, z=Dで2FH）
    buildOutsideScenery(W,D,R);
  }
  let _cityMats=null;
  function cityWallTex(base){
    const w=64,h=128,cv=document.createElement("canvas");cv.width=w;cv.height=h;const g=cv.getContext("2d");
    g.fillStyle=base; g.fillRect(0,0,w,h);
    for(let yy=7; yy<h-7; yy+=12) for(let xx=6; xx<w-8; xx+=13){
      g.fillStyle=(Math.random()<0.55)?"#cfe0f2":"#5c6773"; g.fillRect(xx,yy,9,8);   // 窓（明/暗）
    }
    const t=new THREE.CanvasTexture(cv); t.anisotropy=2; return t;
  }
  // 駅の外＝周囲の街（ビル群・街灯・植栽）と遠景の空。外周の坂(outsideY)に合わせて配置
  function buildOutsideScenery(W,D,R){
    if(!_cityMats) _cityMats=["#8f9aa6","#7a8794","#9aa6b0","#6f7c89","#aab3bb"].map(c=>{
      const m=new THREE.MeshBasicMaterial({map:cityWallTex(c)}); m.fog=false; m.toneMapped=false; return m; });
    const RS=R+46, skyM=skyMat, sh=T*20;
    const sky=(cx,cz,sx,sz)=>{ const m=new THREE.Mesh(new THREE.BoxGeometry(sx,sh,sz),skyM); m.position.set(cx,outsideY(cz)+sh/2-FH*0.7,cz); worldRoot.add(m); };
    sky(-RS,D/2,1,D+2*RS); sky(W+RS,D/2,1,D+2*RS); sky(W/2,-RS,W+2*RS,1); sky(W/2,D+RS,W+2*RS,1);
    // 共有マテリアル
    const roofM=new THREE.MeshLambertMaterial({color:0x565e66}), tankM=new THREE.MeshLambertMaterial({color:0x8b7a63});
    const acM=new THREE.MeshLambertMaterial({color:0x9aa2aa}), parapetM=new THREE.MeshLambertMaterial({color:0x6d757d});
    // ビル群：4辺の外側の帯に並べる（足元は坂の高さに合わせる。屋上に水タンク/室外機/パラペット）
    const bldg=(cx,cz,wx,wz)=>{ const gy=outsideY(cz), h=16+Math.random()*46, m=_cityMats[(Math.random()*_cityMats.length)|0];
      const b=new THREE.Mesh(new THREE.BoxGeometry(wx,h,wz),m); b.position.set(cx,gy+h/2,cz); worldRoot.add(b);
      const par=new THREE.Mesh(new THREE.BoxGeometry(wx*1.02,0.8,wz*1.02),parapetM); par.position.set(cx,gy+h+0.4,cz); worldRoot.add(par); // パラペット
      if(Math.random()<0.6){ const tk=new THREE.Mesh(new THREE.CylinderGeometry(wx*0.16,wx*0.16,2.4,10),tankM); tk.position.set(cx-wx*0.2,gy+h+2,cz+wz*0.15); worldRoot.add(tk); } // 高架水槽
      const nac=1+(Math.random()*2|0); for(let k=0;k<nac;k++){ const ac=new THREE.Mesh(new THREE.BoxGeometry(wx*0.22,0.9,wz*0.22),acM);
        ac.position.set(cx+(Math.random()-0.5)*wx*0.5,gy+h+1.25,cz+(Math.random()-0.5)*wz*0.5); worldRoot.add(ac); }
      if(Math.random()<0.35){ const rf=new THREE.Mesh(new THREE.BoxGeometry(0.5,3+Math.random()*3,0.5),roofM); rf.position.set(cx+wx*0.3,gy+h+2.5,cz-wz*0.3); worldRoot.add(rf); } }; // アンテナ
    const rowH=(x0,x1,zc,depth)=>{ for(let x=x0; x<x1; x+= 12+Math.random()*8){ const wx=9+Math.random()*7; bldg(x+wx/2, zc+(Math.random()-0.5)*8, wx, depth+Math.random()*5); } };
    const rowV=(z0,z1,xc,depth)=>{ for(let z=z0; z<z1; z+= 12+Math.random()*8){ const wz=9+Math.random()*7; bldg(xc+(Math.random()-0.5)*8, z+wz/2, depth+Math.random()*5, wz); } };
    rowH(-R, W+R, -(R+18), 12); rowH(-R, W+R, D+R+18, 12);    // 北・南
    rowV(-R, D+R, -(R+18), 12); rowV(-R, D+R, W+R+18, 12);    // 西・東
    // ---- 街路の小物（外周の坂の縁に。高さは坂に追従） ----
    const poleM=new THREE.MeshLambertMaterial({color:0x5a626b}), armM=new THREE.MeshLambertMaterial({color:0x474e56});
    const lampM=new THREE.MeshBasicMaterial({color:0xfff2c4}); lampM.toneMapped=false;
    const trunkM=new THREE.MeshLambertMaterial({color:0x6a4a32});
    const leafMs=[0x2f7a3e,0x3f8a48,0x357f42].map(c=>new THREE.MeshLambertMaterial({color:c}));
    const benchWoodM=new THREE.MeshLambertMaterial({color:0x9c6b3f}), benchLegM=new THREE.MeshLambertMaterial({color:0x3d444b});
    const planterM=new THREE.MeshLambertMaterial({color:0x7c8088}), hedgeM=new THREE.MeshLambertMaterial({color:0x3f7d46});
    const bollardM=new THREE.MeshLambertMaterial({color:0xb9422e}), bollardTopM=new THREE.MeshBasicMaterial({color:0xf2f2f2}); bollardTopM.toneMapped=false;
    // 出口の広場（改札からの動線）には何も置かない＝クリアまでの道を塞がない
    const inPlaza=(x,z,m)=>{ for(const e of exits){ const p=e.plaza; if(!p) continue;
      if(x>=p.minX-m && x<=p.maxX+m && z>=p.minZ-m && z<=p.maxZ+m) return true; } return false; };
    // 街灯（ポール＋アーム＋ランプヘッド＋グロー）
    const lamp=(x,z)=>{ if(inPlaza(x,z,1.6)) return; const gy=outsideY(z); const p=new THREE.Mesh(new THREE.CylinderGeometry(0.13,0.18,5.2,8),poleM); p.position.set(x,gy+2.6,z); worldRoot.add(p);
      const arm=new THREE.Mesh(new THREE.BoxGeometry(1.1,0.12,0.12),armM); arm.position.set(x+0.5,gy+5.0,z); worldRoot.add(arm);
      const head=new THREE.Mesh(new THREE.BoxGeometry(0.7,0.28,0.42),armM); head.position.set(x+1.0,gy+4.86,z); worldRoot.add(head);
      const l=new THREE.Mesh(new THREE.PlaneGeometry(0.6,0.34),lampM); l.rotation.x=-Math.PI/2; l.position.set(x+1.0,gy+4.71,z); worldRoot.add(l);
      outsideObs.push({x,z,r:0.24}); };
    // 街路樹（幹＋2段の葉）
    const tree=(x,z)=>{ if(inPlaza(x,z,1.6)) return; const gy=outsideY(z), th=2.6+Math.random()*1.4;
      const tr=new THREE.Mesh(new THREE.CylinderGeometry(0.22,0.32,th,7),trunkM); tr.position.set(x,gy+th/2,z); worldRoot.add(tr);
      const lm=leafMs[(Math.random()*leafMs.length)|0];
      const c1=new THREE.Mesh(new THREE.SphereGeometry(1.5+Math.random()*0.4,8,7),lm); c1.position.set(x,gy+th+0.7,z); c1.scale.y=0.85; worldRoot.add(c1);
      const c2=new THREE.Mesh(new THREE.SphereGeometry(1.1+Math.random()*0.3,8,7),lm); c2.position.set(x+(Math.random()-0.5)*0.8,gy+th+1.7,z+(Math.random()-0.5)*0.8); worldRoot.add(c2);
      outsideObs.push({x,z,r:0.38}); };
    // ベンチ（座面＋背もたれ＋脚）
    const bench=(x,z,rot)=>{ if(inPlaza(x,z,1.6)) return; const gy=outsideY(z), g2=new THREE.Group();
      const seat=new THREE.Mesh(new THREE.BoxGeometry(2.0,0.14,0.6),benchWoodM); seat.position.y=0.55; g2.add(seat);
      const back=new THREE.Mesh(new THREE.BoxGeometry(2.0,0.5,0.12),benchWoodM); back.position.set(0,0.85,-0.24); g2.add(back);
      for(const sx of [-0.85,0.85]){ const lg=new THREE.Mesh(new THREE.BoxGeometry(0.12,0.55,0.5),benchLegM); lg.position.set(sx,0.27,0); g2.add(lg); }
      g2.position.set(x,gy,z); g2.rotation.y=rot; worldRoot.add(g2);
      outsideObs.push({x,z,r:1.0}); };
    // 植込み（縁石ボックス＋緑）
    const planter=(x,z)=>{ if(inPlaza(x,z,1.6)) return; const gy=outsideY(z); const box=new THREE.Mesh(new THREE.BoxGeometry(2.4,0.5,1.0),planterM); box.position.set(x,gy+0.25,z); worldRoot.add(box);
      const h=new THREE.Mesh(new THREE.BoxGeometry(2.2,0.5,0.8),hedgeM); h.position.set(x,gy+0.7,z); worldRoot.add(h);
      outsideObs.push({x:x-0.75,z,r:0.65},{x:x+0.75,z,r:0.65}); };
    // ボラード（車止め）
    const bollard=(x,z)=>{ if(inPlaza(x,z,1.2)) return; const gy=outsideY(z); const b=new THREE.Mesh(new THREE.CylinderGeometry(0.13,0.13,0.9,8),bollardM); b.position.set(x,gy+0.45,z); worldRoot.add(b);
      const cap=new THREE.Mesh(new THREE.CylinderGeometry(0.14,0.14,0.1,8),bollardTopM); cap.position.set(x,gy+0.9,z); worldRoot.add(cap);
      outsideObs.push({x,z,r:0.18}); };
    const er=R*0.45;
    for(let x=4; x<W; x+=13){ lamp(x,-er); lamp(x,D+er);
