  // プレイヤー周囲の通行人の密度（人混みで遅くなる＝動きにくいが、止まりはしない。少人数なら減速なし）
  function updatePlayer(dt){
    camera.rotation.set(player.pitch,player.yaw,0);
    camera.getWorldDirection(fwd); fwd.y=0; fwd.normalize(); right.crossVectors(fwd,up).normalize();
    wMash=Math.max(0, wMash-dt*3.0); if(lostT>0) lostT-=dt;   // W連打メーターの減衰（毎秒3回より速く連打で発動）
    const mashing = wMash>=1.8;                              // 連打中＝ダッシュ意思
    crouching = (keys["c"]||keys["control"]) && !carrying;   // 連れている間はしゃがめない
    // ダッシュ・スタミナ（ゲージ制）：残量ぶんだけ走れる。途中でやめても残りは0にならず保持され、
    // 走っていない間にそこから徐々に回復する（例：満タン10秒で3秒走って歩きに戻れば、残り7秒はすぐ使える）
    const wantDash = mashing && !carrying && !crouching;
    if(dashActive){ if(!wantDash || dashStam<=0) dashActive=false; }        // やめる/使い切り→残量は保持
    else if(wantDash && dashStam>=C.DASH_MIN_START) dashActive=true;        // 残量が少なすぎる時だけ始動不可（点滅防止）
    if(dashActive) dashStam=Math.max(0, dashStam-dt);                       // ダッシュ中は消費
    else dashStam=Math.min(C.DASH_DUR, dashStam + dt*C.DASH_DUR/C.DASH_FULL_AT);   // それ以外は徐々に回復
    const dashing = dashActive; isDashing=dashing;
    let spd;
    if(crouching) spd=C.CROUCH_SPEED;
    else if(carrying){
      if(mashing){ dropDrunk(); spd=C.MOVE_SPEED; }          // 連れて連打→手が離れて通常速度に
      else spd=C.WALK_SPEED;                                 // 連れて歩き＝はぐれない
    } else spd = dashing ? C.DASH_SPEED : C.MOVE_SPEED;      // 手ぶら：ダッシュ中=8.0 / それ以外=通常
    let mf=0,ms=0;
    if(keys["w"]||keys["arrowup"]||mashing)mf+=1; if(keys["s"]||keys["arrowdown"])mf-=1;  // 連打中は前進継続
    if(keys["d"]||keys["arrowright"])ms+=1; if(keys["a"]||keys["arrowleft"])ms-=1;
    const px0=player.x, pz0=player.z;
    let vx=fwd.x*mf+right.x*ms, vz=fwd.z*mf+right.z*ms; const len=Math.hypot(vx,vz);
    if(len>0){ vx=vx/len*spd*dt; vz=vz/len*spd*dt;
      // 高さの瞬間ジャンプ防止：階段のランプへ横から乗る/途中から飛び降りる移動はブロック
      const can=(X,Z)=> playerCanStand(X,Z) && Math.abs(standYAt(X,Z)-player.y) <= 1.1;
      let moved=false;
      if(can(player.x+vx,player.z)){ player.x+=vx; moved=true; }
      if(can(player.x,player.z+vz)){ player.z+=vz; moved=true; }
      if(!moved){   // くさび詰まり対策：45°の横滑りを試す＝柱/改札機/売店の角や人混みの間でも必ず抜けられる
        const ca=0.70710678, sa=0.70710678;
        for(const sgn of [1,-1]){
          const rx=vx*ca - sgn*vz*sa, rz=sgn*vx*sa + vz*ca;
          if(can(player.x+rx,player.z+rz)){ player.x+=rx; player.z+=rz; break; }
        }
      }
    }
    if(player.x!==px0 || player.z!==pz0){ stepAcc+=dt; const stepInt=carrying?stepNext:(dashing?0.20:0.42);   // 連れている間はランダム／ダッシュ中は速い足音
      if(stepAcc>=stepInt){ stepAcc=0; sfxStep(); stepNext=0.12+Math.random()*0.28; } }
    const si=stairInfo(player.x,player.z,player.level);
    if(si){ player.y=si.y; player.level=si.t>=0.5?si.lvl+1:si.lvl; }
    else {
      const pe=anyExitPlaza(player.x,player.z);
      if(pe){ // 改札前の広場：建物フロア(ゲート)↔外周の坂をなめらかにつなぐ
        player.level=pe.level;
        const fb=(pe.level-1)*FH, outward=(player.x-pe.x)*pe.ox+(player.z-pe.z)*pe.oy;
        const tt=Math.max(0,Math.min(1, outward/(T*2.5)));
        player.y = fb*(1-tt) + outsideY(player.z)*tt;
      } else if(inOutsideRing(player.x,player.z,2)){ // 外周の坂（南=地上2階 / 北=地上1階）
        player.y = outsideY(player.z);
        player.level = (player.y>=1.5*FH)?NF:2;
      } else { player.y=(player.level-1)*FH; }
    }
    if(player.level!==player.plevel){ player.plevel=player.level;
      // 屋外（広場/外周の坂）でのレベル切替は「坂の途中の区分け」なので音を鳴らさない（出口前を横切るたびに鳴るのを防ぐ）
      if(!anyExitPlaza(player.x,player.z) && !inOutsideRing(player.x,player.z,2)) sfxFloor(); }   // 階移動の音
    camera.position.set(player.x, player.y+(crouching?C.CROUCH_EYE:C.EYE_HEIGHT), player.z);
  }

  function entCanStand(x,z,r,f){ return canStand(x,z,r,f) && !obstacleHit(x,z,0.3,f); }
  function moveToward(ent,tx,tz,speed,dt,r){
    const f=ent.level;
    // 万一障害物の内側/縁に居る場合は移動を許可（湧き/ワープが重なっても縁のデッドバンドで固まらない）
    const inside=obstacleHit(ent.x,ent.z,0.3,f);
    // 高さの瞬間ジャンプ防止：階段の途中へ横から乗る/降りる移動は不可（端から正しく上り下りする）
    const okY=(X,Z)=>{ if(ent.y===undefined) return true;
      const si=stairInfo(X,Z,f); return Math.abs((si?si.y:(f-1)*FH)-ent.y) <= 1.1; };
    const ok=(X,Z)=> canStand(X,Z,r,f) && (inside || !obstacleHit(X,Z,0.3,f)) && okY(X,Z);
    let dx=tx-ent.x, dz=tz-ent.z; const len=Math.hypot(dx,dz);
    if(len>0.001){ dx=dx/len*speed*dt; dz=dz/len*speed*dt;
      const bx=ent.x,bz=ent.z;
      if(ok(ent.x+dx,ent.z)) ent.x+=dx;
      if(ok(ent.x,ent.z+dz)) ent.z+=dz;
      if(ent.x===bx&&ent.z===bz){
        const alt=Math.abs(dx)>Math.abs(dz)?[[0,speed*dt],[0,-speed*dt]]:[[speed*dt,0],[-speed*dt,0]];
        for(const [ax,az] of alt){ if(ok(ent.x+ax,ent.z+az)){ent.x+=ax;ent.z+=az;break;} }
      }
    }
  }

  // 巡回の目標（遠い到達可能タイル）を選び、そこへ向かう経路場を作る＝フロアを大きく巡回
  function newPatrolTarget(chaser){
    const f=chaser.level, tx=Math.floor(chaser.x/T), ty=Math.floor(chaser.z/T), blk=obsBlock[f];
    if(tx<0||ty<0||tx>=C.COLS||ty>=C.ROWS) return;
    const fromEnemy=bfsField(f,[[tx,ty]],blk);          // 敵からの距離（売店などは避ける）
    let far=[];
    for(let y=0;y<C.ROWS;y++)for(let x=0;x<C.COLS;x++){ if(fromEnemy.dist[y][x]>=12) far.push([x,y]); }
    if(!far.length){ for(let y=0;y<C.ROWS;y++)for(let x=0;x<C.COLS;x++){ if(fromEnemy.dist[y][x]>=2) far.push([x,y]); } }
    if(!far.length) return;
    const t=far[(Math.random()*far.length)|0];
    chaser.patField=bfsField(f,[[t[0],t[1]]],blk); chaser.patReached=false;
  }
  function patrolStep(chaser, dt){
    if(!chaser.patField || chaser.patReached){ newPatrolTarget(chaser); }
    const ff=chaser.patField;
    const tx=Math.floor(chaser.x/T), ty=Math.floor(chaser.z/T);
    const d=(ff && tx>=0&&ty>=0&&tx<C.COLS&&ty<C.ROWS)? ff.dist[ty][tx] : -1;
    if(ff && d>=0 && d<=1){ chaser.patReached=true; return; }                    // 到着→次の巡回先
    if(ff && d>=0 && ff.step[ty][tx]>=0){ const dd=DIRS4[ff.step[ty][tx]], tw=tileToWorld(tx+dd[0],ty+dd[1]);
      moveToward(chaser, tw.x, tw.z, C.CHASER_WANDER, dt, CHASER_R); }
    else { // 経路場が無い/外れた→ランダム方向に歩いて次の目標を引く（絶対に止まらない）
      if(chaser.dir==null) chaser.dir=Math.random()*6.28;
      moveToward(chaser, chaser.x+Math.cos(chaser.dir)*4, chaser.z+Math.sin(chaser.dir)*4, C.CHASER_WANDER, dt, CHASER_R);
      chaser.patReached=true;
    }
  }
  // フロア間移動（巡回先ではなく階段へ向かい渡る）
  function enemyStair(x,z,f,dir){
    let best=-1,bd=1e9, tx=Math.floor(x/T),ty=Math.floor(z/T);
    if(tx<0||ty<0||tx>=C.COLS||ty>=C.ROWS) return -1;
    for(let i=0;i<stairs.length;i++){ const s=stairs[i];
      if(dir>0? s.lvl!==f : s.lvl+1!==f) continue;
      const ff=flowFields[f+"_"+i]; if(!ff) continue;
      const dd=ff.dist[ty][tx]; if(dd<0) continue;
      if(dd<bd){ bd=dd; best=i; } }
    return best;
  }
  function enemyTransitStep(chaser, dt){
    const t=chaser.transit; t.t=(t.t||0)+dt;
    if(t.t>30){ // 安全策：万一渡れず詰まったら目的フロアへワープして到着扱い（人数を必ず保つ）
      let tiles=allFloorTiles(t.goal).filter(q=>{ if(stairTileSet.has(q.x+","+q.y)) return false;
        const w=tileToWorld(q.x,q.y); return !obstacleHit(w.x,w.z,0.4,t.goal); });   // 店舗/トイレの上には出さない
      if(!tiles.length) tiles=allFloorTiles(t.goal).filter(q=>!stairTileSet.has(q.x+","+q.y));
      if(tiles.length){ const q=tiles[(Math.random()*tiles.length)|0], w=tileToWorld(q.x,q.y); chaser.x=w.x; chaser.z=w.z; chaser.level=t.goal; }
      return;
    }
    const s=stairs[t.sid], ff=flowFields[chaser.level+"_"+t.sid];
    const tx=Math.floor(chaser.x/T), ty=Math.floor(chaser.z/T);
    const fd=(ff && tx>=0&&ty>=0&&tx<C.COLS&&ty<C.ROWS)? ff.dist[ty][tx] : -2;
    if(isStairTileAt(chaser.x,chaser.z,chaser.level) || (fd>=0 && fd<=1)){   // 階段口/階段上→渡る
      const dest=t.dir>0? s.exit : s.entry, dw=tileToWorld(dest[0],dest[1]);
      moveToward(chaser, dw.x, dw.z, C.CHASER_WANDER, dt, CHASER_R);
    } else if(ff && fd>=0 && ff.step[ty][tx]>=0){
      const dd=DIRS4[ff.step[ty][tx]], tw=tileToWorld(tx+dd[0],ty+dd[1]);
      moveToward(chaser, tw.x, tw.z, C.CHASER_WANDER, dt, CHASER_R);
    } else {                                                    // 経路が見つからない→階段を選び直す/中心へ
      const si=enemyStair(chaser.x,chaser.z,chaser.level,t.dir);
      if(si>=0 && si!==t.sid){ t.sid=si; } else { moveToward(chaser, s.cx, s.cz, C.CHASER_WANDER, dt, CHASER_R); }
    }
  }
  function startTransit(c, dir){
    const goal=c.level+dir, sid=enemyStair(c.x,c.z,c.level,dir);
    if(sid<0){ c.floorTimer=4+Math.random()*4; return false; }   // 階段に行けない→後で再挑戦
    c.mode="transit"; c.transit={dir,goal,sid}; return true;
  }
  // フロア間の入れ替え：隣り合う階で「巡回時間が過ぎた敵」が両方に居たら同時に交換＝人数を保つ
  function swapChaserFloors(){
    for(let f=1; f<NF; f++){
      const a=chasers.find(c=> c.level===f   && c.mode==="patrol" && c.floorTimer<=0 && c.mem<=0);
      const b=chasers.find(c=> c.level===f+1 && c.mode==="patrol" && c.floorTimer<=0 && c.mem<=0);
      if(a && b){ if(startTransit(a,+1)) startTransit(b,-1); }    // a:上へ / b:下へ
    }
  }
  function updateChasers(dt){
    swapChaserFloors();
    let nearExit=false;   // 地上(level>=2)で出口付近にいるか（運搬の最終局面＝遭遇率を高める）
    if(player.level>=2) for(const e of exits){ if(e.level===player.level && Math.hypot(player.x-e.x,player.z-e.z)<C.NEAR_EXIT_DIST){ nearExit=true; break; } }
    for(const chaser of chasers){
      const same=chaser.level===player.level;
      const d=Math.hypot(player.x-chaser.x, player.z-chaser.z);
      chaser.gripT = (same && d<C.CATCH_DIST && Math.abs((chaser.y||0)-player.y)<=1.6) ? (chaser.gripT||0)+dt : 0;   // 密着持続時間（視点回し悪用の対策。段差越しは密着扱いしない）
      let sight=chaser.alerted?C.CHASER_SIGHT*C.ALERT_SIGHT_MULT:C.CHASER_SIGHT;
      if(chaser.level>=2 && !metEnemyUnderground) sight*=2;   // 地下(地下1階)で敵に未遭遇なら地上は遭遇率を倍に
      if(chaser.level>=2 && nearExit) sight*=C.NEAR_EXIT_SIGHT_MULT; // 出口付近は遭遇率UP
      if(crouching) sight*=C.CROUCH_SIGHT_MULT;                 // しゃがむと見つかりにくい
      // 探知は「顔の向いている方向(faceAng)」±半画角の範囲のみ＝全方位ではない
      let dAng=Math.atan2(player.x-chaser.x, player.z-chaser.z)-(chaser.faceAng||0);
      while(dAng>Math.PI)dAng-=6.283185307; while(dAng<-Math.PI)dAng+=6.283185307;
      const inFov=Math.abs(dAng) <= C.CHASER_FOV*Math.PI/360;
      let see=gameTime>=C.START_GRACE && same && d<sight && inFov && hasLOS(chaser.x,chaser.z,player.x,player.z,chaser.level); // 開始直後は探知なし
      if(see && crouching && pedestrians.some(p=>p.level===player.level && Math.hypot(p.x-player.x,p.z-player.z)<C.CROUCH_HIDE_PED)) see=false; // 人混みに紛れる
      if(see){ chaser.lx=player.x; chaser.lz=player.z; chaser.alerted=true; chaser.mem=(chaser.level===1?C.B2_CHASER_MEMORY:C.CHASER_MEMORY);
        if(player.level===1) metEnemyUnderground=true; }                 // 地下1階（唯一の地下）で遭遇を記録
      else if(chaser.mem>0) chaser.mem-=dt;
      // 追跡は「巡回中＆同フロア」のみ（移動中=transitは横断に専念）。スピードは従来どおり
      const chasing = chaser.mode==="patrol" && same && chaser.mem>0;
      chaser.showAlert = chasing;
      chaser.state = chasing? (see?"発見・追跡":"捜索") : (chaser.mode==="transit"?"別フロアへ移動":"巡回");

      if(chasing){
        let tgx=chaser.lx, tgz=chaser.lz;
        if(same){                                         // 接近時はプレイヤーの正面(画面内)へ回り込んでから捕まえる
          const dd=Math.hypot(player.x-chaser.x, player.z-chaser.z);
          if(dd < C.CATCH_DIST+7){
            const vx=chaser.x-player.x, vz=chaser.z-player.z, vl=Math.hypot(vx,vz)||1;
            const front=(vx/vl)*fwd.x+(vz/vl)*fwd.z;      // 敵がプレイヤーの正面側にいるか（>cos(FOV)で正面）
            if(front < Math.cos(C.CATCH_FOV*Math.PI/180)){ // まだ正面でない→正面の一点を狙って回り込む
              tgx=player.x+fwd.x*(C.CATCH_DIST*0.7); tgz=player.z+fwd.z*(C.CATCH_DIST*0.7);
            } else { tgx=player.x; tgz=player.z; }
          }
        }
        moveToward(chaser, tgx, tgz, C.CHASER_SPEED, dt, CHASER_R);
      } else if(chaser.mode==="transit"){
        enemyTransitStep(chaser, dt);
      } else {
        chaser.floorTimer-=dt;
        patrolStep(chaser, dt);
      }
      let mvx=chaser.x-chaser._px, mvz=chaser.z-chaser._pz;
      // どのモードでも「止まり続けない」安全策：0.5秒動けなければランダムに押し出す（柱/売店などに詰まっても解消）
      if(Math.hypot(mvx,mvz)<0.002){
        chaser._stuck=(chaser._stuck||0)+dt;
        if(chaser._stuck>0.5){ chaser._stuck=0; const a=Math.random()*6.28;
          moveToward(chaser, chaser.x+Math.cos(a)*4, chaser.z+Math.sin(a)*4, C.CHASER_WANDER, dt, CHASER_R);
          chaser.dir=a; chaser.patReached=true;
          mvx=chaser.x-chaser._px; mvz=chaser.z-chaser._pz;
        }
      } else chaser._stuck=0;
      chaser._px=chaser.x; chaser._pz=chaser.z;

      const si=stairInfo(chaser.x,chaser.z,chaser.level);
      if(si){ chaser.y=si.y; chaser.level=si.t>=0.5?si.lvl+1:si.lvl; } else { chaser.y=(chaser.level-1)*FH; }
      if(chaser.mode==="transit" && !si && chaser.transit && chaser.level===chaser.transit.goal){  // 到着→巡回へ
        chaser.mode="patrol"; chaser.transit=null; chaser.patField=null; chaser.patReached=true;
        chaser.floorTimer=C.CHASER_FLOOR_TIME*(0.6+Math.random()*0.8);
      }
      chaser.group.position.set(chaser.x,chaser.y+FOOT_LIFT,chaser.z);
      if(chasing) chaser.faceAng=Math.atan2(player.x-chaser.x, player.z-chaser.z);   // 追跡中は顔(前)をプレイヤーへ
      else if(Math.hypot(mvx,mvz)>0.0001) chaser.faceAng=Math.atan2(mvx,mvz);        // 巡回中は進行方向へ
      chaser.group.rotation.set(0, chaser.faceAng||0, 0);                            // この向き＝探知の向き
    }
  }

  // 1歩動かす（dir=希望方向。allowStair=trueなら階段に乗れる＝徘徊者は乗らない）
  function pedMoveDir(p, vx, vz, dt, allowStair){
    let dodge=false;
    // 階段(乗車)中はプレイヤー回避をしない＝手すりに押し込まれて止まる/合体するのを防ぐ（プレイヤーは素通りできる）
    if(!allowStair && p.level===player.level){
      const dx=p.x-player.x, dz=p.z-player.z, d=Math.hypot(dx,dz);
      if(d<C.PED_AVOID_R && d>0.001){ const w=(C.PED_AVOID_R-d)/C.PED_AVOID_R*2.2; vx+=dx/d*w; vz+=dz/d*w;
        if(d<1.35){ vx=dx/d; vz=dz/d; dodge=true; } }   // 早め・強めに道を開ける＝人混みでもプレイヤーが必ず通れる
    }
    const L=Math.hypot(vx,vz); if(L>0.0001){ vx/=L; vz/=L; }
    const sp= dodge? C.PED_DODGE_SPEED
                   : (allowStair? C.PED_SPEED*1.8 : (p.rush>0? C.PED_RUSH_SPEED : C.PED_SPEED)); // 階段は速く通り抜け＝詰まりにくく
    const nx=vx*sp*dt, nz=vz*sp*dt, f=p.level;
    const inside=obstacleHit(p.x,p.z,0.3,f);   // 障害物の内側/縁に居たら移動を許可（縁のデッドバンドで固まらない）
    const ok=(X,Z)=> allowStair ? (canStand(X,Z,PED_R,f) && (inside || !obstacleHit(X,Z,0.3,f)))
                                : (canStandPed(X,Z,PED_R,f) && (inside || !obstacleHit(X,Z,0.3,f)));
    let moved=false;
    if(ok(p.x+nx,p.z)){ p.x+=nx; moved=true; }
    if(ok(p.x,p.z+nz)){ p.z+=nz; moved=true; }
    if(L>0.0001) p.ry=Math.atan2(vx,vz);
    return moved;
  }
  // 人口密度の粗いグリッド（地上・地下1階で「空いている方へ寄る」傾向に使う）
  const DCELL=4, densW=Math.ceil(C.COLS/DCELL), densH=Math.ceil(C.ROWS/DCELL);
  let densGrid={}, densAccum=0;
  function computeDensity(){
    densGrid={};
    for(let f=1;f<=NF;f++){ densGrid[f]=Array.from({length:densH},()=>new Array(densW).fill(0)); }
    for(const p of pedestrians){
      const cx=Math.max(0,Math.min(densW-1,(p.x/T/DCELL)|0)), cy=Math.max(0,Math.min(densH-1,(p.z/T/DCELL)|0));
      if(densGrid[p.level]) densGrid[p.level][cy][cx]++;
    }
  }
  // 自分のセルより空いている隣セルがあればその向きを返す（最も空いている方）。無ければ null
  function lowDensityDir(p){
    const dg=densGrid[p.level]; if(!dg) return null;
    const cx=(p.x/T/DCELL)|0, cy=(p.z/T/DCELL)|0;
    if(cx<0||cy<0||cx>=densW||cy>=densH) return null;
    let bx=0,bz=0,bd=dg[cy][cx];
    for(const [dx,dy] of DIRS4){ const nx=cx+dx,ny=cy+dy;
      if(nx<0||ny<0||nx>=densW||ny>=densH) continue;
      if(dg[ny][nx]<bd){ bd=dg[ny][nx]; bx=dx; bz=dy; } }
    if(bx===0&&bz===0) return null;   // 自分のセルが一番空いている→そのまま
    return Math.atan2(bz,bx);
  }
  function wanderStep(p, dt){
    p.timer-=dt;
    if(p.timer<=0){
      let nd=null;
      if(p.level===2 || p.level===NF) nd=lowDensityDir(p);     // 地上/地下1階は空いている方へ寄る傾向
      p.dir = (nd!==null && Math.random()<0.6) ? nd+(Math.random()-0.5)*0.9 : Math.random()*6.28;
      p.timer=1.5+Math.random()*3;
      if(p.rush<=0 && Math.random()<C.PED_RUSH_CHANCE) p.rush=1.2+Math.random()*1.8; }
    if(p.rush>0) p.rush-=dt;
    if(!pedMoveDir(p, Math.cos(p.dir), Math.sin(p.dir), dt, false)){ p.dir=Math.random()*6.28; p.timer=0.5; }
  }
  function moverStep(p, dt){
    if(p.rush>0) p.rush-=dt;
    if(p.ride){ pedMoveDir(p, p.ride.dx-p.x, p.ride.dz-p.z, dt, true); return; }
    if(p.trip<0){ p.trip=pickStair(p); if(p.trip<0){ wanderStep(p,dt); return; } }
    const s=stairs[p.trip], dir=(p.level===NF)?-1:1;
    const fl=fieldAt(p.level, p.trip, p.x, p.z);
    // 目的の階段が混雑している時は「諦めて離れる」＝階段口に溜まらない／時間が経っても集中しない
    if((stairRiders[p.trip]||0) > 3 && fl && fl.dist>=0 && fl.dist<=3){
      const aw=Math.atan2(p.z-s.cz, p.x-s.cx);
      p.dir=aw; p.rush=1.3; p.timer=2.5; p.kind="W"; p.trip=-1; p.goal=0; p.roleT=5+Math.random()*7;
      return;
    }
    if(fl && fl.dist>=0 && fl.dist<=1){          // 目的の階段の昇降口に到着→階段に乗る
      const dest=dir>0?s.exit:s.entry, dw=tileToWorld(dest[0],dest[1]);
      p.ride={dx:dw.x,dz:dw.z,goal:p.level+dir,sid:p.trip};
      stairRiders[p.trip]=(stairRiders[p.trip]||0)+1;   // 即時カウント（同フレームで一気に乗らせない）
      pedMoveDir(p, dw.x-p.x, dw.z-p.z, dt, true); return;
    }
    if(fl && fl.step>=0){                         // 経路場に沿って隣のマス中央へ
      const tx=Math.floor(p.x/T), ty=Math.floor(p.z/T), d=DIRS4[fl.step], tw=tileToWorld(tx+d[0],ty+d[1]);
      pedMoveDir(p, tw.x-p.x, tw.z-p.z, dt, false); return;
    }
    wanderStep(p, dt);                            // 経路なし→徘徊
  }
  // フロアごとの人数を目標値へ。余剰フロアの人を「出入り口」経由で不足フロアの「出入り口」へ移す
  function relocatePed(p, g){
    // 必ず外周の出入り口(出口/デパート/電車ドア)から、しかもプレイヤーから最も遠い口を選んで出現
    // ＝目の前に何もない所からポップせず、遠くの外周から歩いて入ってくるように見せる

        const d=Math.hypot(w.x-player.x,w.z-player.z); if(d>bd && canStand(w.x,w.z,PED_R,g) && !obstacleHit(w.x,w.z,0.3,g)){ bd=d; X=w.x; Z=w.z; } }
    }

  function balancePedestrians(){
    const byF={}; for(let f=1;f<=NF;f++) byF[f]=[];
    for(let i=0;i<pedestrians.length;i++){ if(pedestrians[i].kind==="T") continue; byF[pedestrians[i].level].push(i); } // 通り抜けの人流は階移動の調節対象外
    const give=[], take=[];
    for(let f=1;f<=NF;f++){ const d=byF[f].length-(pedTargets[f]||0); if(d>0) give.push([f,d]); else if(d<0) take.push([f,-d]); }
    if(!give.length || !take.length) return;
    for(const gv of give) byF[gv[0]].sort((a,b)=> // 昇順＝最後がプレイヤーから最遠（移しても見えにくい）
      (Math.hypot(pedestrians[a].x-player.x,pedestrians[a].z-player.z))-(Math.hypot(pedestrians[b].x-player.x,pedestrians[b].z-player.z)));
    let mv=0; const MAX=80, gi=[0];
    for(const tk of take){ let need=tk[1];
      while(need>0 && mv<MAX){
        while(gi[0]<give.length && give[gi[0]][1]<=0) gi[0]++;
        if(gi[0]>=give.length) return;
        const gv=give[gi[0]], arr=byF[gv[0]], idx=arr.pop();
        if(idx===undefined){ gv[1]=0; continue; }
        relocatePed(pedestrians[idx], tk[0]); need--; gv[1]--; mv++;
      }
    }
  }
  function updatePedestrians(dt){
    pedFrame++;

    balAccum+=dt;
    if(balAccum>=0.5){ balAccum=0; balancePedestrians(); }
    densAccum+=dt; if(densAccum>=0.4){ densAccum=0; computeDensity(); }   // 人口密度を更新（空いている方へ寄る用）
    // 各階段の混雑度を集計（pickStair=総需要で分散 / キャップ=実際に乗っている人数）
    stairLoad=new Array(stairs.length).fill(0);
    stairRiders=new Array(stairs.length).fill(0);
    for(const p of pedestrians){ const sid=p.ride?p.ride.sid:p.trip; if(sid>=0) stairLoad[sid]++; if(p.ride) stairRiders[p.ride.sid]++; }
    const STRIDE=C.PED_DORMANT_STRIDE, ACT2=C.PED_LOD_FAR*C.PED_LOD_FAR, pf=player.level;
    let i=-1;
    for(const p of pedestrians){
      i++;
      // 描画対象外（別フロア or 遠距離）の通行人は移動計算を間引く（毎フレームでなくSTRIDE回に1回、まとめてdtを進める）
      // ただし近くの階段の接続先フロアの階段付近にいる通行人は、3D表示するので毎フレーム更新する
      const nearSt = stairAnchors.length && p.level!==pf && nearStairAnchor(p);
      const dormant = !nearSt && ((p.level!==pf) || ((p.x-player.x)**2+(p.z-player.z)**2 > ACT2));
      if(dormant && ((pedFrame+i)%STRIDE!==0)) continue;
      // 実際に前回更新からの経過フレームぶんだけ dt を進める（休眠↔活動の切替時に進め過ぎないよう）
      const d = Math.min(STRIDE+1, pedFrame-(p.lastUpd||(pedFrame-1)))*dt; p.lastUpd=pedFrame;
      if(!p.ride && p.kind!=="T" && !(p.kind==="K"&&p.visit>0) && !p.inPlaza){ p.roleT-=d; if(p.roleT<=0){ setPedRole(p); p.roleT=6+Math.random()*8; } }   // 広場滞在中は役割を替えない（外に取り残さない）
      if(p.kind==="T"){ throughStep(p, d); p.y=(p.level-1)*FH; }
      else if(p.kind==="K"){ kioskStep(p, d); p.y=(p.level-1)*FH; }
      else if(p.kind==="E"){ exitStep(p, d);

          const e=p.plazaE, fb=(e.level-1)*FH, ow=(p.x-e.x)*e.ox+(p.z-e.z)*e.oy, tt=Math.max(0,Math.min(1,ow/(T*2.5)));
          p.y = fb*(1-tt) + outsideY(p.z)*tt;
        } else p.y=(p.level-1)*FH; }
      else if(p.kind==="M"){
        const sx0=p.x, sz0=p.z;

        // 詰まり対策：0.7秒動けなかったら、乗車中は目的地へワープして到着扱い／接近中は諦めて徘徊（階段で固まらない）
        if(Math.abs(p.x-sx0)+Math.abs(p.z-sz0) < 0.002){ p.stuckT=(p.stuckT||0)+d;
          if(p.stuckT>0.7){ p.stuckT=0;
            if(p.ride){ p.x=p.ride.dx; p.z=p.ride.dz; p.level=p.ride.goal; }
            else { p.trip=-1; p.kind="W"; p.dir=Math.random()*6.28; p.timer=0.6; p.roleT=3+Math.random()*5; } }
        } else p.stuckT=0;
        const si=stairInfo(p.x,p.z,p.level);
        if(si){ p.y=si.y; p.level=si.t>=0.5?si.lvl+1:si.lvl; }
        else { p.y=(p.level-1)*FH;

        }

    }

    renderPedestrians();    // 描画：近=3D / 遠=ビルボード / 別フロア・視野外・遠すぎ＝非表示
  }

  function placePed3D(p, gi, ti){

  // 描画の振り分け：別フロア・視野外・遠すぎ＝非表示 / 近(同フロア)=3D / 遠(同フロア)=2Dビルボード
  function renderPedestrians(){
    if(!pedLegsInst) return;
    const NEAR2=C.PED_LOD_NEAR*C.PED_LOD_NEAR, FAR2=C.PED_LOD_FAR*C.PED_LOD_FAR, pf=player.level;
    const cpx=camera.position.x, cpz=camera.position.z;
    // カメラの視錐台を最新化（プレイヤー移動後・描画前なので逆行列を作り直す）
    camera.updateMatrixWorld(); camera.matrixWorldInverse.copy(camera.matrixWorld).invert();
    _projScreen.multiplyMatrices(camera.projectionMatrix, camera.matrixWorldInverse);
    _frustum.setFromProjectionMatrix(_projScreen);
    let n3d=0; const tc={}, bc={};
    for(const ci in pedTorsoInsts) tc[ci]=0;
    for(const ci in pedBillInsts) bc[ci]=0;
    for(const p of pedestrians){
      let asBill;
      if(p.level===pf){                                 // 同フロア
        const dx=p.x-player.x, dz=p.z-player.z, d2=dx*dx+dz*dz;
        if(d2>FAR2) continue;                           // 遠すぎ → 描画しない
        asBill = d2>NEAR2;                              // 近=3D / 遠=ビルボード
      } else {                                          // 別フロア
        if(!(stairAnchors.length && nearStairAnchor(p))) continue;  // 階段付近以外は描画しない
        asBill = false;                                 // 階段の先読みは3Dで表示
      }
      _sph.center.set(p.x, p.y+1.0, p.z); _sph.radius=1.2;
      if(!_frustum.intersectsSphere(_sph)) continue;    // カメラ視野外 → 描画しない
      if(!asBill){ placePed3D(p, n3d++, tc[p.ci]++); }  // 3Dモデル
      else {                                            // カメラを向く2Dビルボード
        const bi=bc[p.ci]++, base=p.y+FOOT_LIFT;
        _billDummy.position.set(p.x, base+BILL_H*0.5, p.z);
        _billDummy.rotation.set(0, Math.atan2(cpx-p.x, cpz-p.z), 0);   // Y軸のみ＝直立のまま正面を向く
        _billDummy.updateMatrix(); pedBillInsts[p.ci].setMatrixAt(bi, _billDummy.matrix);
      }
    }
    pedLegsInst.count=n3d; pedHeadInst.count=n3d;
    pedLegsInst.instanceMatrix.needsUpdate=true; pedHeadInst.instanceMatrix.needsUpdate=true;
    for(const ci in pedTorsoInsts){ pedTorsoInsts[ci].count=tc[ci]; pedTorsoInsts[ci].instanceMatrix.needsUpdate=true; }

  }

  function separateNearbyPeds(){
    if(!pedLegsInst) return;
    let near=[];
    for(const p of pedestrians){ if(p.level!==player.level) continue;
      const dx=p.x-player.x, dz=p.z-player.z; if(dx*dx+dz*dz<196) near.push(p); }

  // そのタイルを塞いでもフロアの連結（他の全床タイルへの到達性）が保たれるか
  function tileBlockSafe(f,bx,by){
    const g=grids[f]; let total=0, start=null;
    for(let y=0;y<C.ROWS;y++)for(let x=0;x<C.COLS;x++){
      if(g[y][x]!==0) continue; total++;
      if(!start && !(x===bx&&y===by)) start=[x,y];
    }
    if(!start) return false;
    const seen=new Set([start[0]+","+start[1]]), q=[start]; let i=0;
    while(i<q.length){ const [x,y]=q[i++];
      for(const [dx,dy] of DIRS4){ const nx=x+dx, ny=y+dy;
        if(nx<0||ny<0||nx>=C.COLS||ny>=C.ROWS) continue;
        if(g[ny][nx]!==0 || (nx===bx&&ny===by)) continue;
        const k=nx+","+ny; if(seen.has(k)) continue; seen.add(k); q.push([nx,ny]);
      }
    }
    return seen.size >= total-1;   // 塞いだ1タイル以外すべて到達できる
  }

  function wallAdjacentTiles(f){   // 「壁に背を向け通路を正面にできる」床タイル＋通路方向を列挙
    const out=[]; const DIRS=[[1,0],[-1,0],[0,1],[0,-1]];
    for(let y=0;y<C.ROWS;y++)for(let x=0;x<C.COLS;x++){
      if(grids[f][y][x]!==0) continue;
      if(stairTileSet.has(x+","+y)) continue;
      if(obsBlock[f] && obsBlock[f].has(x+","+y)) continue;
      if(f===1 && CENTER_COLS.includes(x) && OBJ_ROWS.includes(y)) continue;
      for(const [dx,dy] of DIRS){
        // 通路(dir)側=床、その反対(壁)側=壁 のとき密着配置できる
        if(gFloor(f,x+dx,y+dy) && gWall(f,x-dx,y-dy)) out.push({x,y,dx,dy});

      if(!last || last.level!==player.level || Math.hypot(last.x-player.x,last.z-player.z)>1.0){
        playerTrail.push({x:player.x,z:player.z,level:player.level}); if(playerTrail.length>240) playerTrail.shift(); }
      if(drunk.toiletStop>0){ /* トイレで足止め中＝その場で待つ（追従しない） */ }
      else if(drunk.stopT>0){ drunk.stopT-=dt; }                              // コンビニで立ち止まり中
      else if(konbini && drunk.level===konbini.level && !drunk.konbiniDone && Math.hypot(drunk.x-konbini.x,drunk.z-konbini.z)<C.KONBINI_DIST){
        drunk.stopT=C.KONBINI_STOP; drunk.konbiniDone=true; setDrunkMsg("msgKonbini",3.5); sfxAlert();
      } else {                                                                // プレイヤーの通った道を辿って付いてくる
        if(playerTrail.length){ const tgt=playerTrail[0];
          if(drunk.level===tgt.level && Math.hypot(drunk.x-tgt.x,drunk.z-tgt.z)<1.3) playerTrail.shift();
          else moveToward(drunk, tgt.x, tgt.z, C.DRUNK_SPEED, dt, DRUNK_R); }
      }
      // 歩いている限りは絶対にはぐれない（手放すのはW連打ダッシュの dropDrunk() だけ）
    }
    const si=stairInfo(drunk.x,drunk.z,drunk.level);
    if(si){ drunk.y=si.y; drunk.level=si.t>=0.5?si.lvl+1:si.lvl; } else drunk.y=(drunk.level-1)*FH;
    const mvx=drunk.x-drunk._px, mvz=drunk.z-drunk._pz; drunk._px=drunk.x; drunk._pz=drunk.z;
    const fy=Math.hypot(mvx,mvz)>0.0001?Math.atan2(mvx,mvz):drunk.group.rotation.y;
    drunk.group.rotation.set(0, fy, Math.sin(drunk.sway)*0.12);               // ふらつき
    drunk.group.position.set(drunk.x, drunk.y+FOOT_LIFT, drunk.z);
    if(drunk.beacon && drunk.beacon.visible) drunk.beacon.position.set(drunk.x,(drunk.level-1)*FH+FH*0.43,drunk.z);
    updateToiletUrge(dt);   // 尿意（予兆→猶予→失敗）
  }
  function checkResult(){
    if(gameTime>=C.START_GRACE) for(const chaser of chasers){   // 開始直後の猶予中は捕まらない
      if(chaser.level!==player.level) continue;
      if(Math.abs((chaser.y||0)-player.y)>1.6) continue;         // 段差（階段の途中など）越しには捕まらない
      const vx=chaser.x-player.x, vz=chaser.z-player.z, dd=Math.hypot(vx,vz);
      // 正面(画面に映る範囲)に敵が居る時だけ捕まる。背後・側面では捕まえず、敵は正面へ回り込む
      const front=(dd>0.001)?((vx/dd)*fwd.x+(vz/dd)*fwd.z):1;
      // 正面(画面内)で捕獲。ただし密着がCATCH_GRAB_TIME続いたら向きに関係なく掴む（視点回し悪用の対策）
      if(dd<C.CATCH_DIST && (front>=Math.cos(C.CATCH_FOV*Math.PI/180) || (chaser.gripT||0)>=C.CATCH_GRAB_TIME)){ endGame(false); return; }
    }
    // 改札を通って外（広場）へ出たらクリア＝正解の出口で、改札(壁面)より外側に出たか
    // 広場どうしが重なっていても正解の出口の広場を直接判定（別出口の広場が先にヒットして判定漏れしない）
    let ce=null;
    for(const e of exits){ if(e.no!==correctExitNo || !e.plaza || e.plaza.level!==player.level) continue;
      const p=e.plaza; if(player.x>=p.minX&&player.x<=p.maxX&&player.z>=p.minZ&&player.z<=p.maxZ){ ce=e; break; } }
    if(ce){
      const outward=(player.x-ce.x)*ce.ox + (player.z-ce.z)*ce.oy;   // 改札より外（プラス）か
      if(outward>T*0.4){
        // 酔っ払いを同じ階の改札まで連れて来ている時のみクリア（外周や別の階に置き去りにする抜け道を防ぐ）
        if(carrying && drunk && drunk.level===player.level && Math.hypot(player.x-drunk.x,player.z-drunk.z)<T*4.2){ endGame(true); return; }
        else if(carrying && drunkMsgT<=0){ setDrunkMsg("msgDeliverClose",1.4); }   // 連れているが改札から離れている
        else if(!carrying && drunkMsgT<=0){ setDrunkMsg("msgBring",1.5); }
      }
    }
  }
  let flick=0;
  function updateDeco(dt){ flick+=dt; }  // flick は警告点滅用のタイマー（ライトは一定）

  // ---------- ミニマップ（現在フロアを表示。階を上がると切り替わる） ----------
  function drawMinimap(){
    if(!C.SHOW_MAP || mapCollapsed || userMode) return; const cs=MAP_CELL;
    const F=player.level, g=grids[F];
    mapCtx.clearRect(0,0,mapCv.width,mapCv.height);
    for(let y=0;y<C.ROWS;y++)for(let x=0;x<C.COLS;x++){
      const k=x+","+y, sl=stairTileLevel[k];
      // このフロアに関係する階段だけ色付け（上り=明るい橙, 下り=青）
      const up = sl===F, down = sl===F-1;
      mapCtx.fillStyle = g[y][x]===1 ? "#5b626b" : (up?"#e8a23a":(down?"#5a9bd6":"#eef1f4"));
      mapCtx.fillRect(x*cs,y*cs,cs,cs);
    }
    // 出口は「いまのフロアにある出口」だけ表示（番号は大きめ）
    for(const e of exits){ if(e.level!==F) continue; const px=(e.x/T)*cs, py=(e.z/T)*cs;
      mapCtx.fillStyle=(e.no===correctExitNo)?"#f5b50a":"#2ecf6b";
      mapCtx.fillRect(px-cs*0.6,py-cs*0.6,cs*1.2,cs*1.2);
      mapCtx.fillStyle="#0c2a16"; mapCtx.font="bold "+Math.round(cs*1.0)+"px sans-serif"; mapCtx.textAlign="center"; mapCtx.textBaseline="middle";
      mapCtx.fillText(e.dshort||String(e.no),px,py);
    }
    // 現在フロアの歩行者・敵だけ表示
    mapCtx.fillStyle="#9aa1aa";
    for(const p of pedestrians){ if(p.level!==F) continue; mapCtx.beginPath(); mapCtx.arc((p.x/T)*cs,(p.z/T)*cs,cs*0.16,0,6.28); mapCtx.fill(); }
    for(const chaser of chasers){ if(chaser.level!==F) continue; mapCtx.fillStyle=chaser.showAlert?"#ff2d2d":"#b03b3b"; mapCtx.beginPath();
      mapCtx.arc((chaser.x/T)*cs,(chaser.z/T)*cs,cs*0.4,0,6.28); mapCtx.fill(); }
    // 酔っ払い（デコイ=灰、目標=マゼンタ＋リング）
    mapCtx.fillStyle="#8a8f97";
    for(const d of decoyDrunks){ if(F!==1) break; mapCtx.beginPath(); mapCtx.arc((d.x/T)*cs,(d.z/T)*cs,cs*0.3,0,6.28); mapCtx.fill(); }
    if(drunk && drunk.level===F){ const dx=(drunk.x/T)*cs, dy=(drunk.z/T)*cs;
      mapCtx.fillStyle="#e040c0"; mapCtx.beginPath(); mapCtx.arc(dx,dy,cs*0.45,0,6.28); mapCtx.fill();
      mapCtx.strokeStyle="#ffd23a"; mapCtx.lineWidth=2; mapCtx.beginPath(); mapCtx.arc(dx,dy,cs*0.7,0,6.28); mapCtx.stroke(); }
    const px=(player.x/T)*cs, py=(player.z/T)*cs;
    mapCtx.strokeStyle="#1f6dd0"; mapCtx.lineWidth=2; mapCtx.beginPath();
    mapCtx.moveTo(px,py); mapCtx.lineTo(px+fwd.x*cs*1.2,py+fwd.z*cs*1.2); mapCtx.stroke();
    mapCtx.fillStyle="#1f6dd0"; mapCtx.beginPath(); mapCtx.arc(px,py,cs*0.4,0,6.28); mapCtx.fill();

    // 階段の向き矢印（小さく。頭・白フチ・線幅すべて控えめにして階段が隠れないように）
    const tri=(tx,ty,a,hl,hw)=>{ const bx=tx-Math.cos(a)*hl, by=ty-Math.sin(a)*hl, nx=-Math.sin(a), ny=Math.cos(a);
      mapCtx.beginPath(); mapCtx.moveTo(tx,ty); mapCtx.lineTo(bx+nx*hw,by+ny*hw); mapCtx.lineTo(bx-nx*hw,by-ny*hw); mapCtx.closePath(); };
    const drawArrow=(x1,y1,x2,y2,color)=>{
      const a=Math.atan2(y2-y1,x2-x1), hl=cs*0.42, hw=cs*0.26;
      const bx=x2-Math.cos(a)*hl, by=y2-Math.sin(a)*hl;
      mapCtx.lineCap="round";
      mapCtx.strokeStyle="#fff"; mapCtx.lineWidth=2.4;
      mapCtx.beginPath(); mapCtx.moveTo(x1,y1); mapCtx.lineTo(bx,by); mapCtx.stroke();
      mapCtx.fillStyle="#fff"; tri(x2,y2,a,hl+1,hw+1); mapCtx.fill();
      mapCtx.strokeStyle=color; mapCtx.lineWidth=1.4;
      mapCtx.beginPath(); mapCtx.moveTo(x1,y1); mapCtx.lineTo(bx,by); mapCtx.stroke();
      mapCtx.fillStyle=color; tri(x2,y2,a,hl,hw); mapCtx.fill();
    };
    for(const s of stairs){
      const up=s.lvl===F, down=s.lvl===F-1; if(!up&&!down) continue;
      const dir=up?1:-1, half=0.45;   // 階段中央に小さく（オレンジが見えるように）
      const adx=s.adir[0]*dir, ady=s.adir[1]*dir;
      const x1=(s.cxTile-adx*half)*cs, y1=(s.cyTile-ady*half)*cs;
      const x2=(s.cxTile+adx*half)*cs, y2=(s.cyTile+ady*half)*cs;
      drawArrow(x1,y1,x2,y2, up?"#e0241a":"#2566d6");
    }
  }

  // ---------- ループ ----------
  const clock=new THREE.Clock();
  function loop(){
    const dt=Math.min(clock.getDelta(),0.05);
    if(running){
      updatePlayer(dt); updateChasers(dt); updateDrunk(dt); updateCrowd(dt); updatePedestrians(dt); updateDeco(dt); updateBoarders(flick); checkResult();
      drawMinimap();
      gameTime+=dt; timerEl.textContent="TIME "+fmtTime(gameTime);
      const alert = chasers.some(c=>c.showAlert);
      if(alert && !alertPrev){ sfxAlert(); statDetect++; }   // 新たに見つかった瞬間（回数を記録）
      alertPrev = alert;
      // 目標表示（運搬の状態を反映。一時メッセージ優先）
      if(drunkMsgT>0) goalEl.textContent=tr(drunkMsg);
      else if(carrying){ const ce=exits.find(e=>e.no===correctExitNo); const cn=ce?(lang==="en"?ce.dirEn:ce.dirName):""; goalEl.textContent = tr('goalDeliver', floorName(ce?ce.level:NF), cn); }
      else if(drunk && drunk.level!==1) goalEl.textContent = tr('goalFetch', floorName(drunk.level));   // 手放した後＝酔っ払いの現在フロアを指す
      else goalEl.textContent = tr('goalFind', lineName(targetLane));
      carryEl.classList.toggle("hidden", !carrying);            // 連れている＝緑
      lostEl.classList.toggle("hidden", carrying || lostT<=0);  // はぐれた＝赤（一定時間）
      // ミッション・ボックス（酔っぱらいを助ける＝回収中で緑チェック、手放すと赤✖に戻る）
      setMission(m1El, carrying, tr('mRescue'));
      setMission(m2El, false, tr('mEscape'));
      floorEl.textContent = tr('here', floorName(player.level));
      mapLabel.textContent = (lang==="en"?"MAP ("+floorName(player.level)+")":"MAP（"+floorName(player.level)+"）");
      subEl.style.display="none";   // プレイ中は「敵:徘徊／WASD移動…」の補助表示を消す
      // ダッシュ・スタミナのゲージ（残量そのまま表示。途中でやめても残りが見える）
      let dfrac=dashStam/C.DASH_DUR, dcol, dtxt;
      if(isDashing){ dcol="#33d17a"; dtxt=tr('dashFull', dashStam.toFixed(1)); }                            // ダッシュ中（残量表示）
      else if(dashStam>=C.DASH_DUR-0.05){ dcol="#33d17a"; dtxt=tr('dashReadyFull'); }                       // 満タン
      else if(dashStam>=C.DASH_MIN_START){ dcol="#8ed17a"; dtxt=tr('dashReadyWeak', dashStam.toFixed(1)); } // 使用可（回復中）
      else { dcol="#7a8088"; dtxt=tr('dashCoolWeak', Math.ceil((C.DASH_MIN_START-dashStam)*C.DASH_FULL_AT/C.DASH_DUR)); }  // 始動可能まで回復中
      dashFillEl.style.width=(Math.max(0,Math.min(1,dfrac))*100)+"%"; dashFillEl.style.background=dcol; dashTxtEl.textContent=dtxt;
      // ダッシュ中は画面左右に薄い白線で疾走感
      const sp = isDashing ? (0.55+0.25*Math.abs(Math.sin(flick*22))) : 0;
      speedLEl.style.opacity=sp; speedREl.style.opacity=sp;
      // トイレが漏れる(GAME OVER)直前：10秒前から黄色い枠、3秒前からカウント表示
      const toiletLeft = (carrying && drunk && drunk.toiletStop<=0 && toiletState==="urge") ? toiletT : Infinity;
      if(toiletLeft<=C.TOILET_CRITICAL){
        toiletWarnEl.style.opacity = 0.3 + 0.5*Math.abs(Math.sin(flick*8));   // 黄色枠が点滅
        if(toiletLeft<=3){ toiletCountEl.textContent=Math.ceil(Math.max(0,toiletLeft)); toiletCountEl.style.display="block"; }
        else toiletCountEl.style.display="none";
      } else { toiletWarnEl.style.opacity=0; toiletCountEl.style.display="none"; }
    }
    // 敵に見つかって追われている間は画面周囲を赤く。さらに四隅で敵のいる方向を特に強く示す
    let nearChase=Infinity, nearC=null;
    if(running) for(const c of chasers){ if(!c.showAlert || c.level!==player.level) continue;
      const d=Math.hypot(c.x-player.x,c.z-player.z); if(d<nearChase){ nearChase=d; nearC=c; } }
    if(nearC){
      const prox=Math.max(0, Math.min(1, 1 - nearChase/(C.CHASER_SIGHT*2.2)));   // 近い=1 / 遠い=0
      const pulse=0.62 + 0.38*Math.abs(Math.sin(flick*11));
      alertEl.style.opacity = (0.14 + 0.4*prox) * pulse;                          // 全体は弱め
      // 敵の方向（カメラ基準）：正面=上 / 背後=下 / 右=右 / 左=左 → 近い隅を強い赤に
      const dx=nearC.x-player.x, dz=nearC.z-player.z;
      const fc=dx*fwd.x+dz*fwd.z, rc=dx*right.x+dz*right.z, bearing=Math.atan2(rc,fc);
      const strong=(0.55+0.6*prox)*pulse;
      const corners={ TR:Math.PI/4, BR:3*Math.PI/4, BL:-3*Math.PI/4, TL:-Math.PI/4 };
      for(const k in corners){ let da=bearing-corners[k]; while(da>Math.PI)da-=6.283185; while(da<-Math.PI)da+=6.283185;
        const w=Math.max(0,Math.cos(da)); cwEls[k].style.opacity = strong*w*w; }   // 近い方向ほど強い
    } else { alertEl.style.opacity=0; for(const k in cwEls) cwEls[k].style.opacity=0; }
    renderer.render(scene,camera);
    requestAnimationFrame(loop);
  }

  // 自動テスト用の読み取りフック（ゲーム挙動には影響しない）
  window._dbg={ get player(){return player}, get chasers(){return chasers}, get drunk(){return drunk},
    get toilets(){return toilets}, get exits(){return exits}, get stairs(){return stairs},
    get pedestrians(){return pedestrians}, get konbini(){return konbini}, get carrying(){return carrying},
    pcs:(x,z)=>playerCanStand(x,z), obst:(x,z,e,f)=>obstacleHit(x,z,e,f), standY:(x,z)=>standYAt(x,z),
    stair:(x,z,l)=>stairInfo(x,z,l), get dashStam(){return dashStam}, get dashActive(){return dashActive},
    get gameTime(){return gameTime}, C, T, FH };
  setupTouch(); loop();
})();
</script>
</body>
