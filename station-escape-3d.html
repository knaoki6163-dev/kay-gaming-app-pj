  // フロアごとの人数を目標値へ。余剰フロアの人を「出入り口」経由で不足フロアの「出入り口」へ移す
  function relocatePed(p, g){
    // 必ず外周の出入り口(出口/デパート/電車ドア)から、しかもプレイヤーから最も遠い口を選んで出現
    // ＝目の前に何もない所からポップせず、遠くの外周から歩いて入ってくるように見せる
    const src=sourcePts[g]; let X=NaN,Z=NaN;
    if(src && src.length){
      let best=null,bd=-1; for(const s of src){ const d=Math.hypot(s.x-player.x,s.z-player.z); if(d>bd){ bd=d; best=s; } }
      for(const cand of [best, src[(Math.random()*src.length)|0]]){
        const tx=cand.x+(Math.random()-0.5)*T*0.5, tz=cand.z+(Math.random()-0.5)*T*0.5;
        if(canStand(tx,tz,PED_R,g)){ X=tx; Z=tz; break; }
        if(canStand(cand.x,cand.z,PED_R,g)){ X=cand.x; Z=cand.z; break; }
      }
    }
    if(!(X===X)){   // 最終手段でもプレイヤーから遠い床を選ぶ（中央ポップを避ける）
      const pool=pedPool[g]||[]; let bd=-1;
      for(let k=0;k<14 && pool.length;k++){ const t=pool[(Math.random()*pool.length)|0], w=tileToWorld(t.x,t.y);
        const d=Math.hypot(w.x-player.x,w.z-player.z); if(d>bd && canStand(w.x,w.z,PED_R,g)){ bd=d; X=w.x; Z=w.z; } }
    }
    if(!(X===X)){ const pool=pedPool[g]||[]; if(pool.length){ const t=pool[(Math.random()*pool.length)|0], w=tileToWorld(t.x,t.y); X=w.x; Z=w.z; } else { X=p.x; Z=p.z; } }
    p.x=X; p.z=Z; p.level=g; p.y=(g-1)*FH; p.ride=null; p.lastStair=-1; p.trip=-1; p.roleT=1+Math.random()*4; setPedRole(p);
  }
  function balancePedestrians(){
    const byF={}; for(let f=1;f<=NF;f++) byF[f]=[];
    for(let i=0;i<pedestrians.length;i++){ if(pedestrians[i].kind==="T") continue; byF[pedestrians[i].level].push(i); } // 通り抜けの人流は階移動の調節対象外
    const give=[], take=[];
    for(let f=1;f<=NF;f++){ const d=byF[f].length-(pedTargets[f]||0); if(d>0) give.push([f,d]); else if(d<0) take.push([f,-d]); }
    if(!give.length || !take.length) return;
    for(const gv of give) byF[gv[0]].sort((a,b)=> // 昇順＝最後がプレイヤーから最遠（移しても見えにくい）
      (Math.hypot(pedestrians[a].x-player.x,pedestrians[a].z-player.z))-(Math.hypot(pedestrians[b].x-player.x,pedestrians[b].z-player.z)));
    let mv=0; const MAX=80, gi=[0];
    for(const tk of take){ let need=tk[1];
      while(need>0 && mv<MAX){
        while(gi[0]<give.length && give[gi[0]][1]<=0) gi[0]++;
        if(gi[0]>=give.length) return;
        const gv=give[gi[0]], arr=byF[gv[0]], idx=arr.pop();
        if(idx===undefined){ gv[1]=0; continue; }
        relocatePed(pedestrians[idx], tk[0]); need--; gv[1]--; mv++;

    }
  }
  function updatePedestrians(dt){
    pedFrame++;

    balAccum+=dt;
    if(balAccum>=0.5){ balAccum=0; balancePedestrians(); }
    densAccum+=dt; if(densAccum>=0.4){ densAccum=0; computeDensity(); }   // 人口密度を更新（空いている方へ寄る用）
    // 各階段の混雑度を集計（pickStair=総需要で分散 / キャップ=実際に乗っている人数）
    stairLoad=new Array(stairs.length).fill(0);
    stairRiders=new Array(stairs.length).fill(0);
    for(const p of pedestrians){ const sid=p.ride?p.ride.sid:p.trip; if(sid>=0) stairLoad[sid]++; if(p.ride) stairRiders[p.ride.sid]++; }
    const STRIDE=C.PED_DORMANT_STRIDE, ACT2=C.PED_LOD_FAR*C.PED_LOD_FAR, pf=player.level;
    let i=-1;

      // ただし近くの階段の接続先フロアの階段付近にいる通行人は、3D表示するので毎フレーム更新する
      const nearSt = stairAnchors.length && p.level!==pf && nearStairAnchor(p);
      const dormant = !nearSt && ((p.level!==pf) || ((p.x-player.x)**2+(p.z-player.z)**2 > ACT2));
      if(dormant && ((pedFrame+i)%STRIDE!==0)) continue;
      // 実際に前回更新からの経過フレームぶんだけ dt を進める（休眠↔活動の切替時に進め過ぎないよう）
      const d = Math.min(STRIDE+1, pedFrame-(p.lastUpd||(pedFrame-1)))*dt; p.lastUpd=pedFrame;

        if(Math.abs(p.x-sx0)+Math.abs(p.z-sz0) < 0.002){ p.stuckT=(p.stuckT||0)+d;

            if(p.ride){ p.x=p.ride.dx; p.z=p.ride.dz; p.level=p.ride.goal; }
            else { p.trip=-1; p.kind="W"; p.dir=Math.random()*6.28; p.timer=0.6; p.roleT=3+Math.random()*5; } }
        } else p.stuckT=0;

  }

  function renderPedestrians(){

    const cpx=camera.position.x, cpz=camera.position.z;

    camera.updateMatrixWorld(); camera.matrixWorldInverse.copy(camera.matrixWorld).invert();
    _projScreen.multiplyMatrices(camera.projectionMatrix, camera.matrixWorldInverse);
    _frustum.setFromProjectionMatrix(_projScreen);

  function wallAdjacentTiles(f){   // 「壁に背を向け通路を正面にできる」床タイル＋通路方向を列挙

      if(stairTileSet.has(x+","+y)) continue;
      if(obsBlock[f] && obsBlock[f].has(x+","+y)) continue;
      if(f===1 && CENTER_COLS.includes(x) && OBJ_ROWS.includes(y)) continue;
      for(const [dx,dy] of DIRS){

      crowdTimer-=dt;

        surgeToPlatform(C.CROWD_SURGE);

      }
    } else if(crowdPhase==="platform"){
      crowdT-=dt;
      if(crowdT<=0){                                 // ホーム混雑が落ち着く→半分を地下1階へ
        crowdPhase="dwellB1"; crowdT=C.CROWD_B1_DWELL;
        pedTargets[1]=baseB2Target;                  // 地下2階は通常へ（人が捌ける）
        pedTargets[2]=baseB1Target+half;             // 半分は地下1階に集まり滞留（残り半分は地上へ自然に戻る）
      }
    } else if(crowdPhase==="dwellB1"){
      crowdT-=dt;

    } else if(crowdPhase==="toGround"){

      const frac=Math.max(0, crowdT/C.CROWD_GROUND_SPREAD);   // 1→0：B1の余剰を時間をかけて地上へ移す
      const onB1=Math.round(half*frac), toGround=half-onB1;

      pedTargets[NF]=baseGroundTarget+toGround;      // 地上は徐々に増える＝分散的に順に出ていく
      if(crowdT<=0){

    };
    for(const s of stairs){
      const up=s.lvl===F, down=s.lvl===F-1; if(!up&&!down) continue;
      const dir=up?1:-1, half=0.45;   // 階段中央に小さく（オレンジが見えるように）
      const adx=s.adir[0]*dir, ady=s.adir[1]*dir;
      const x1=(s.cxTile-adx*half)*cs, y1=(s.cyTile-ady*half)*cs;
      const x2=(s.cxTile+adx*half)*cs, y2=(s.cyTile+ady*half)*cs;
      drawArrow(x1,y1,x2,y2, up?"#e0241a":"#2566d6");
    }
  }

  // ---------- ループ ----------
  const clock=new THREE.Clock();
  function loop(){
    const dt=Math.min(clock.getDelta(),0.05);
    if(running){
      updatePlayer(dt); updateChasers(dt); updateDrunk(dt); updateCrowd(dt); updatePedestrians(dt); updateDeco(dt); updateBoarders(flick); checkResult();
      drawMinimap();
      gameTime+=dt; timerEl.textContent="TIME "+fmtTime(gameTime);
      const alert = chasers.some(c=>c.showAlert);
      if(alert && !alertPrev){ sfxAlert(); statDetect++; }   // 新たに見つかった瞬間（回数を記録）
      alertPrev = alert;
      // 目標表示（運搬の状態を反映。一時メッセージ優先）
      if(drunkMsgT>0) goalEl.textContent=tr(drunkMsg);
      else if(carrying) goalEl.textContent = tr('goalDeliver',correctExitNo);
      else if(drunk && drunk.level!==1) goalEl.textContent = tr('goalFetch', floorName(drunk.level));   // 手放した後＝酔っ払いの現在フロアを指す
      else goalEl.textContent = tr('goalFind', lineName(targetLane));
      carryEl.classList.toggle("hidden", !carrying);            // 連れている＝緑
      lostEl.classList.toggle("hidden", carrying || lostT<=0);  // はぐれた＝赤（一定時間）
      // ミッション・ボックス（酔っぱらいを助ける＝回収中で緑チェック、手放すと赤✖に戻る）
      setMission(m1El, carrying, tr('mRescue'));
      setMission(m2El, false, tr('mEscape'));
      floorEl.textContent = tr('here', floorName(player.level));
      mapLabel.textContent = (lang==="en"?"MAP ("+floorName(player.level)+")":"MAP（"+floorName(player.level)+"）");
      subEl.style.display="none";   // プレイ中は「敵:徘徊／WASD移動…」の補助表示を消す
      // ダッシュ・スタミナのゲージ
      let dfrac, dcol, dtxt;
      if(dashBursting && dashBurstSpeed>=C.DASH_SPEED){ dfrac=dashBurstLeft/C.DASH_DUR; dcol="#33d17a"; dtxt=tr('dashFull',Math.ceil(dashBurstLeft)); }
      else if(dashBursting){ dfrac=dashBurstLeft/C.DASH_PARTIAL_DUR; dcol="#f0a93a"; dtxt=tr('dashPartial',Math.ceil(dashBurstLeft)); }
      else if(dashRecT>=C.DASH_FULL_AT){ dfrac=1; dcol="#33d17a"; dtxt=tr('dashReadyFull'); }              // 通常ダッシュ使用可
      else if(dashRecT>=C.DASH_PARTIAL_AT){ dfrac=1; dcol="#f0a93a"; dtxt=tr('dashReadyWeak',Math.ceil(C.DASH_FULL_AT-dashRecT)); }  // 弱ダッシュ使用可（通常まで）
      else { dfrac=dashRecT/C.DASH_PARTIAL_AT; dcol="#7a8088"; dtxt=tr('dashCoolWeak',Math.ceil(C.DASH_PARTIAL_AT-dashRecT)); }       // 回復中（弱まで）
      dashFillEl.style.width=(Math.max(0,Math.min(1,dfrac))*100)+"%"; dashFillEl.style.background=dcol; dashTxtEl.textContent=dtxt;
      // トイレが漏れる(GAME OVER)直前：10秒前から黄色い枠、3秒前からカウント表示
      const toiletLeft = (carrying && drunk && drunk.toiletStop<=0 && toiletState==="urge") ? toiletT : Infinity;
      if(toiletLeft<=C.TOILET_CRITICAL){
        toiletWarnEl.style.opacity = 0.3 + 0.5*Math.abs(Math.sin(flick*8));   // 黄色枠が点滅
        if(toiletLeft<=3){ toiletCountEl.textContent=Math.ceil(Math.max(0,toiletLeft)); toiletCountEl.style.display="block"; }
        else toiletCountEl.style.display="none";
      } else { toiletWarnEl.style.opacity=0; toiletCountEl.style.display="none"; }
    }
    // 敵に見つかって追われている間は画面周囲を赤く。さらに四隅で敵のいる方向を特に強く示す
    let nearChase=Infinity, nearC=null;
    if(running) for(const c of chasers){ if(!c.showAlert || c.level!==player.level) continue;
      const d=Math.hypot(c.x-player.x,c.z-player.z); if(d<nearChase){ nearChase=d; nearC=c; } }
    if(nearC){
      const prox=Math.max(0, Math.min(1, 1 - nearChase/(C.CHASER_SIGHT*2.2)));   // 近い=1 / 遠い=0
      const pulse=0.62 + 0.38*Math.abs(Math.sin(flick*11));
      alertEl.style.opacity = (0.14 + 0.4*prox) * pulse;                          // 全体は弱め
      // 敵の方向（カメラ基準）：正面=上 / 背後=下 / 右=右 / 左=左 → 近い隅を強い赤に
      const dx=nearC.x-player.x, dz=nearC.z-player.z;
      const fc=dx*fwd.x+dz*fwd.z, rc=dx*right.x+dz*right.z, bearing=Math.atan2(rc,fc);
      const strong=(0.55+0.6*prox)*pulse;
      const corners={ TR:Math.PI/4, BR:3*Math.PI/4, BL:-3*Math.PI/4, TL:-Math.PI/4 };
      for(const k in corners){ let da=bearing-corners[k]; while(da>Math.PI)da-=6.283185; while(da<-Math.PI)da+=6.283185;
        const w=Math.max(0,Math.cos(da)); cwEls[k].style.opacity = strong*w*w; }   // 近い方向ほど強い
    } else { alertEl.style.opacity=0; for(const k in cwEls) cwEls[k].style.opacity=0; }
    renderer.render(scene,camera);
    requestAnimationFrame(loop);
  }

  setupTouch(); loop();
})();
</script>
