<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>駅の出口探索ゲーム 3D（新宿駅風）</title>
<style>
  html, body { margin:0; padding:0; height:100%; background:#000; overflow:hidden;
    font-family:"Segoe UI","Hiragino Kaku Gothic ProN",Meiryo,sans-serif; color:#eee;
    user-select:none; -webkit-user-select:none; }
  #app { position:fixed; inset:0; }
  canvas { display:block; }

  /* HUD（上部中央） */
  #hud { position:fixed; top:0; left:0; right:0; padding:10px 14px; pointer-events:none;
    text-align:center; text-shadow:0 1px 3px #000; }
  #goal { font-size:18px; font-weight:bold; }
  #sub  { font-size:12px; color:#cdd3da; margin-top:2px; }

  /* テスト用ミニマップ（左上） */
  #map { position:fixed; top:10px; left:10px; z-index:6; border:2px solid rgba(0,0,0,.4);
    background:#fff; border-radius:4px; box-shadow:0 2px 8px rgba(0,0,0,.4); }

  /* 中央クロスヘア */
  #cross { position:fixed; left:50%; top:50%; width:6px; height:6px; margin:-3px 0 0 -3px;
    background:#fff; border-radius:50%; opacity:.6; pointer-events:none; }

  /* オーバーレイ */
  .overlay { position:fixed; inset:0; display:flex; flex-direction:column;
    align-items:center; justify-content:center; text-align:center;
    background:rgba(0,0,0,.7); z-index:10; }
  .hidden { display:none !important; }
  .overlay h1 { font-size:40px; margin:0 0 8px; }
  .overlay p { font-size:14px; color:#ccc; margin:4px 0; max-width:520px; line-height:1.6; }
  .overlay button { margin-top:18px; font-size:16px; padding:10px 26px; cursor:pointer;
    border:none; border-radius:8px; background:#4a90e2; color:#fff; }
  .clear { color:#5fd36a; } .over { color:#e25555; }

  /* スマホ用タッチ操作 */
  #touch { position:fixed; inset:0; z-index:5; display:none; }
  #pad { position:absolute; left:18px; bottom:18px; display:grid;
    grid-template-columns:repeat(3,56px); grid-template-rows:repeat(3,56px); gap:6px; }
  #pad div { background:rgba(0,0,0,.25); border:1px solid rgba(255,255,255,.4);
    border-radius:10px; display:flex; align-items:center; justify-content:center;
    font-size:22px; color:#fff; }
  #pad .up{grid-area:1/2} #pad .left{grid-area:2/1} #pad .down{grid-area:2/2} #pad .right{grid-area:2/3}
</style>
</head>
<body>

<!-- ====== 難易度・設定（ここを変えれば簡単に調整できます） ====== -->
<script>
const CONFIG = {
  // 迷路の広さ（マス数。大きいほど広い。奇数推奨）
  COLS: 15,
  ROWS: 13,
  TILE: 5,            // 1マスのワールドサイズ
  WALL_H: 3.6,        // 壁・天井の高さ

  MOVE_SPEED: 6.0,    // プレイヤーの移動速度（/秒）
  CHASER_SPEED: 3.2,  // 追跡者の速度（MOVE_SPEEDより小さいと逃げやすい）
  CATCH_DIST: 1.4,    // この距離まで近づかれると捕まる

  PEDESTRIAN_COUNT: 30, // 構内をうろつく歩行者の人数
  PED_SPEED: 1.6,       // 歩行者の歩く速さ

  MOUSE_SENS: 0.0022, // マウス感度
  INVERT_LOOK_X: true,// 視点の左右反転（true=今までと逆）
  INVERT_LOOK_Y: true,// 視点の上下反転（true=今までと逆）
  EYE_HEIGHT: 1.6,    // 視点の高さ

  // 通路を一方通行にせず、ループと広場を作る
  LOOP_PROB: 0.14,    // 余分な壁を壊して回り道を作る確率（0で純粋迷路）
  PLAZA_COUNT: 3,     // 開けた広場の数
  PLAZA_SIZE: 3,      // 広場の一辺のマス数

  EXIT_COUNT: 5,      // 出口の数（1つが正解）
  CORRECT_EXIT: null, // 正解の番号。null ならランダム

  SHOW_MAP: true,     // 左上のテスト用マップ表示
  FOG: true,          // 奥行きの霧（明るめ）
};
</script>
<!-- ========================================================= -->

<div id="app"></div>
<canvas id="map" class="hidden"></canvas>
<div id="cross" class="hidden"></div>
<div id="hud" class="hidden">
  <div id="goal"></div>
  <div id="sub">WASD / 矢印キーで移動　マウスで視点　ESCで一時停止</div>
</div>

<!-- スマホ用 -->
<div id="touch">
  <div id="pad">
    <div class="up">▲</div><div class="left">◀</div><div class="down">▼</div><div class="right">▶</div>
  </div>
</div>

<!-- 開始画面 -->
<div id="start" class="overlay">
  <h1>駅の出口探索 3D</h1>
  <p>白いタイル張りの駅構内を歩いて、指定された番号の<b>正しい出口</b>から脱出せよ。<br>
     構内には<b>赤い追跡者</b>がいる。捕まったらゲームオーバー。</p>
  <p style="color:#888">PC: クリックで開始（マウス視点＋WASD）／ スマホ: 画面ドラッグで視点・左下ボタンで移動</p>
  <button id="startBtn">クリックして開始</button>
</div>

<!-- 結果画面 -->
<div id="result" class="overlay hidden">
  <h1 id="resultText"></h1>
  <button id="restartBtn">もう一度</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function () {
  "use strict";
  if (typeof THREE === "undefined") {
    document.getElementById("start").innerHTML =
      "<h1>読み込み失敗</h1><p>Three.js を読み込めませんでした。ネット接続を確認して再読み込みしてください。</p>";
    return;
  }

  const C = CONFIG;
  const T = C.TILE;
  const lookX = C.INVERT_LOOK_X ? 1 : -1;
  const lookY = C.INVERT_LOOK_Y ? 1 : -1;

  // ---------- DOM ----------
  const app = document.getElementById("app");
  const hud = document.getElementById("hud");
  const cross = document.getElementById("cross");
  const goalEl = document.getElementById("goal");
  const startScreen = document.getElementById("start");
  const startBtn = document.getElementById("startBtn");
  const resultScreen = document.getElementById("result");
  const resultText = document.getElementById("resultText");
  const restartBtn = document.getElementById("restartBtn");
  const touch = document.getElementById("touch");
  const mapCv = document.getElementById("map");
  const mapCtx = mapCv.getContext("2d");
  const MAP_CELL = 11;

  // ---------- Three.js 基本 ----------
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x222831);
  if (C.FOG) scene.fog = new THREE.Fog(0x222831, T*3, T*11);

  const camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.05, 200);
  camera.rotation.order = "YXZ";

  const renderer = new THREE.WebGLRenderer({ antialias:true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
  app.appendChild(renderer.domElement);

  window.addEventListener("resize", () => {
    camera.aspect = window.innerWidth/window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });

  // やや明るい駅構内：環境光＋プレイヤーに付く白い照明で手元を照らす
  scene.add(new THREE.AmbientLight(0x6a727b, 0.9));
  scene.add(new THREE.HemisphereLight(0x8893a0, 0x20242a, 0.55));
  const lamp = new THREE.PointLight(0xffffff, 1.5, T*8, 2);
  camera.add(lamp);
  scene.add(camera);

  // ---------- 手続き的テクスチャ（白タイル） ----------
  function makeTileTexture(opts){
    const s=256, cv=document.createElement("canvas"); cv.width=cv.height=s;
    const g=cv.getContext("2d");
    g.fillStyle=opts.base; g.fillRect(0,0,s,s);
    const n=opts.div, step=s/n;
    g.strokeStyle=opts.grout; g.lineWidth=opts.line;
    for(let i=0;i<=n;i++){
      g.beginPath(); g.moveTo(i*step,0); g.lineTo(i*step,s); g.stroke();
      g.beginPath(); g.moveTo(0,i*step); g.lineTo(s,i*step); g.stroke();
    }
    if(opts.sheen){ // 各タイルに軽いハイライトで陶器っぽさ
      g.fillStyle="rgba(255,255,255,0.16)";
      for(let y=0;y<n;y++)for(let x=0;x<n;x++) g.fillRect(x*step+opts.line, y*step+opts.line, step*0.28, step*0.18);
    }
    const tex=new THREE.CanvasTexture(cv);
    tex.wrapS=tex.wrapT=THREE.RepeatWrapping; tex.anisotropy=4;
    return tex;
  }
  const wallTex  = makeTileTexture({ base:"#7d848c", grout:"#3e434a", line:6, div:4, sheen:true });
  const floorTex = makeTileTexture({ base:"#565b61", grout:"#33373c", line:7, div:2, sheen:false });
  const ceilTex  = makeTileTexture({ base:"#3c4148", grout:"#2a2e33", line:5, div:3, sheen:false });
  wallTex.repeat.set(2,2);

  // ---------- 数字テクスチャ（出口の番号：黄色い駅サイン風） ----------
  function exitSignTexture(n){
    const w=256,h=256,cv=document.createElement("canvas"); cv.width=w; cv.height=h;
    const g=cv.getContext("2d");
    g.fillStyle="#1a6b32"; g.fillRect(0,0,w,h);                 // 緑地（非常口/出口サイン色）
    g.strokeStyle="#ffffff"; g.lineWidth=10; g.strokeRect(8,8,w-16,h-16);
    g.fillStyle="#ffffff"; g.textAlign="center"; g.textBaseline="middle";
    g.font="bold 70px sans-serif"; g.fillText("出口", w/2, h*0.30);
    g.font="bold 130px sans-serif"; g.fillText(String(n), w/2, h*0.66);
    const tex=new THREE.CanvasTexture(cv); tex.anisotropy=4; return tex;
  }

  // ---------- 迷路生成（穴掘り法＋ループ＋広場） ----------
  let grid = [];
  function shuffle(a){ for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
  function isFloorTile(tx,ty){ return tx>=0&&ty>=0&&tx<C.COLS&&ty<C.ROWS&&grid[ty][tx]===0; }

  function generateMaze() {
    grid = [];
    for (let y=0;y<C.ROWS;y++) grid.push(new Array(C.COLS).fill(1));
    (function carve(cx,cy){
      grid[cy][cx]=0;
      for (const [dx,dy] of shuffle([[0,-2],[0,2],[-2,0],[2,0]])) {
        const nx=cx+dx, ny=cy+dy;
        if (ny>0 && ny<C.ROWS-1 && nx>0 && nx<C.COLS-1 && grid[ny][nx]===1) {
          grid[cy+dy/2][cx+dx/2]=0; carve(nx,ny);
        }
      }
    })(1,1);

    // ループを作る（行き止まりを減らし一方通行をなくす）
    for(let y=1;y<C.ROWS-1;y++){
      for(let x=1;x<C.COLS-1;x++){
        if(grid[y][x]===1){
          const horiz=isFloorTile(x-1,y)&&isFloorTile(x+1,y);
          const vert =isFloorTile(x,y-1)&&isFloorTile(x,y+1);
          if((horiz||vert) && Math.random()<C.LOOP_PROB) grid[y][x]=0;
        }
      }
    }

    // 広場（開けた空間）をいくつか作る。外周の壁は残す
    const sz=C.PLAZA_SIZE;
    for(let i=0;i<C.PLAZA_COUNT;i++){
      const rx=1+Math.floor(Math.random()*(C.COLS-1-sz));
      const ry=1+Math.floor(Math.random()*(C.ROWS-1-sz));
      for(let y=ry;y<ry+sz;y++)for(let x=rx;x<rx+sz;x++) grid[y][x]=0;
    }
  }

  // ワールド⇔タイル変換（x=列, z=行）
  function tileToWorld(tx,ty){ return { x:(tx+0.5)*T, z:(ty+0.5)*T }; }
  function worldIsFloor(x,z){ return isFloorTile(Math.floor(x/T), Math.floor(z/T)); }
  function canStand(x,z,r){
    return worldIsFloor(x-r,z-r)&&worldIsFloor(x+r,z-r)&&worldIsFloor(x-r,z+r)&&worldIsFloor(x+r,z+r);
  }
  function allFloorTiles(){ const a=[]; for(let y=0;y<C.ROWS;y++)for(let x=0;x<C.COLS;x++)if(grid[y][x]===0)a.push({x,y}); return a; }

  // ---------- ワールド構築 ----------
  const worldRoot = new THREE.Group();
  scene.add(worldRoot);
  let exits = [];
  let correctExitNo = 1;
  let chaser = null;
  let pedestrians = [];
  const PLAYER_R = T*0.22;
  const CHASER_R = T*0.22;
  const PED_R = T*0.16;

  // ---------- 人型モデル（歩行者） ----------
  const legGeo   = new THREE.CylinderGeometry(0.16, 0.16, 0.8, 8);
  const torsoGeo = new THREE.CylinderGeometry(0.24, 0.20, 0.75, 8);
  const headGeo  = new THREE.SphereGeometry(0.17, 12, 12);
  const skinMat  = new THREE.MeshLambertMaterial({ color:0xd8a87c });
  const legMat   = new THREE.MeshLambertMaterial({ color:0x2c3038 });
  const clothColors = [0x3a6ea5,0x4f7a4f,0x8a5a3c,0x6b6f76,0x7a4f6b,0xb0892f,0x2f6f73,0x445064,0x9a4b4b,0xcfcfcf];
  function makeHuman(cloth){
    const g = new THREE.Group();
    const legs  = new THREE.Mesh(legGeo, legMat);   legs.position.y  = 0.4;
    const torso = new THREE.Mesh(torsoGeo, new THREE.MeshLambertMaterial({ color:cloth })); torso.position.y = 1.05;
    const head  = new THREE.Mesh(headGeo, skinMat); head.position.y  = 1.5;
    g.add(legs, torso, head);
    return g;
  }

  const wallMat  = new THREE.MeshLambertMaterial({ map:wallTex,  color:0xffffff });
  const floorMat = new THREE.MeshLambertMaterial({ map:floorTex, color:0xffffff });
  const ceilMat  = new THREE.MeshLambertMaterial({ map:ceilTex,  color:0xffffff });
  const wallGeo  = new THREE.BoxGeometry(T, C.WALL_H, T);

  function buildWorld(){
    while (worldRoot.children.length) worldRoot.remove(worldRoot.children[0]);
    exits = [];
    pedestrians = [];
    const W = C.COLS*T, D = C.ROWS*T;

    // 床
    floorTex.repeat.set(W/2.2, D/2.2);
    const floor = new THREE.Mesh(new THREE.PlaneGeometry(W, D), floorMat);
    floor.rotation.x = -Math.PI/2; floor.position.set(W/2, 0, D/2);
    worldRoot.add(floor);
    // 天井
    ceilTex.repeat.set(C.COLS, C.ROWS);
    const ceil = new THREE.Mesh(new THREE.PlaneGeometry(W, D), ceilMat);
    ceil.rotation.x = Math.PI/2; ceil.position.set(W/2, C.WALL_H, D/2);
    worldRoot.add(ceil);

    // 壁
    for (let y=0;y<C.ROWS;y++){
      for (let x=0;x<C.COLS;x++){
        if (grid[y][x]===1){
          const w = tileToWorld(x,y);
          const m = new THREE.Mesh(wallGeo, wallMat);
          m.position.set(w.x, C.WALL_H/2, w.z);
          worldRoot.add(m);
        }
      }
    }

    // 天井の蛍光灯（通路マスにまばらに）
    const stripMat = new THREE.MeshBasicMaterial({ color:0xffffff });
    const floors = allFloorTiles();
    floors.forEach((t,i)=>{
      if(i%2!==0) return;
      const w = tileToWorld(t.x,t.y);
      const strip = new THREE.Mesh(new THREE.BoxGeometry(T*0.6, 0.08, T*0.16), stripMat);
      strip.position.set(w.x, C.WALL_H-0.06, w.z);
      worldRoot.add(strip);
    });

    // 出口を配置（プレイヤー[1,1]から遠い順、間隔をあけて）
    const start = tileToWorld(1,1);
    const sorted = floors.slice().sort((a,b)=>{
      const wa=tileToWorld(a.x,a.y), wb=tileToWorld(b.x,b.y);
      return Math.hypot(wb.x-start.x,wb.z-start.z) - Math.hypot(wa.x-start.x,wa.z-start.z);
    });
    const used = new Set(["1,1"]);
    const count = Math.min(C.EXIT_COUNT, Math.floor(sorted.length/3));
    for (const t of sorted){
      if (exits.length>=count) break;
      if (Math.abs(t.x-1)+Math.abs(t.y-1) < 3) continue;
      if (exits.some(e=>Math.abs(e.tx-t.x)+Math.abs(e.ty-t.y)<3)) continue;
      const w = tileToWorld(t.x,t.y);
      const no = exits.length+1;
      const panel = new THREE.Mesh(
        new THREE.PlaneGeometry(T*0.6, T*0.6),
        new THREE.MeshBasicMaterial({ map:exitSignTexture(no), side:THREE.DoubleSide })
      );
      panel.position.set(w.x, 2.2, w.z);
      const glow = new THREE.Mesh(
        new THREE.CircleGeometry(T*0.42, 24),
        new THREE.MeshBasicMaterial({ color:0x2ecf6b, transparent:true, opacity:0.30 })
      );
      glow.rotation.x = -Math.PI/2; glow.position.set(w.x, 0.03, w.z);
      const g = new THREE.Group(); g.add(panel); g.add(glow); g._panel = panel;
      worldRoot.add(g);
      exits.push({ no, tx:t.x, ty:t.y, x:w.x, z:w.z, group:g });
      used.add(t.x+","+t.y);
    }

    correctExitNo = (C.CORRECT_EXIT && exits.some(e=>e.no===C.CORRECT_EXIT))
      ? C.CORRECT_EXIT : exits[Math.floor(Math.random()*exits.length)].no;

    // 追跡者（赤い人型）
    let ct=null;
    for (const t of sorted){ if(!used.has(t.x+","+t.y)){ ct=t; break; } }
    if(!ct) ct=sorted[0];
    const cw=tileToWorld(ct.x,ct.y);
    const cGroup=new THREE.Group();
    const body=new THREE.Mesh(new THREE.CylinderGeometry(CHASER_R, CHASER_R, 1.5, 12),
      new THREE.MeshLambertMaterial({ color:0xe23b3b, emissive:0x440000 }));
    body.position.y=0.9;
    const head=new THREE.Mesh(new THREE.SphereGeometry(CHASER_R*0.9,12,12),
      new THREE.MeshLambertMaterial({ color:0xff6a6a, emissive:0x440000 }));
    head.position.y=1.9;
    cGroup.add(body); cGroup.add(head); cGroup.position.set(cw.x,0,cw.z);
    worldRoot.add(cGroup);
    chaser={ group:cGroup, x:cw.x, z:cw.z };

    // 歩行者を配置（構内をうろつく一般人。捕まえてはこない）
    for (let i=0;i<C.PEDESTRIAN_COUNT;i++){
      const t = floors[Math.floor(Math.random()*floors.length)];
      if (Math.abs(t.x-1)+Math.abs(t.y-1) < 2) continue; // 開始地点付近は避ける
      const w = tileToWorld(t.x,t.y);
      const px = w.x + (Math.random()-0.5)*T*0.4;
      const pz = w.z + (Math.random()-0.5)*T*0.4;
      const g = makeHuman(clothColors[i % clothColors.length]);
      g.position.set(px, 0, pz);
      worldRoot.add(g);
      pedestrians.push({ group:g, x:px, z:pz, dir:Math.random()*Math.PI*2, timer:0 });
    }
  }

  // ---------- プレイヤー / 入力 ----------
  const player = { x:0, z:0, yaw:0, pitch:0 };
  const keys = {};
  let running = false, locked = false;

  window.addEventListener("keydown", e=>{
    const k=e.key.toLowerCase(); keys[k]=true;
    if (["arrowup","arrowdown","arrowleft","arrowright"].includes(k)) e.preventDefault();
  });
  window.addEventListener("keyup", e=>{ keys[e.key.toLowerCase()]=false; });

  function applyLook(mx,my,sens){
    player.yaw   += mx * sens * lookX;
    player.pitch += my * sens * lookY;
    const lim = Math.PI/2 - 0.05;
    player.pitch = Math.max(-lim, Math.min(lim, player.pitch));
  }

  const canvasEl = renderer.domElement;
  document.addEventListener("mousemove", e=>{ if(locked) applyLook(e.movementX, e.movementY, C.MOUSE_SENS); });
  document.addEventListener("pointerlockchange", ()=>{
    locked = (document.pointerLockElement === canvasEl);
    if (running && !locked) pauseToStart();
  });
  function requestLock(){ if(canvasEl.requestPointerLock) canvasEl.requestPointerLock(); }

  // ---------- スマホ操作 ----------
  const isTouch = ("ontouchstart" in window) || navigator.maxTouchPoints>0;
  let lookTouchId=null, lastLook=null;
  function setupTouch(){
    if(!isTouch) return;
    touch.style.display="block";
    touch.addEventListener("touchstart", e=>{
      for(const t of e.changedTouches){
        if(t.target.closest("#pad")) continue;
        if(lookTouchId===null){ lookTouchId=t.identifier; lastLook={x:t.clientX,y:t.clientY}; }
      }
    }, {passive:true});
    touch.addEventListener("touchmove", e=>{
      for(const t of e.changedTouches){
        if(t.identifier===lookTouchId && lastLook){
          applyLook(t.clientX-lastLook.x, t.clientY-lastLook.y, 0.005);
          lastLook={x:t.clientX,y:t.clientY};
        }
      }
    }, {passive:true});
    touch.addEventListener("touchend", e=>{
      for(const t of e.changedTouches){ if(t.identifier===lookTouchId){ lookTouchId=null; lastLook=null; } }
    }, {passive:true});
    const map={up:"w",down:"s",left:"a",right:"d"};
    document.querySelectorAll("#pad div").forEach(el=>{
      const key=map[el.className];
      const on =e=>{ e.preventDefault(); keys[key]=true; };
      const off=e=>{ e.preventDefault(); keys[key]=false; };
      el.addEventListener("touchstart",on,{passive:false});
      el.addEventListener("touchend",off,{passive:false});
      el.addEventListener("touchcancel",off,{passive:false});
    });
  }

  // ---------- ゲーム進行 ----------
  function startGame(){
    generateMaze();
    buildWorld();
    const s = tileToWorld(1,1);
    player.x=s.x; player.z=s.z; player.yaw=0; player.pitch=0;
    goalEl.textContent = "目標：" + correctExitNo + "番出口へ脱出せよ";
    hud.classList.remove("hidden");
    cross.classList.toggle("hidden", isTouch);
    if(C.SHOW_MAP){ mapCv.width=C.COLS*MAP_CELL; mapCv.height=C.ROWS*MAP_CELL; mapCv.classList.remove("hidden"); }
    startScreen.classList.add("hidden");
    resultScreen.classList.add("hidden");
    running = true;
    if(!isTouch) requestLock();
  }
  function pauseToStart(){
    if(!running) return;
    running=false;
    startBtn.textContent="クリックして再開";
    startScreen.querySelector("h1").textContent="一時停止中";
    startScreen.classList.remove("hidden");
  }
  function endGame(cleared){
    running=false;
    if(document.exitPointerLock) document.exitPointerLock();
    resultText.textContent = cleared ? "CLEAR!" : "GAME OVER";
    resultText.className = cleared ? "clear" : "over";
    resultScreen.classList.remove("hidden");
    cross.classList.add("hidden");
  }

  startBtn.addEventListener("click", ()=>{
    if (startScreen.querySelector("h1").textContent==="一時停止中"){
      startScreen.classList.add("hidden"); running=true; if(!isTouch) requestLock();
    } else startGame();
  });
  restartBtn.addEventListener("click", startGame);
  canvasEl.addEventListener("click", ()=>{ if(running && !isTouch && !locked) requestLock(); });

  // ---------- 移動・更新 ----------
  const fwd = new THREE.Vector3(), right = new THREE.Vector3(), up = new THREE.Vector3(0,1,0);
  function moveAxis(dx,dz){
    if (dx!==0 && canStand(player.x+dx, player.z, PLAYER_R)) player.x+=dx;
    if (dz!==0 && canStand(player.x, player.z+dz, PLAYER_R)) player.z+=dz;
  }
  function updatePlayer(dt){
    camera.rotation.set(player.pitch, player.yaw, 0);
    camera.getWorldDirection(fwd); fwd.y=0; fwd.normalize();
    right.crossVectors(fwd, up).normalize();
    let mf=0, ms=0;
    if(keys["w"]||keys["arrowup"]) mf+=1;
    if(keys["s"]||keys["arrowdown"]) mf-=1;
    if(keys["d"]||keys["arrowright"]) ms+=1;
    if(keys["a"]||keys["arrowleft"]) ms-=1;
    let vx = fwd.x*mf + right.x*ms, vz = fwd.z*mf + right.z*ms;
    const len=Math.hypot(vx,vz);
    if(len>0){ vx=vx/len*C.MOVE_SPEED*dt; vz=vz/len*C.MOVE_SPEED*dt; moveAxis(vx,vz); }
    camera.position.set(player.x, C.EYE_HEIGHT, player.z);
  }
  function updateChaser(dt){
    let dx=player.x-chaser.x, dz=player.z-chaser.z;
    const len=Math.hypot(dx,dz);
    if(len>0.001){
      dx=dx/len*C.CHASER_SPEED*dt; dz=dz/len*C.CHASER_SPEED*dt;
      const bx=chaser.x, bz=chaser.z;
      if(canStand(chaser.x+dx, chaser.z, CHASER_R)) chaser.x+=dx;
      if(canStand(chaser.x, chaser.z+dz, CHASER_R)) chaser.z+=dz;
      if(chaser.x===bx && chaser.z===bz){
        const alt = Math.abs(dx)>Math.abs(dz)
          ? [[0, C.CHASER_SPEED*dt],[0,-C.CHASER_SPEED*dt]]
          : [[C.CHASER_SPEED*dt,0],[-C.CHASER_SPEED*dt,0]];
        for(const [ax,az] of alt){ if(canStand(chaser.x+ax,chaser.z+az,CHASER_R)){ chaser.x+=ax; chaser.z+=az; break; } }
      }
      chaser.group.position.set(chaser.x, 0, chaser.z);
      chaser.group.lookAt(player.x, 1, player.z);
    }
  }
  function checkResult(){
    if(Math.hypot(player.x-chaser.x, player.z-chaser.z) < C.CATCH_DIST){ endGame(false); return; }
    for(const e of exits){
      if(Math.hypot(player.x-e.x, player.z-e.z) < T*0.45 && e.no===correctExitNo){ endGame(true); return; }
    }
  }
  function updatePedestrians(dt){
    for(const p of pedestrians){
      p.timer -= dt;
      if(p.timer<=0){ p.dir = Math.random()*Math.PI*2; p.timer = 1.5 + Math.random()*3; }
      const nx = Math.cos(p.dir)*C.PED_SPEED*dt;
      const nz = Math.sin(p.dir)*C.PED_SPEED*dt;
      let moved = false;
      if(canStand(p.x+nx, p.z, PED_R)){ p.x+=nx; moved=true; }
      if(canStand(p.x, p.z+nz, PED_R)){ p.z+=nz; moved=true; }
      if(!moved){ p.dir = Math.random()*Math.PI*2; p.timer = 0.5; } // 壁にぶつかったら方向転換
      p.group.position.set(p.x, 0, p.z);
      p.group.rotation.y = -p.dir + Math.PI/2;
    }
  }

  let flick=0;
  function updateDeco(dt){
    for(const e of exits){ if(e.group._panel) e.group._panel.lookAt(player.x, 2.2, player.z); }
    flick += dt; lamp.intensity = 1.5 + Math.sin(flick*9)*0.08;
  }

  // ---------- ミニマップ描画 ----------
  function drawMinimap(){
    if(!C.SHOW_MAP) return;
    const cs=MAP_CELL;
    mapCtx.clearRect(0,0,mapCv.width,mapCv.height);
    for(let y=0;y<C.ROWS;y++)for(let x=0;x<C.COLS;x++){
      mapCtx.fillStyle = grid[y][x]===1 ? "#5b626b" : "#eef1f4";
      mapCtx.fillRect(x*cs, y*cs, cs, cs);
    }
    // 出口
    for(const e of exits){
      const px=(e.x/T)*cs, py=(e.z/T)*cs;
      mapCtx.fillStyle = (e.no===correctExitNo) ? "#f5b50a" : "#2ecf6b";
      mapCtx.fillRect(px-cs*0.45, py-cs*0.45, cs*0.9, cs*0.9);
      mapCtx.fillStyle="#10331c"; mapCtx.font="bold 9px sans-serif";
      mapCtx.textAlign="center"; mapCtx.textBaseline="middle";
      mapCtx.fillText(String(e.no), px, py);
    }
    // 歩行者（薄いグレーの点）
    mapCtx.fillStyle="#9aa1aa";
    for(const p of pedestrians){
      mapCtx.beginPath(); mapCtx.arc((p.x/T)*cs,(p.z/T)*cs, cs*0.18, 0, Math.PI*2); mapCtx.fill();
    }
    // 追跡者
    if(chaser){
      mapCtx.fillStyle="#e23b3b"; mapCtx.beginPath();
      mapCtx.arc((chaser.x/T)*cs,(chaser.z/T)*cs, cs*0.4, 0, Math.PI*2); mapCtx.fill();
    }
    // プレイヤー＋向き
    const px=(player.x/T)*cs, py=(player.z/T)*cs;
    mapCtx.strokeStyle="#1f6dd0"; mapCtx.lineWidth=2;
    mapCtx.beginPath(); mapCtx.moveTo(px,py);
    mapCtx.lineTo(px+fwd.x*cs*1.2, py+fwd.z*cs*1.2); mapCtx.stroke();
    mapCtx.fillStyle="#1f6dd0"; mapCtx.beginPath();
    mapCtx.arc(px,py, cs*0.4, 0, Math.PI*2); mapCtx.fill();
  }

  // ---------- メインループ ----------
  const clock = new THREE.Clock();
  function loop(){
    const dt = Math.min(clock.getDelta(), 0.05);
    if(running){
      updatePlayer(dt);
      updateChaser(dt);
      updatePedestrians(dt);
      updateDeco(dt);
      checkResult();
      drawMinimap();
    }
    renderer.render(scene, camera);
    requestAnimationFrame(loop);
  }

  setupTouch();
  loop();
})();
</script>
</body>
</html>
